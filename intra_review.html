        <span class="k">현장</span><span>경기 고양시 일산동구 · 상가 지하</span><span class="k">용도</span><span>여러 방을 나누는 공사</span>
        <span class="k">공간</span><span>13.3 × 9.5 m · 천장 2.6 m</span><span class="k">사용 시간</span><span>저녁 10시까지</span>
        <span class="k">소리</span><span>노래 · 보컬 · 통기타 · 클래식 기타</span><span class="k">장비</span><span>전자피아노 · 일렉기타 앰프 · 베이스 앰프 · 모니터 스피커</span>
      </div><div class="q-q"><span class="q-n">Q1.</span> 공간의 소리는 어디에 있는가</div><p class="q-p q-ed" data-f="q1">판단을 정하는 것은 <b>모니터 스피커의 40 Hz 저음</b>, 그리고 연주 시 <b>약 110 dB</b>의 음량입니다.
      저녁 시간 이웃 기준 40 dB — 막아야 하는 양은 <b>70 dB</b>입니다. 그런데 문제는 양보다 <b>높이</b>입니다. 보드를 겹친 벽은 200 Hz 아래에서 힘을 잃는데, 이 현장의 소리는 전부 그 아래까지 내려갑니다.</p><div class="q-chart"><svg viewBox="0 0 960 214" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><rect x="60" y="10" width="494.4172044569343" height="164" fill="#f6e7e5"></rect><text x="70" y="122" font-size="15" font-weight="700" fill="#a8281b">일반 칸막이벽이 놓치는 대역</text><text x="70" y="140" font-size="13" fill="#a8281b">약 200 Hz 아래 — 구조로 잡는 구간</text><rect x="208.83440891386866" y="37" width="691.1655910861314" height="10" rx="5" fill="#e3b23c"></rect><circle cx="208.83440891386866" cy="42" r="9" fill="#e3b23c" stroke="#1b2a38" stroke-width="2"></circle><text x="210.83440891386866" y="30" font-size="15" font-weight="700" fill="#1b2a38">모니터 스피커 · 베이스 앰프 <tspan font-weight="400" fill="#6b6a63" font-size="13">40 Hz</tspan></text><rect x="295.8969569454804" y="68" width="604.1030430545196" height="10" rx="5" fill="#cfd3d8"></rect><circle cx="295.8969569454804" cy="73" r="6" fill="#1b2a38" stroke="none" stroke-width="2"></circle><text x="297.8969569454804" y="61" font-size="15" font-weight="700" fill="#1b2a38">전자피아노 <tspan font-weight="400" fill="#6b6a63" font-size="13">60 Hz</tspan></text><rect x="362.9708813757102" y="99" width="537.0291186242898" height="10" rx="5" fill="#cfd3d8"></rect><circle cx="362.9708813757102" cy="104" r="6" fill="#1b2a38" stroke="none" stroke-width="2"></circle><text x="364.9708813757102" y="92" font-size="15" font-weight="700" fill="#1b2a38">통기타 · 클래식 기타 · 일렉기타 앰프 <tspan font-weight="400" fill="#6b6a63" font-size="13">82 Hz</tspan></text><rect x="405.58279554306574" y="130" width="494.41720445693426" height="10" rx="5" fill="#cfd3d8"></rect><circle cx="405.58279554306574" cy="135" r="6" fill="#1b2a38" stroke="none" stroke-width="2"></circle><text x="407.58279554306574" y="123" font-size="15" font-weight="700" fill="#1b2a38">노래 · 보컬 <tspan font-weight="400" fill="#6b6a63" font-size="13">10       <p class="q-cap">막대는 각 소리의 대역, 동그라미는 가장 낮은 음. 위쪽은 보통 벽으로도 잡히지만 시작점은 전부 붉은 구간 안입니다.</p>
      <p class="q-red">본 어쿠스틱랩은 고객과의 협의를 통해 목표를 잡아서, 그에 맞는 음향설계와 시공 디테일을 만들어 갑니다.</p><div class="q-q"><span class="q-n">Q2.</span> 현장에서 중요한 세 가지</div><p class="q-p q-ed" data-f="q2" data-i="0"><b>첫째, 이웃보다 옆방입니다.</b> 지하라 밖으로 나갈 소리는 적습니다. 대신 한 방의 소리가 옆방 마이크에 들어가는 순간, 그 방은 제 역할을 못 합니다.</p><p class="q-p q-ed" data-f="q2" data-i="1"><b>둘째, 천장 2.6 m가 설계를 정합니다.</b> 저음을 막는 바닥과 천장을 다 넣으면 실높이는 <b>약 2.1 m</b>. 그래서 방마다 등급을 다르게 배분하며, 그 배분이 이 공사의 핵심입니다.</p><p class="q-p q-ed" data-f="q2" data-i="2"><b>셋째, 막는 것과 울림은 다른 문제입니다.</b> 방마다 목표 잔향이 다르며, 이는 음향설계 이론과 시공 노하우가 만나 최선의 선택으로 만들어집니다.</p><div class="q-q"><span class="q-n">Q3.</span> 추후 현장미팅 시 협의내용</div>
    <div class="q-abc"><div><span class="q-b">A</span><b>현장 여건</b><p>실측 / 인접실 · 주변 상황 / 원상복구 등 / 클라이언트 의견 &amp; 요구사항</p></div><div><span class="q-b">B</span><b>평면 계획</b><p>건축물 용도 / 방의 배치 / 급배기 · 전기 인입 위치 / 인테리어 디자인 취향</p></div><div><span class="q-b">C</span><b>룸어쿠스틱</b><p>목표 잔향 / 저역 공진 처리 / 흡음 · 확산 마감</p></div></div>

function q03LoadHTML(id){ try{ return localStorage.getItem("q03html:"+id)||""; }catch(e){ return ""; } }
function q03DriveName(id){ return `사전검토서_${q03FileName(id)}.html`; }
/* 드라이브 저장 — 접수 건 폴더에 HTML 파일로 (기존 addfiles 통로) */
async function q03Upload(id, html){
  const bytes=new TextEncoder().encode(html); let bin=""; for(let i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+8192));
  const b64=btoa(bin), name=q03DriveName(id);
  let err="";
  /* putfile(같은 이름 덮어쓰기)이 있으면 그것을, 없으면 addfiles(새 파일 추가)로 */
  try{ const r1=await api({action:"putfile", id, name, type:"text/html", data:b64, pass:ADMIN_PASS});
       if(r1&&r1.ok) return {ok:true,url:r1.url||"",how:"putfile"}; err=(r1&&r1.error)||""; }catch(e){ err=String(e); }
  if(err!=="unknown action"){ /* putfile 이 있는데 실패 → 그대로 보고 */ if(err) return {ok:false,err}; }
  try{ const r2=await api({action:"addfiles", id, files:[{name, type:"text/html", data:b64}], pass:ADMIN_PASS});
       if(!(r2&&r2.ok)) return {ok:false,err:(r2&&r2.error)||"addfiles 실패"};
       if(!r2.count) return {ok:false,err:"드라이브 쓰기 실패 — "+(String(r2.url||"").indexOf("ERR")===0?r2.url:"스크립트 권한 확인")};
  }catch(e){ return {ok:false,err:String(e)}; }
  /* 실제로 폴더에 있는지 확인하고 링크를 받는다 */
  try{ const r3=await api({action:"files", id, pass:ADMIN_PASS});
       const f=(r3&&r3.items||[]).find(x=>x.name===name);
       return f ? {ok:true,url:f.url,how:"addfiles"} : {ok:false,err:"올렸는데 폴더에서 안 보임 — 배포 계정의 드라이브를 확인"}; }catch(e){}
  return {ok:true,url:"",how:"addfiles"};
}
/* 드라이브에서 가져오기 — AppsScript 에 getfile 액션이 있어야 한다 (없으면 조용히 실패) */
async function q03Fetch(id){
  try{ const res=await api({action:"getfile", id, name:q03DriveName(id), pass:ADMIN_PASS});
       if(res&&res.ok&&res.data){ const bin=atob(res.data); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
         return new TextDecoder().decode(bytes); } }catch(e){}
  return "";
}

function reviewDigest(id){
  const c=[];
  c.push(`[접수] ${id||"—"} · ${(D.name||"").trim()} · ${fmt(window.__lastRec&&window.__lastRec.at)} 접수 · 담당 ${D.staff||"—"}`);
  const site=`${D.sido||""} ${D.gu||""}${D.bldg?" · "+D.bldg:""}${D.floor?" · "+D.floor:""}`.trim();
  c.push(`현장: ${site} / 공간: ${D.noSize?"실측 예정":D.w+" × "+D.d+" m"}${D.noH?" · 천장 실측 예정":" · 천장 "+D.h+" m"} / 용도: ${D.space==="기타"?D.spaceEtc:D.space} / 사용: ${D.when||"—"} / 계약: ${D.ct||"—"} · ${D.pt==="희망 날짜 지정"?D.pd:D.pt||"—"} / 예산: ${D.bTBD?"상담 후 결정":D.bud+" 만원"}`);
  const snd=D.sounds.filter(x=>x!=="그 밖의 악기"); if(D.soundEtc) snd.push(D.soundEtc);
  c.push(`소리: ${snd.join(", ")||"—"}`);
  if((D.rooms||[]).length) c.push(`실: `+D.rooms.map(r=>`${r.name} ${r.use||"?"} ${r.w&&r.d?r.w+"×"+r.d+(r.h?"×"+r.h:""):"치수 미정"} [${r.sounds.join(",")||"소리 없음"}]`).join(" / "));
  c.push(``); c.push(`=== 검토서 ===`);
  const tmp=document.createElement("div"); tmp.innerHTML=briefHTML();
  tmp.querySelectorAll("select").forEach(s=>{ const o=s.options[s.selectedIndex]; s.replaceWith(document.createTextNode(o?o.textContent:"")); });
  tmp.querySelectorAll("button").forEach(b=>b.remove());
  const one=el=>el.textContent.replace(/\s+/g," ").trim();
  tmp.querySelectorAll("tr").forEach(tr=>{ const cells=[...tr.querySelectorAll("th,td")].map(one); tr.replaceWith(document.createTextNode(cells.join(" | ")+"\n")); });
  tmp.querySelectorAll(".bh,.bg,.bp,.bl,.bw,.hint,.rm-h,.lb").forEach(el=>{ el.replaceWith(document.createTextNode(one(el)+"\n")); });
  const text=tmp.textContent.split("\n").map(l=>l.trim()).join("\n").replace(/\n{3,}/g,"\n\n").trim();
  c.push(text);
  return c.join("\n");
}

/* 아파트형 단면 규칙 — 지금은 확정된 원칙만. 아파트 단면 자료가 오면 부위별로 채운다 */
function aptNoteHTML(B){

/* 아파트형 · M 시리즈가 어디까지 잡는가 — 시트에 f₀ · STC 수치가 없어 대역별 대응으로 판정한다 */
function aptReachHTML(B){
  const A=B.apt;
  const BANDS=[
    {k:"100Hz 이상", test:f=>f>=100, C:"M1 대응", W:"M1 · M2 · M3 대응", cls:"ok"},
    {k:"60 ~ 100Hz", test:f=>f>=60&&f<100, C:"M2 보완 — 100Hz 딥 완화, 삼중 리프는 남음", W:A.party==="건식"?"M3 불리 — 리프 4장 이상, 앰프 불가":"M2 콘크리트 — 실질 이중, 부분 대응", cls:"warn"},
    {k:"60Hz 이하", test:f=>f<60, C:"비대응 — 대출력 저역", W:"전 등급 불가 — 킥드럼 40~60Hz · 서브우퍼", cls:"bad"}
  ];
  let h=`<div class="bp">아파트형은 등급 사다리(L1~L5)가 아니라 <b>M 시리즈가 대응하는 대역</b>으로 본다. 기존 천장 존치 · 슬래브 무접촉 조건이라 저역 상한이 구조적으로 정해져 있다.</div>`;
  h+=`<table class="bt"><tr><th>대역</th><th>천장</th><th>벽 (경계벽 ${A.party})</th><th>체크하신 소리</th></tr>`;
  BANDS.forEach(b=>{
    const hits=B.picked.filter(([,f])=>b.test(f)).map(([n,f])=>`${n} ${f}`);
    h+=`<tr class="${hits.length?(b.cls==="bad"?"hi":""):""}"><td class="b">${b.k}</td><td class="ins ${b.cls}">${b.C}</td><td class="ins ${b.cls}">${b.W}</td><td>${hits.join(", ")||"—"}</td></tr>`;
  });
  h+=`</table>`;
  const bad=B.picked.filter(([,f])=>f<60), mid=B.picked.filter(([,f])=>f>=60&&f<100);
  B.picked.forEach(([n])=>{ const d=noteOf(n); if(d && (d.booth==="X" || /큼/.test(d.vib||""))) h+=`<div class="hint"><b>${n}</b> — 비고판: ${d.note}</div>`; });
  if(bad.length) h+=`<div class="bw"><b>${bad.map(x=>x[0]).join(", ")} — 아파트 구조에서 대응 불가.</b> 킥드럼 · 서브우퍼 · 베이스 저역은 어떤 벽 사양으로도 민원을 피하기 어렵다. 아파트가 아닌 현장으로 안내하거나, 음원을 바꾸는 것(전자드럼 헤드폰 · 서브우퍼 제거)이 전제다.</div>`;
  if(mid.length) h+=`<div class="hint"><b>${mid.map(x=>x[0]).join(", ")} — 천장 M2로 보완</b>하되 "막는다"가 아니라 "줄인다"로 설명한다. 100Hz 딥은 완화될 뿐 삼중 리프가 남고, 대출력이면 비대응이다.</div>`;
  if(B.hit) h+=`<div class="bw"><b>충격음 — 위층 · 아래층 전달 비대응.</b> 기존 천장 존치 조건에서 구조적으로 불가하며 계약 전 서면 고지한다.</div>`;
  h+=`<div class="bp"><b>설계 기준 · M 시리즈 상한 100Hz(M1), 보완 60~100Hz(M2).</b> 그 아래는 아파트에서 다루지 않는다. 벽 등급보다 <b>기존 벽 종류(콘크리트/건식)</b>와 창호 · 기밀이 결과를 정한다.</div>`;
  return h;
}

  g("q03Copy").onclick=e=>copyDigest(id, e.target);
  g("q03Apply").onclick=()=>{ const v=g("q03Paste").value.trim();
    if(!v){ alert("붙여넣을 HTML이 비어 있습니다."); return; }
    if(!/<html[\s>]/i.test(v)){ alert("HTML 전체(<html> … </html>)를 붙여넣어 주세요."); return; }
    D.q03.html=v; q03StoreHTML(id,v); paint(); st("드라이브에 올리는 중…");
    q03Upload(id,v).then(r=>{ if(r.ok){ g("q03St").innerHTML=`드라이브 저장됨 · ${r.url?`<a href="${r.url}" target="_blank">${q03DriveName(id)} ↗</a>`:q03DriveName(id)}${r.how==="addfiles"?" <small>(putfile 미배포 — 적용마다 파일이 추가됨)</small>":""}`; }
      else st("드라이브 저장 실패: "+r.err+" — 브라우저에만 저장됨"); }).catch(e=>st("드라이브 저장 실패 — 브라우저에만 저장됨")); };
  g("q03Clear").onclick=()=>{ if(D.q03.html && !confirm("붙여넣은 문서를 지웁니다.")) return; D.q03.html=""; q03StoreHTML(id,""); paint(); };
  g("q03Back").onclick=()=>toggleQ03(id);
  g("q03Html").onclick=()=>{ if(!D.q03.html){ alert("먼저 HTML을 붙여넣고 적용하세요."); return; }
    dl(q03FileName(id)+".html", new Blob([D.q03.html],{type:"text/html;charset=utf-8"})); };
  g("q03Jpg").onclick=e=>q03Image(id, e.target);
  g("q03Print").onclick=()=>{ const f=g("q03Frame");
    if(!f||!f.contentWindow){ alert("먼저 HTML을 붙여넣고 적용하세요."); return; }
    f.contentDocument.title=q03FileName(id); f.contentWindow.focus(); f.contentWindow.print(); };
  if(btn) btn.textContent="◀ 검토서";
  window.scrollTo(0,0);
}

/* ══════════════ 보류 · 진행포기 기록 — 사유 + 자료를 드라이브 하위 폴더에 ══════════════ */
const NOTE_TABS = ["보류","진행포기"];
const NOTE_FILE = "사유.md";
let NOTE_TAB = "보류", NOTE_PICK = [];

function notesHTML(status){
  const cur = NOTE_TABS.includes(status) ? status : null;
  return `<details class="notes" id="notes"${cur?" open":""}>
    <summary><b>보류 · 진행포기 기록</b><span class="nt-sub">${cur?`현재 상태 <em>${cur}</em> — 사유와 자료를 남겨 두면 같은 사유가 또 왔을 때 바로 꺼낼 수 있다.`:"지금은 진행 중. 미리 적어 둘 수도 있다."}</span></summary>
    <div class="nt-b">
      <div class="nt-tabs">${NOTE_TABS.map(t=>`<button class="nt-tab${t===NOTE_TAB?" on":""}" data-t="${t}">${t}</button>`).join("")}
        <span class="nt-path" id="ntPath"></span></div>
      <textarea id="ntText" placeholder="왜 ${NOTE_TAB}인지 — 예) 건축물 용도변경(창고→2종 근생) 허가가 먼저. 지하층 직통계단 1개라 탈출구 성립 여부에 따라 전체/축소 갈림"></textarea>
      <div class="nt-files">
        <div class="drop nt-drop" id="ntDrop"><div class="t">자료 선택 또는 여기로 끌어놓기</div><div class="s">정리 이미지 · 도면 · PDF · 캡처 — 여러 개 가능</div>
          <input type="file" id="ntFile" multiple style="display:none"></div>
        <div class="nt-pick" id="ntPick"></div>
        <div class="nt-list" id="ntList"><span class="nt-dim">드라이브 확인 중…</span></div>
      </div>
      <div class="nt-foot"><span class="nt-st" id="ntSt"></span>
        <button class="rmb solid" id="ntSave">사유 · 자료 저장</button></div>
    </div></details>`;
}

async function notesLoad(id){
  const g=x=>document.getElementById(x);
  g("ntPath").textContent=`${id} / ${NOTE_TAB} /`;
  g("ntText").value=""; g("ntList").innerHTML=`<span class="nt-dim">드라이브 확인 중…</span>`;
  try{
    const [txt, lst] = await Promise.all([
      api({action:"getfile", id, name:NOTE_FILE, sub:NOTE_TAB, pass:ADMIN_PASS}),
      api({action:"files", id, sub:NOTE_TAB, pass:ADMIN_PASS})
    ]);
    if(txt&&txt.ok&&txt.data){ const bin=atob(txt.data); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      g("ntText").value=new TextDecoder().decode(bytes).replace(/^# .*\n+/,""); }
    const items=(lst&&lst.items||[]).filter(f=>f.name!==NOTE_FILE);
    g("ntList").innerHTML = items.length
      ? items.map(f=>`<a class="nt-f" href="${f.url}" target="_blank">${f.name}<small>${fmt(f.at)}</small></a>`).join("")
      : `<span class="nt-dim">올린 자료 없음</span>`;
  }catch(e){ g("ntList").innerHTML=`<span class="nt-dim">드라이브 조회 실패</span>`; }
}

function fileToB64(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=rej;
    fr.onload=()=>res({name:file.name, type:file.type||"application/octet-stream", data:String(fr.result).split(",")[1]}); fr.readAsDataURL(file); });
}
async function notesPick(list){
  for(const f of [...list]){
    if(f.size>15*1024*1024){ alert(f.name+" — 15MB를 넘습니다."); continue; }
    try{ NOTE_PICK.push(f.type.indexOf("image/")===0 ? await shrink(f) : await fileToB64(f)); }catch(e){}
  }
  paintPick();
}
function paintPick(){
  const p=document.getElementById("ntPick"); if(!p) return;
  p.innerHTML = NOTE_PICK.map((f,i)=>`<span class="nt-p">${f.thumb?`<img src="${f.thumb}">`:"📄"} ${f.name}<button data-i="${i}">×</button></span>`).join("");
  p.querySelectorAll("button").forEach(b=>b.onclick=()=>{ NOTE_PICK.splice(+b.dataset.i,1); paintPick(); });
}

async function notesSave(id){
  const g=x=>document.getElementById(x), btn=g("ntSave"), st=m=>g("ntSt").textContent=m;
  const text=g("ntText").value.trim();
  if(!text && !NOTE_PICK.length){ st("적은 내용이나 파일이 없습니다."); return; }
  btn.disabled=true; st("저장 중…");
  const out=[];
  try{
    if(text){
      const md=`# ${NOTE_TAB} 사유 — ${id} · ${(D.name||"").trim()}\n\n`+text+"\n";
      const bytes=new TextEncoder().encode(md); let bin=""; for(let i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+8192));
      const r=await api({action:"putfile", id, name:NOTE_FILE, type:"text/markdown", data:btoa(bin), sub:NOTE_TAB, pass:ADMIN_PASS});
      out.push(r&&r.ok ? "사유 저장" : "사유 저장 실패: "+(r&&r.error||""));
    }
    if(NOTE_PICK.length){
      const r=await api({action:"addfiles", id, sub:NOTE_TAB, files:NOTE_PICK.map(f=>({name:f.name,type:f.type,data:f.data})), pass:ADMIN_PASS});
      out.push(r&&r.ok&&r.count ? `자료 ${r.count}건 업로드` : "자료 업로드 실패"+(r&&String(r.url||"").indexOf("ERR")===0?": "+r.url:""));
      if(r&&r.ok&&r.count) NOTE_PICK=[];
    }
    /* 수정 이력에 한 줄 */
    try{ const d=new Date(), t=`${String(d.getFullYear()).slice(2)}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
         const Dout=JSON.parse(JSON.stringify(D)); delete Dout.q03;
         await api({action:"update", id, data:Dout, log:`${t} · ${NOTE_TAB} 기록 — ${out.join(", ")}${text?" / "+text.slice(0,60).replace(/\n/g," ")+(text.length>60?"…":""):""}`, pass:ADMIN_PASS}); }catch(e){}
  }catch(e){ out.push("오류: "+e); }
  paintPick(); st(out.join(" · ")+" "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}));
  btn.disabled=false; notesLoad(id);
}

function bindNotes(id, status){
  const g=x=>document.getElementById(x); if(!g("notes")) return;
  NOTE_TAB = NOTE_TABS.includes(status) ? status : "보류"; NOTE_PICK=[];
  const sel=()=>{ document.querySelectorAll(".nt-tab").forEach(b=>b.classList.toggle("on", b.dataset.t===NOTE_TAB));
    g("ntText").placeholder=`왜 ${NOTE_TAB}인지 — 예) 건축물 용도변경(창고→2종 근생) 허가가 먼저. 지하층 직통계단 1개라 탈출구 성립 여부에 따라 전체/축소 갈림`; };
  document.querySelectorAll(".nt-tab").forEach(b=>b.onclick=()=>{ if(b.dataset.t===NOTE_TAB) return; NOTE_TAB=b.dataset.t; NOTE_PICK=[]; paintPick(); sel(); notesLoad(id); });
  const drop=g("ntDrop"), inp=g("ntFile");
  drop.onclick=()=>inp.click(); inp.onchange=e=>{ notesPick(e.target.files); inp.value=""; };
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
  drop.addEventListener("drop",e=>{ if(e.dataTransfer.files) notesPick(e.dataTransfer.files); });
  g("ntSave").onclick=()=>notesSave(id);
  sel();
  /* 펼쳐질 때 한 번만 드라이브 조회 */
  const det=g("notes"); let loaded=false;
  const load=()=>{ if(!loaded){ loaded=true; notesLoad(id); } };
  if(det.open) load(); det.addEventListener("toggle",()=>{ if(det.open) load(); });
}

/* ══════════════ 한 페이지 폼 ══════════════ */
const SPACES = [
  ["소리를 내는 공간", ["개인 연습실","합주실","녹음실 · 스튜디오","음악학원","홈시어터","댄스 · 짐"]],
  ["조용해야 하는 공간", ["공부방 · 주식방","작업실","독서실 · 스터디카페","상담실 · 회의실"]],
  ["방송 · 촬영", ["유튜브 · 스트리밍 · 리딩방"]],
  ["그 밖", ["실내 울림(흡음)만","여러 방을 나누는 공사","기타"]]
];

function render(){
  const g = (t)=>`<span class="lb">${t}</span>`;
  let h = "";

  /* 01 공간 */
  h += `<div class="sec"><div class="sh"><span class="sn">1</span><span class="st">어떤 공간</span></div>`;
  SPACES.forEach(([t,list])=>{
    h += g(t) + `<div class="chips">` + list.map(v=>{
      const key = v==="실내 울림(흡음)만" ? "흡음" : v;
      return `<button class="chip sp${D.space===key?" on":""}" data-v="${key}">${v}</button>`;
    }).join("") + `</div>`;
  });
  if(D.space==="기타")
    h += `<div class="row"><input class="txt" id="inSpaceEtc" style="width:240px"
            placeholder="어떤 공간인지" value="${D.spaceEtc}"></div>`;
  h += `</div>`;

  /* 02 소리 */
  if(D.space!=="흡음"){
    h += `<div class="sec"><div class="sh"><span class="sn">2</span><span class="st">무엇을 하는가</span>
          <span class="ss">복수</span></div><div class="grid2"><div>`;
    INST.slice(0,4).forEach(grp=>{
      h += g(grp.g) + `<div class="chips">` +
        grp.it.map(i=>`<button class="chip snd${D.sounds.includes(i[0])?" on":""}" data-v="${i[0]}">${i[0]}</button>`).join("") +
        `</div>`;
    });
    h += `</div><div>`;
    INST.slice(4).forEach(grp=>{
      h += g(grp.g) + `<div class="chips">` +
        grp.it.map(i=>`<button class="chip snd${D.sounds.includes(i[0])?" on":""}" data-v="${i[0]}">${i[0]}</button>`).join("") +
        `</div>`;
    });
    h += `</div></div>`;
    if(D.sounds.includes("그 밖의 악기"))
      h += `<div class="row"><input class="txt" id="inSoundEtc" style="width:240px"
              placeholder="악기 이름" value="${D.soundEtc}"></div>`;
    if(D.sounds.some(n=>{const i=FIND(n); return i && i[1]>0 && i[1]<=35;}))
      h += `<div class="alert"><b>저주파 포함</b> — 고객에게 한계 고지 필요</div>`;
    h += `</div>`;
  }

  /* 03 공간 조건 */
  h += `<div class="sec"><div class="sh"><span class="sn">3</span><span class="st">공간 조건</span>
        <span class="ss">m · 소수점 첫째 자리</span></div>`;
  h += `<div class="row">
      <span class="il2">바닥</span>
      <input class="txt w-num" id="inW" placeholder="4.5" inputmode="decimal" value="${D.w}"${D.noSize?" disabled":""}><i>m</i>
      <b>×</b>
      <input class="txt w-num" id="inD" placeholder="3.2" inputmode="decimal" value="${D.d}"${D.noSize?" disabled":""}><i>m</i>
      <span class="chk${D.noSize?" on":""}" id="ckSize"><span class="bx"></span>모름</span>
      <span class="gap"></span>
      <span class="il2">천장</span>
      <input class="txt w-num" id="inH" placeholder="2.4" inputmode="decimal" value="${D.h}"${D.noH?" disabled":""}><i>m</i>
      <span class="chk${D.noH?" on":""}" id="ckH"><span class="bx"></span>모름</span>
    </div>`;
  h += `<div class="row" style="margin-top:10px"><span class="il2">사용 시간</span>
      <span class="chips">` + ["낮에만 · 오후 6시까지","저녁까지 · 밤 10시까지","밤늦게도 · 10시 이후","정해지지 않음"]
        .map(v=>`<button class="chip wh${D.when===v?" on":""}" data-v="${v}">${v}</button>`).join("") + `</span></div>`;
  h += `</div>`;

  /* 04 현장 */
  h += `<div class="sec"><div class="sh"><span class="sn">4</span><span class="st">현장</span></div>`;
  h += `<div class="row"><span class="il2">지역</span><span class="chips">` +
      ["서울","경기","인천","그 밖의 지역"].map(v=>`<button class="chip rg${D.sido===v?" on":""}" data-v="${v}">${v}</button>`).join("") +
      `</span><input class="txt w-gu" id="inGu"
        placeholder="${D.sido==="그 밖의 지역"?"예: 부산 해운대구":"시 · 군 · 구"}" value="${D.gu}"></div>`;
  if(D.space!=="흡음"){
    h += `<div class="row" style="margin-top:10px"><span class="il2">건물</span><span class="chips">` +
        ["상가 · 근생","오피스 빌딩","아파트","빌라 · 다세대","오피스텔 · 지산","단독주택"]
        .map(v=>`<button class="chip bd${D.bldg===v?" on":""}" data-v="${v}">${v}</button>`).join("") + `</span></div>`;
    h += `<div class="row" style="margin-top:10px"><span class="il2">층</span><span class="chips">` +
        ["지하","1층 · 필로티 위","중간층","최상층","건물 전체"]
        .map(v=>`<button class="chip fl${D.floor===v?" on":""}" data-v="${v}">${v}</button>`).join("") + `</span></div>`;
  }
  h += `</div>`;

  /* 05 계약 · 예산 */
  h += `<div class="sec"><div class="sh"><span class="sn">5</span><span class="st">계약 · 시기 · 예산</span></div>`;
  h += `<div class="row"><span class="il2">계약</span><span class="chips">` +
      ["계약 전","계약 예정","계약 완료"].map(v=>`<button class="chip ct${D.ct===v?" on":""}" data-v="${v}">${v}</button>`).join("") +
      `</span><span class="gap"></span><span class="il2">시기</span><span class="chips">` +
      ["1개월 이내","희망 날짜 지정","아직 미정"].map(v=>`<button class="chip pt${D.pt===v?" on":""}" data-v="${v}">${v}</button>`).join("") +
      `</span>` + (D.pt==="희망 날짜 지정" ? `<input class="txt" type="date" id="inDate" value="${D.pd}">` : "") + `</div>`;
  h += `<div class="row" style="margin-top:10px"><span class="il2">예산</span>
      <input class="txt w-bud" id="inBud" placeholder="금액" inputmode="numeric" value="${D.bud}"${D.bTBD?" disabled":""}><i>만원</i>
      <span class="chk${D.bTBD?" on":""}" id="ckBud"><span class="bx"></span>상담 후 결정</span></div>`;
  h += `</div>`;

  /* 06 첨부 */
  h += `<div class="sec"><div class="sh"><span class="sn">6</span><span class="st">현장 사진</span>
        <span class="ss">선택 · 있으면 판단이 정확해집니다</span></div>`;
  h += `<div class="drop" id="drop">
      <div class="t">사진 선택 또는 여기로 끌어놓기</div>
      <div class="s">평면도 · 현장 전경 · 천장 · 문 주변 · 인접 세대 방향</div>
      <input type="file" id="inFile" accept="image/*" multiple style="display:none"></div>`;
  h += `<div class="thumbs" id="thumbs"></div>`;
  h += `</div>`;

  document.getElementById("body").innerHTML = h;
  bind();
  check();
}

function bind(){
  const g=id=>document.getElementById(id);
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{fn(b.dataset.v);render();});

  on(".chip.sp", v=>{ D.space=v; if(v!=="기타") D.spaceEtc=""; });
  on(".chip.snd", v=>{ const i=D.sounds.indexOf(v); i>-1?D.sounds.splice(i,1):D.sounds.push(v);
                       if(!D.sounds.includes("그 밖의 악기")) D.soundEtc=""; });
  on(".chip.wh", v=>D.when=v);
  on(".chip.rg", v=>D.sido=v);
  on(".chip.bd", v=>D.bldg=v);
  on(".chip.fl", v=>D.floor=v);
  on(".chip.ct", v=>D.ct=v);
  on(".chip.pt", v=>{ D.pt=v; if(v!=="희망 날짜 지정") D.pd=""; });

  const num=(el,key)=>{ if(!el) return;
    el.oninput=e=>{D[key]=e.target.value;check()};
    el.onblur=e=>{const v=parseFloat(e.target.value);
      if(!isNaN(v)){ D[key]=(Math.round(v*10)/10).toFixed(1); e.target.value=D[key]; } check(); }; };
  num(g("inW"),"w"); num(g("inD"),"d"); num(g("inH"),"h");

  const txt=(el,key)=>{ if(el) el.oninput=e=>{D[key]=e.target.value;check()}; };
  txt(g("inGu"),"gu"); txt(g("inBud"),"bud");
  txt(g("inSpaceEtc"),"spaceEtc"); txt(g("inSoundEtc"),"soundEtc");
  if(g("inDate")) g("inDate").onchange=e=>{D.pd=e.target.value;check()};

  if(g("ckSize")) g("ckSize").onclick=()=>{D.noSize=!D.noSize; if(D.noSize){D.w="";D.d="";} render();};
  if(g("ckH"))    g("ckH").onclick=()=>{D.noH=!D.noH; if(D.noH){D.h="";} render();};
  if(g("ckBud"))  g("ckBud").onclick=()=>{D.bTBD=!D.bTBD; if(D.bTBD) D.bud=""; render();};

  const drop=g("drop"), inFile=g("inFile");
  if(drop){
    drop.onclick=()=>inFile.click();
    inFile.onchange=e=>addFiles(e.target.files);
    ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{
      e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{
      e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop",e=>{ if(e.dataTransfer.files) addFiles(e.dataTransfer.files); });
    paintThumbs();
  }

  g("inStaff").value=D.staff; g("inN").value=D.name; g("inP").value=D.phone;
  g("inStaff").oninput=e=>{D.staff=e.target.value;check()};
  g("inN").oninput=e=>{D.name=e.target.value;check()};
  g("inP").oninput=e=>{D.phone=e.target.value;check()};
}

/* 사진을 긴 변 1600px 이하로 줄여 base64 로 만든다 */
function shrink(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej();
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej();
      img.onload=()=>{
        const MAX=1600;
        let w=img.width, hh=img.height;
        if(Math.max(w,hh)>MAX){ const r=MAX/Math.max(w,hh); w=Math.round(w*r); hh=Math.round(hh*r); }
        const cv=document.createElement("canvas"); cv.width=w; cv.height=hh;
        cv.getContext("2d").drawImage(img,0,0,w,hh);
        const url=cv.toDataURL("image/jpeg",0.72);
        res({ name:file.name.replace(/\.[^.]+$/,"")+".jpg", type:"image/jpeg",
              data:url.split(",")[1], thumb:url });
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function addFiles(list){
  const arr=[...list].filter(f=>f.type.indexOf("image/")===0);
  if(!arr.length) return;
  if(FILES.length + arr.length > 12){ alert("사진은 한 번에 12장까지 보낼 수 있습니다."); return; }
  const dp=document.getElementById("drop");
  const keep=dp.innerHTML;
  dp.innerHTML='<div class="t">사진 줄이는 중…</div>';
  for(const f of arr){
    try{ FILES.push(await shrink(f)); }catch(e){}
  }
  dp.innerHTML=keep;
  const inF=document.getElementById("inFile");
  if(inF){ inF.value=""; inF.onchange=e=>addFiles(e.target.files); }
  dp.onclick=()=>document.getElementById("inFile").click();
  paintThumbs(); check();
}

function paintThumbs(){
  const t=document.getElementById("thumbs"); if(!t) return;
  t.innerHTML = FILES.map((f,i)=>`<div class="th">
      <img src="${f.thumb}" alt="">
      <button class="x" data-i="${i}">×</button>

  t.querySelectorAll(".x").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); FILES.splice(Number(b.dataset.i),1); paintThumbs(); });
}

function missing(){
  const m=[];
  if(!D.staff.trim()) m.push("담당자");
  if(!D.name.trim()) m.push("고객 성명");
  if(!D.phone.trim()) m.push("고객 연락처");
  if(!D.space) m.push("공간");
  else if(D.space==="기타" && !D.spaceEtc.trim()) m.push("공간 내용");
  if(D.space!=="흡음"){
    if(!D.sounds.length) m.push("무엇을 하는가");
    else if(D.sounds.includes("그 밖의 악기") && !D.soundEtc.trim()) m.push("악기 이름");
    if(!D.bldg) m.push("건물");
    if(!D.floor) m.push("층");
  }
  if(!D.noSize && !(D.w.trim() && D.d.trim())) m.push("바닥 크기");
  if(!D.noH && !D.h.trim()) m.push("천장 높이");
  if(!D.when) m.push("사용 시간대");
  if(!D.sido) m.push("지역");
  if(!D.gu.trim()) m.push("시군구");
  if(!D.ct) m.push("계약 여부");
  if(!D.pt) m.push("희망 시기");
  else if(D.pt==="희망 날짜 지정" && !D.pd) m.push("희망 날짜");
  if(!D.bTBD && !D.bud.trim()) m.push("예산");
  return m;
}

/* 변경된 항목만 뽑아 한 줄로 */
function diffLog(before, after){
  const L = {space:"공간", spaceEtc:"공간 내용", sounds:"소리", soundEtc:"악기 직접입력",
             w:"가로", d:"세로", noSize:"크기 모름", h:"천장높이", noH:"천장고 모름",
             when:"사용시간", sido:"지역", gu:"시군구", bldg:"건물", floor:"층",
             ct:"계약", pt:"희망시기", pd:"희망날짜", bud:"예산", bTBD:"예산 협의",
             staff:"담당자", name:"고객성명", phone:"고객연락처"};
  const out=[];
  if(JSON.stringify(before.ov||{})!==JSON.stringify(after.ov||{}))
    out.push("실제 시공 등급 조정 "+["F","WS","WP","C"].filter(k=>(after.ov||{})[k]!=null).map(k=>k+"-L"+after.ov[k]).join(" · "));
  if(JSON.stringify(before.rooms||[])!==JSON.stringify(after.rooms||[]))
    out.push("실별 설계 "+(before.rooms||[]).length+"실 → "+(after.rooms||[]).length+"실 갱신");
  if(!!before.split!==!!after.split) out.push(after.split?"실 분할로 검토":"한 방으로 검토");
  if((before.apt??null)!==(after.apt??null)) out.push(after.apt===null?"아파트형: 건물 따름":after.apt?"아파트형으로 검토":"아파트형 해제");
  if(JSON.stringify(before.ovm||{})!==JSON.stringify(after.ovm||{})) out.push("M 시리즈 조정 "+Object.entries(after.ovm||{}).map(([k,v])=>k+"-"+v).join(" · "));
  Object.keys(L).forEach(k=>{
    const a=Array.isArray(before[k])?before[k].join(", "):String(before[k]??"");
    const b=Array.isArray(after[k])?after[k].join(", "):String(after[k]??"");
    if(a!==b) out.push(`${L[k]} ${a||"—"} → ${b||"—"}`);
  });
  if(!out.length) return "";
  const d=new Date();
  const t=`${String(d.getFullYear()).slice(2)}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  return t + " · " + out.join(" / ");
}

         if(res&&res.ok&&res.hits.length) hits=res.hits; }catch(e){}
    const f=hits.filter(x=>(!nm||String(x.name||"").indexOf(nm)>-1) &&
                           (!ph||String(x.phone||"").replace(/[^0-9]/g,"").indexOf(ph)>-1));
    if(!f.length){ alert("찾는 신청서가 없습니다."); return; }
    if(f.length===1){ showBrief(f[0].id); return; }
    window.__hits=f; repaint(f,0);
  };
  bindList();
}

function bindList(){
  const hits=window.__hits||[];
  document.querySelectorAll(".reqrow").forEach(b=>b.onclick=()=>showBrief(b.dataset.id));
  document.querySelectorAll(".pager button").forEach(b=>b.onclick=e=>{e.stopPropagation();
    repaint(hits, b.id==="pPrev"?page-1:page+1);});
  document.querySelectorAll(".stt").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const id=b.dataset.st, cur=b.textContent.trim();
    const next=STATUS[(STATUS.indexOf(cur)+1)%STATUS.length];
    b.textContent=next; b.className="stt "+(STCLS[next]||"st-new");
    const rec=hits.find(x=>x.id===id); if(rec) rec.status=next;
    try{ await api({action:"status",id,status:next,pass:ADMIN_PASS}); }catch(e){}
  });
  document.querySelectorAll(".del").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const id=b.dataset.del;
    if(!confirm(id+" 신청서를 삭제합니다. 되돌릴 수 없습니다.")) return;
    try{ await api({action:"remove",id,pass:ADMIN_PASS}); }catch(e){}
    const idx=(await STORE.get("req:index"))||[];
    await STORE.set("req:index", idx.filter(x=>x.id!==id));
    window.__hits=hits.filter(x=>x.id!==id);
    repaint(window.__hits,page);
  });
}

async function showBrief(id){
  if(!id) return;
  let rec=null, from="";
  try{ const res=await api({action:"find",q:id,pass:ADMIN_PASS});
       if(res&&res.ok&&res.hits.length){
         const h=res.hits[0];
         if(h.data && Object.keys(h.data).length){ rec={at:h.at,data:h.data,log:h.log||"",files:h.files||0,filesUrl:h.filesUrl||"",status:h.status||"신규"};
           from = h.data._rebuilt ? "복원" : "서버"; }
       } }catch(e){}
  if(!rec){
    const local=await STORE.get("req:"+id);
    if(local && local.data && Object.keys(local.data).length){
      rec={at:local.at,data:local.data,log:local.log||"",status:local.status||"신규"}; from="로컬";
    }
  }
  if(!rec){
    alert(id+" 의 상세 내용을 불러오지 못했습니다.\n\n"
      +"시트의 '원본' 열이 비어 있는 건일 수 있습니다.\n"
      +"이 스크립트를 적용하기 전에 접수된 건은 상세 내용이 없습니다.");
    return;
  }

  /* 기본값으로 초기화한 뒤 덮어써야 이전 화면 값이 남지 않는다 */
  const BLANK = { space:null, spaceEtc:"", sounds:[], soundEtc:"", rooms:[], split:false, apt:null, ovm:{}, ov:{F:null,WS:null,WP:null,C:null}, q03:{html:""},
    w:"", d:"", noSize:false, h:"", noH:false, when:null,
    sido:null, gu:"", bldg:null, floor:null,
    ct:null, pt:null, pd:"", bud:"", bTBD:false,
    staff:"", name:"", phone:"" };
let FILES = [];   // {name,type,data(base64),thumb}
  Object.keys(BLANK).forEach(k=>D[k]=BLANK[k]);
  Object.keys(rec.data).forEach(k=>{ if(k in D) D[k]=rec.data[k]; });
  if(!Array.isArray(D.sounds)) D.sounds=[];
  if(!Array.isArray(D.rooms)) D.rooms=[];
  D.ov=Object.assign({F:null,WS:null,WP:null,C:null}, D.ov||{});
  D.q03={html:""};
  D.split=!!D.split;
  if(D.apt!==true && D.apt!==false) D.apt=null;   // null = 접수 건물에 따름
  D.ovm=D.ovm||{};
  D.rooms.forEach(r=>{ r.ov=Object.assign({F:null,WS:null,WP:null,C:null}, r.ov||{}); });
  /* 숫자로 저장된 값이 섞여도 문자열로 통일 */
  ["w","d","h","bud","gu","name","phone","staff","spaceEtc","soundEtc","pd"]
    .forEach(k=>{ if(D[k]!=null) D[k]=String(D[k]); });
  window.__editBefore = JSON.parse(JSON.stringify(rec.data));
  window.__lastRec = rec;
  if(!D.space && !D.sounds.length){
    alert("불러온 내용이 비어 있습니다.\n\n출처: "+from
      +"\n받은 항목: "+Object.keys(rec.data).join(", ").slice(0,200));
  }

  await renderAdmin(`<div class="idbox" style="margin-top:0"><div class="l">신청번호</div>
      <div class="no">${id}</div>
      <div class="sm">${fmt(rec.at)} 접수 · 고객 ${D.name||""} ${D.phone||""}${D.staff?" · 담당 "+D.staff:""} · <b class="stt ${STCLS[rec.status]||"st-new"}" style="padding:2px 8px;border-radius:3px;border:1px solid;font-size:11px">${rec.status||"신규"}</b>
        ${from?`<span style="color:${from==="복원"?"#a8281b":"#b6b4ab"}"> · ${from}</span>`:""}</div>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:center">
        <button class="btn gh" id="backBtn" style="padding:9px 20px;font-size:13px">◀ 목록</button>
        ${VIEW==="internal"?"":`<button class="btn go" id="editBtn" style="padding:9px 22px;font-size:13px" data-id="${id}">내용 수정</button>`}
        <button class="btn gh" id="q03Btn" style="padding:9px 20px;font-size:13px;color:var(--accent);border-color:var(--accent)">고객전송용 사전검토서</button></div></div>
    ${rec.files?`<div class="logbox"><div class="logh">현장 사진 ${rec.files}장</div>
        <a href="${rec.filesUrl}" target="_blank" class="flink">드라이브 폴더 열기 →</a></div>`:""}
    ${notesHTML(rec.status)}
    ${rec.log?`<div class="logbox"><div class="logh">수정 이력</div>${
      String(rec.log).split("\n").filter(Boolean).map(l=>`<div class="logl">${l}</div>`).join("")}</div>`:""}
    <div class="peek"><div class="peek-b">${briefHTML()}</div></div>`);
  const eb=document.getElementById("editBtn");
  if(eb) eb.onclick=()=>startEdit(id);
  Q03_ON=false; document.body.classList.remove("q03mode");
  const qb=document.getElementById("q03Btn"); if(qb) qb.onclick=()=>toggleQ03(id);
  bindNotes(id, rec.status);
  bindReview(id);
  const bb=document.getElementById("backBtn");
  if(bb) bb.onclick=adminHome;
}

render();
/* 내부용 — 접수 폼 없이 바로 관리자로 (취소하면 잠금 화면) */
lockScreen(); document.getElementById("adminBtn").click();
</script>
</body>
</html>
