<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그리드에이포유 — INTRA_NET 검토 (내부)</title>
<style>
:root{
  --ink:#1b2a38; --sub:#6b6a63; --line:#cfcdc4; --hair:#e4e2da;
  --accent:#002945; --fill:#f4f6f8; --paper:#ffffff;
  --gold:#C79A2E; --stop:#a8281b; --stop-bg:#fbeae8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color:var(--ink);background:#edece6;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:22px 18px 50px;display:flex;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:1000px;
  box-shadow:0 2px 18px rgba(0,0,0,.08)}

/* 헤더 */
.hd{padding:20px 44px 0}
.hd-brand{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:8px}
.logo{height:68px;width:auto;display:block;flex:0 0 auto}
@media print{.logo{height:56px}}
.hd-mid{flex:1;min-width:0;text-align:right}
.hd-t{font-size:24px;font-weight:700;letter-spacing:.14em;color:var(--accent);display:block}
.hd-t::after{content:"INTRA_NET · 내부 검토";display:block;font-size:10.5px;
  letter-spacing:.14em;color:var(--sub);font-weight:400;margin-top:6px}
.hd-top{display:flex;justify-content:flex-end;gap:6px}
@media(max-width:820px){
  .logo{height:48px}
  .hd-t{font-size:18px}
  .hd-t::after{font-size:9px}
}
@media(max-width:520px){
  .hd-brand{flex-wrap:wrap;gap:10px}
  .hd-mid{flex-basis:100%;text-align:left}
  .logo{height:44px}
}

.hd hr{border:0;border-top:1.5px solid var(--ink);margin-top:12px}
.adminbtn{background:transparent;color:var(--sub);border:1px solid var(--line);
  font-family:inherit;font-size:9.5px;letter-spacing:.16em;font-weight:700;
  padding:4px 10px;border-radius:3px;cursor:pointer}
.adminbtn:hover{border-color:var(--accent);color:var(--accent)}

/* 접수 바 */
.intake{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;margin:14px 44px 0;
  padding:10px 12px;background:var(--fill);border:1px solid var(--line)}
.intake .grp{display:flex;align-items:flex-end;gap:6px}
.intake .il{font-size:10px;letter-spacing:.1em;color:var(--sub);padding-bottom:5px;white-space:nowrap}
.intake input{font-family:inherit;font-size:13px;color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid var(--line);padding:4px 2px}
.intake input:focus{outline:none;border-bottom:1.5px solid var(--accent)}
.intake input::placeholder{color:#b6b4ab}
.intake .w1{width:96px} .intake .w2{width:80px} .intake .w3{width:132px}
.intake .div{flex:1;min-width:6px}

/* 본문 */
.body{padding:18px 44px 10px}
.sec{border-top:1px solid var(--hair);padding:14px 0 6px}
.sec:first-child{border-top:0}
.sh{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.sn{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
  border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;flex:0 0 19px}
.st{font-size:15px;font-weight:700;letter-spacing:-.01em}
.ss{font-size:11.5px;color:var(--sub);margin-left:auto}

.grid2{display:block}

.lb{font-size:10px;letter-spacing:.1em;color:var(--sub);margin:12px 0 6px;
  padding-bottom:3px;border-bottom:1px solid var(--hair)}
.lb:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#fff;border:1px solid var(--line);border-radius:4px;
  padding:6px 11px;font-size:12.5px;cursor:pointer;transition:.1s;font-family:inherit;color:inherit}
.chip:hover{border-color:var(--sub)}
.chip.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:700}

.txt{font-family:inherit;font-size:13px;color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid var(--line);padding:5px 2px}
.txt:focus{outline:none;border-bottom:1.5px solid var(--accent)}
.txt::placeholder{color:#b6b4ab}
.row{display:flex;align-items:flex-end;gap:7px;flex-wrap:wrap;margin-top:4px}
.il2{font-size:10px;letter-spacing:.1em;color:var(--sub);padding-bottom:6px;
  width:56px;flex:0 0 56px;white-space:nowrap}
.gap{width:22px;flex:0 0 22px}
.row .chips{padding-bottom:1px}
.txt:disabled{opacity:.35}
.row i{font-style:normal;color:var(--sub);font-size:11.5px;padding-bottom:5px}
.row b{font-weight:400;color:var(--sub);padding-bottom:4px}
.w-num{width:74px;text-align:center}
.w-gu{width:150px}
.w-bud{width:110px;text-align:center}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--sub);
  padding-bottom:3px}
.chk .bx{width:14px;height:14px;border:1px solid var(--line);border-radius:3px;background:#fff;
  display:grid;place-items:center}
.chk.on{color:var(--accent);font-weight:700}
.chk.on .bx{border-color:var(--accent);background:var(--accent)}
.chk.on .bx::after{content:"";width:6px;height:6px;background:#fff;border-radius:1px}

.hint{margin-top:9px;background:var(--fill);border-left:2px solid var(--accent);
  padding:9px 12px;font-size:11.5px;line-height:1.55;color:#33475a}
.hint b{color:var(--accent);font-weight:700}
.alert{margin-top:9px;border-left:2px solid var(--stop);background:var(--stop-bg);
  padding:9px 12px;font-size:12px;line-height:1.55;color:#7a2016}
.alert b{font-weight:700;color:var(--stop)}
.drop{margin-top:6px;border:1px dashed var(--line);background:#fbfaf7;padding:14px;
  text-align:center;cursor:pointer;transition:.12s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--fill)}
.drop .t{font-size:13px;font-weight:700;color:var(--accent)}
.drop .s{font-size:11.5px;color:var(--sub);margin-top:4px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.th{position:relative;width:96px}
.th img{width:96px;height:72px;object-fit:cover;border:1px solid var(--line);display:block}
.th .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
  border:1px solid var(--line);background:#fff;color:var(--sub);font-size:12px;line-height:1;
  cursor:pointer;padding:0}
.th .x:hover{border-color:var(--stop);color:var(--stop)}
.th .n{font-size:10px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.notice{margin-top:12px;padding:10px 12px;background:#FBF6E8;border-left:2px solid var(--gold);
  font-size:12px;line-height:1.6;color:#6b5518;font-style:italic}
.notice b{font-style:normal;font-weight:700;color:#8a6a12}

.foot{padding:16px 44px 28px;display:flex;gap:9px;align-items:center;
  border-top:1px solid var(--hair);margin-top:8px}
.msg{font-size:12px;color:var(--stop);flex:1}
.btn{font-family:inherit;font-size:14px;font-weight:700;padding:12px 30px;
  border-radius:4px;border:1px solid var(--accent);cursor:pointer;letter-spacing:.04em}
.btn.go{background:var(--accent);color:#fff}
.btn.go:hover{background:#013a5f}
.btn.go:disabled{background:#c9c7be;border-color:#c9c7be;cursor:not-allowed}
.btn.gh{background:transparent;color:var(--sub);border-color:var(--line);padding:12px 18px}

/* 완료 */
.done{padding:36px 44px}
.done-i{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:19px;margin-bottom:14px}
.done h2{font-size:19px;font-weight:700}
.done p{font-size:13px;color:var(--sub);margin-top:6px}
.idbox{margin-top:18px;border:1px solid var(--accent);background:var(--fill);padding:15px;text-align:center}
.idbox .l{font-size:9.5px;letter-spacing:.18em;color:var(--sub)}
.idbox .no{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:.1em;margin-top:4px}
.idbox .sm{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6}
.card{margin-top:18px;border:1px solid var(--line)}
.card-h{font-size:10px;letter-spacing:.14em;color:var(--sub);padding:9px 13px;
  border-bottom:1px solid var(--line);background:var(--fill)}
.crow{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:8px 13px;
  border-bottom:1px dashed var(--hair);font-size:12.5px}
.crow:last-child{border-bottom:0}
.crow .k{color:var(--sub);font-size:11.5px}
.crow .v{font-weight:700}
.restart{margin-top:16px;width:100%;background:transparent;border:1px solid var(--line);
  padding:11px;font-family:inherit;font-size:13px;color:var(--sub);cursor:pointer}

/* 관리자 */
body.admin .sheet{max-width:1080px}
.brow{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:14px;
  background:#fff;border:1px solid var(--line);padding:10px 13px;margin-bottom:6px;font-size:13px}
.brow .id{font-weight:700;letter-spacing:.03em;white-space:nowrap}
.brow .stf{font-weight:700;color:var(--accent);white-space:nowrap;
  padding:2px 9px;background:var(--fill);border-radius:3px;font-size:12.5px}
@media(max-width:820px){
  .brow{grid-template-columns:1fr auto;gap:6px 10px}
  .brow .stf{justify-self:start}
  .brow .mt{grid-column:1/-1}
}
.brow .mt{color:var(--sub);font-size:11.5px}
.brow .stt{font-size:11px;font-weight:700;padding:4px 10px;border-radius:3px;border:1px solid;
  white-space:nowrap}
.brow .st-new{color:#6b6a63;border-color:var(--line);background:#f6f5f1}
.brow .st-booth{color:#5b3a86;border-color:#d7c9ea;background:#f1ebf9}
.brow .st-drop{color:#7a7770;border-color:#d5d3cb;background:#e9e8e2}
.brow .st-call{color:#0b4f7a;border-color:#bcd6e8;background:#e9f2f9}
.brow .st-go{color:#8a5a05;border-color:#ecd9ab;background:#faf0d8}
.brow .st-done{color:#0c5a3c;border-color:#bfe0d0;background:#e8f5ee}
.brow .st-fin{color:#fff;border-color:var(--accent);background:var(--accent)}
.brow .st-hold{color:#a8281b;border-color:#eecbc6;background:#fbeae8}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.legend .lg{font-size:11px;font-weight:700;padding:5px 11px;border-radius:3px;
  border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;transition:.1s}
.legend .lg:hover{border-color:var(--accent)}
.legend .lg.on{outline:2px solid var(--accent);outline-offset:1px}
.bhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.bhead h3{font-size:16px;font-weight:700}
.bhead .c{font-size:12px;color:var(--sub)}
.abar{background:var(--fill);border-bottom:1px solid var(--line);padding:10px 14px;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:0;z-index:30}
.abar .l{font-size:10px;letter-spacing:.1em;color:var(--sub);margin-right:2px}
.abar input{font-family:inherit;font-size:13px;background:#fff;
  border:1px solid var(--line);border-radius:3px;padding:7px 9px}
.abar input:focus{outline:none;border-color:var(--accent)}
.abar .w1{width:120px} .abar .w2{width:76px} .abar .w3{width:112px}
.abar button{font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 12px;
  border-radius:3px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
.abar button:hover{background:var(--accent);color:#fff}
.abar button.solid{background:var(--accent);color:#fff}
.abar button.ghost{border-color:var(--line);color:var(--sub)}
.abar button.ghost:hover{border-color:var(--accent);color:var(--accent);background:#fff}
.abar .sep{width:1px;height:19px;background:var(--line);margin:0 3px}
.reqrow{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line);padding:10px 12px;margin-bottom:6px;
  cursor:pointer;font-size:13px}
.reqrow .id{font-weight:700;letter-spacing:.05em}
.reqrow .mt{color:var(--sub);font-size:11.5px}
.reqrow .stt{font-size:11px;font-weight:700;padding:4px 9px;border-radius:3px;border:1px solid;
  font-family:inherit;cursor:pointer;background:#fff;white-space:nowrap}
.reqrow .st-booth{color:#5b3a86;border-color:#d7c9ea;background:#f1ebf9}
.reqrow .st-drop{color:#7a7770;border-color:#d5d3cb;background:#e9e8e2}
.reqrow .st-call{color:#0b4f7a;border-color:#bcd6e8;background:#e9f2f9}
.reqrow .st-booth{color:#5b3a86;border-color:#d7c9ea;background:#f1ebf9}
.reqrow .st-drop{color:#7a7770;border-color:#d5d3cb;background:#e9e8e2}
.reqrow .st-booth{color:#5b3a86;border-color:#d7c9ea;background:#f1ebf9}
.st-drop{color:#7a7770;border-color:#d5d3cb;background:#e9e8e2}
.st-call{color:#0b4f7a;border-color:#bcd6e8;background:#e9f2f9}
.st-new{color:#6b6a63;border-color:var(--line);background:#f6f5f1}
.reqrow .st-go{color:#8a5a05;border-color:#ecd9ab;background:#faf0d8}
.reqrow .st-done{color:#0c5a3c;border-color:#bfe0d0;background:#e8f5ee}
.reqrow .st-fin{color:#fff;border-color:var(--accent);background:var(--accent)}
.reqrow .st-hold{color:#a8281b;border-color:#eecbc6;background:var(--stop-bg)}
.reqrow .del{border:1px solid var(--line);background:#fff;color:#b6b4ab;width:26px;height:26px;
  border-radius:3px;cursor:pointer;font-size:14px;line-height:1;padding:0}
.reqrow .del:hover{border-color:var(--stop);color:var(--stop);background:var(--stop-bg)}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;
  font-size:12.5px;color:var(--sub)}
.pager button{font-family:inherit;font-size:12.5px;padding:6px 12px;border:1px solid var(--line);
  background:#fff;border-radius:3px;cursor:pointer}
.pager button:disabled{color:#c9c7be;cursor:not-allowed}
.sub{font-size:10.5px;letter-spacing:.1em;color:var(--sub);margin:14px 0 8px}
.logbox{margin-top:14px;border:1px solid var(--line);background:var(--fill);padding:11px 14px}
.logh{font-size:10px;letter-spacing:.14em;color:var(--sub);font-weight:700;margin-bottom:6px}
.logl{font-size:12px;line-height:1.6;color:#33475a;padding:3px 0;border-bottom:1px dashed var(--hair)}
.logl:last-child{border-bottom:0}
.flink{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none}
.flink:hover{text-decoration:underline}
.peek{margin-top:14px;border:1px solid var(--line)}
.peek-b{padding:14px 16px;font-size:13px;line-height:1.6}
.bsec{border-top:1px solid var(--hair);padding:14px 0 4px}
.bsec:first-child{border-top:0;padding-top:2px}
.bh{font-size:10.5px;letter-spacing:.14em;color:var(--accent);font-weight:700;margin-bottom:9px}
.bp{font-size:12.5px;line-height:1.6;margin:7px 0}
.bw{font-size:12.5px;line-height:1.6;background:var(--stop-bg);border-left:2px solid var(--stop);
  color:#7a2016;padding:10px 12px;margin:8px 0}
.bt{width:100%;border-collapse:collapse;font-size:12px;margin:7px 0}
.bt th{background:var(--fill);color:var(--sub);font-size:9.5px;letter-spacing:.08em;
  padding:6px 9px;text-align:left;font-weight:700;border-bottom:1px solid var(--line)}
.bt td{padding:7px 9px;border-bottom:1px dashed var(--hair)}
.bt td.b{font-weight:700;color:var(--accent)}
.bt tr.hi td{background:#fdf8ec;font-weight:700}
.bg{font-size:9.5px;letter-spacing:.1em;color:var(--sub);margin:12px 0 4px}
.bl{font-size:12px;line-height:1.55;padding:5px 0 5px 13px;position:relative;
  border-bottom:1px dashed var(--hair)}
.bl::before{content:"—";position:absolute;left:0;color:var(--line)}
.bl.ck::before{content:"☐"}

/* 실별 설계 */
.rm{border:1px solid var(--line);margin:10px 0;background:#fff}
.rm-h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--fill);border-bottom:1px solid var(--line)}
.rm-h .nm{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.rm-h .use{font-size:12px;color:var(--sub)}
.rm-h .x{margin-left:auto;border:1px solid var(--line);background:#fff;color:#b6b4ab;width:24px;height:24px;
  border-radius:3px;cursor:pointer;font-size:13px;line-height:1;padding:0}
.rm-h .x:hover{border-color:var(--stop);color:var(--stop)}
.rm-b{padding:8px 12px 10px}
.rm .lb{display:block;margin-top:9px}
.rm .chip{padding:5px 9px;font-size:12px}
.rm .row{margin-top:2px}
.rm .txt.w-num{width:64px}
.rmb{font-family:inherit;font-size:12px;font-weight:700;padding:7px 14px;border-radius:3px;
  border:1px dashed var(--accent);background:#fff;color:var(--accent);cursor:pointer}
.rmb:hover{background:var(--fill)}
.rmb.solid{border-style:solid;background:var(--accent);color:#fff}
.rmb:disabled{opacity:.5;cursor:wait}
.rm-foot{display:flex;gap:8px;align-items:center;margin-top:10px}
.rm-foot .st{font-size:11.5px;color:var(--sub);margin-left:auto}
.bt td .dim{color:var(--sub);font-size:11px}
.ovsel{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--accent);background:#fff;
  border:1px solid var(--line);border-radius:3px;padding:3px 6px;cursor:pointer}
.ovsel:focus{outline:none;border-color:var(--accent)}
@media print{.ovsel{border:0;padding:0;appearance:none;-webkit-appearance:none;background:transparent}}
@media print{
  .rm .chips .chip:not(.on),.rmb,.rm-h .x,.rm-foot .st{display:none !important}
  .rm .chip.on{background:transparent;color:var(--ink);border-color:var(--ink)}
  .rm .txt{border:0}
  .rm{page-break-inside:avoid}
}

/* ── 실 목록 UI ── */
.rm-h .nm small{font-size:11px;color:var(--sub);font-weight:400;margin-left:2px}
.rm-area{font-size:11.5px;color:var(--sub);font-family:ui-monospace,Menlo,Consolas,monospace;margin-left:auto}
.rm-h .x{margin-left:8px}
.rm.over{border-color:var(--stop)}
.rm.over .rm-h{background:#fbe9e7}
.rm-dims input[type=number]{-moz-appearance:textfield}
.rm-dims input[type=number]::-webkit-inner-spin-button{opacity:1;height:22px;cursor:pointer}
.rm-dims .txt.w-num{width:78px;padding-right:2px}
.rm-det{margin-top:10px;border:1px solid var(--line);background:#fbfaf7}
.rm-det>summary{cursor:pointer;padding:8px 12px;font-size:12px;display:flex;gap:10px;align-items:center;list-style:none}
.rm-det>summary::-webkit-details-marker{display:none}
.rm-det>summary::before{content:"▸";color:var(--accent);font-size:12px}
.rm-det[open]>summary::before{content:"▾"}
.rm-det>summary>span:first-of-type{font-weight:700}
.rm-sum{color:var(--sub);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;margin-left:auto}
.rm-sum .vq{padding:1px 6px;border-radius:3px;font-family:inherit}
.rm-sum .vq.ok{background:#E3F1EA;color:#2E7D5B}.rm-sum .vq.warn{background:#FBF1DA;color:#7A5208}.rm-sum .vq.bad{background:#F7E6E3;color:#B3402F}
.rm-detb{padding:6px 12px 12px;background:#fff;border-top:1px solid var(--line)}
.rm-all{font-family:inherit;font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--sub);cursor:pointer;margin-left:8px}
.rm-all:hover{border-color:var(--accent);color:var(--accent)}
.rm-sub{margin:6px 0;border:1px solid var(--hair);background:#fff}
.rm-sub>summary{cursor:pointer;padding:7px 10px;font-size:12px;display:flex;gap:10px;align-items:center;list-style:none;background:#fbfaf7}
.rm-sub>summary::-webkit-details-marker{display:none}
.rm-sub>summary::before{content:"▸";color:var(--sub);font-size:11px}
.rm-sub[open]>summary::before{content:"▾";color:var(--accent)}
.rm-sub>summary>span:first-of-type{font-weight:700}
.rm-subb{padding:4px 10px 10px;border-top:1px solid var(--hair)}
@media print{.rm-sub{border:0}.rm-sub>summary{display:none}.rm-sub:not([open])>.rm-subb{display:block}.rm-all{display:none}}
.rm-gauge{margin:8px 0 10px;padding:9px 12px;border:1px solid var(--line);background:#fbfaf7;font-size:12px}
.rm-gauge .g-h span{color:var(--sub);font-size:11px}
.rm-gauge .g-h em{font-style:normal;margin-left:8px;color:var(--ok, #2E7D5B);font-weight:700}
.rm-gauge.over .g-h em{color:var(--stop)}
.rm-gauge .g-bar{height:8px;background:#e9e6df;border-radius:4px;margin-top:6px;overflow:hidden}
.rm-gauge .g-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rm-gauge.over .g-bar i{background:var(--stop)}
@media print{.rm-det{border:0}.rm-det>summary{display:none}.rm-det:not([open])>.rm-detb{display:block}}

/* ── 실별 룸 모드 (계산기 구성) ── */
.rmc{--qn:#0D2B4A;--qg:#E3B23C;--bad:#B3402F;--badbg:#F7E6E3;--warn:#C98A12;--warnbg:#FBF1DA;--ok:#2E7D5B;--okbg:#E3F1EA;--ink3:#8A93A0;--wash:#F4F6F9;
  margin:10px 0 4px;padding:12px 14px;border:1px solid var(--line);background:#fff}
.rmc-h{font-size:13px;font-weight:700;margin:12px 0 8px;color:var(--ink)}
.rmc-h:first-child{margin-top:0}
.rmc-h .n{color:var(--qg);font-weight:800;margin-right:6px}
.rmc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px}
.rmc-grid .f label{display:block;font-size:11px;color:var(--ink3);margin-bottom:2px}
.rmc-grid .f label em{font-style:normal;color:var(--accent);font-weight:700;margin-left:4px}
.rmc-grid .f .v{font:600 18px ui-monospace,Menlo,Consolas,monospace;color:var(--qn);border-bottom:2px solid var(--line);padding:2px 2px 4px}
.rmc-grid .f .v small{font-size:11px;font-weight:500;color:var(--ink3);margin-left:4px}
.rmc-grid .f.dv .v{color:var(--ink3)}
.rmc-hint{font-size:11.5px;color:var(--ink3);margin-top:8px}
.rmc-hint b{color:var(--sub);font-weight:500}
.rmc-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rmc-sum .k{padding:10px 12px;background:var(--wash);border-radius:6px}
.rmc-sum .k .l{font-size:11px;color:var(--ink3)}
.rmc-sum .k .v{font:600 22px ui-monospace,Menlo,Consolas,monospace;color:var(--qn);margin-top:2px}
.rmc-sum .k .v small{font-size:11px;font-weight:500;color:var(--ink3);margin-left:3px}
.rmc-sum .k .s{font-size:11px;color:var(--sub);margin-top:2px}
.rmc-sum .k.gold{background:var(--qn);color:#fff}
.rmc-sum .k.gold .l,.rmc-sum .k.gold .s{color:rgba(255,255,255,.7)}
.rmc-sum .k.gold .v{color:var(--qg)}
.rmc-verdict{margin-top:10px;padding:10px 14px;border-radius:6px;font-size:13px;font-weight:500;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.rmc-verdict.bad{background:var(--badbg);color:var(--bad)}
.rmc-verdict.warn{background:var(--warnbg);color:#7A5208}
.rmc-verdict.ok{background:var(--okbg);color:var(--ok)}
.rmc-verdict .ic{font:700 12px ui-monospace,Menlo,Consolas,monospace;padding:1px 6px;border-radius:3px;background:rgba(0,0,0,.08);flex:none}
.rmc-ruler{margin-top:6px}
.rmc-ruler svg{width:100%;height:auto;display:block;font-family:inherit}
.rmc-legend{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:4px;flex-wrap:wrap}
.rmc-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.rmc-two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:4px}
.rmc-t{width:100%;border-collapse:collapse;font-size:12.5px}
.rmc-t th{font-weight:500;color:var(--ink3);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);font-size:11px}
.rmc-t td{padding:6px 8px;border-bottom:1px solid #eef0f3;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:500}
.rmc-t td.t{font-family:inherit;color:var(--ink)}
.rmc-t td.bad{color:var(--bad);font-weight:700}
.rmc-t td.warn{color:var(--warn)}
.rmc-t td.ok{color:var(--ok);font-weight:700}
.rmc-t .tag{display:inline-block;font:600 10.5px inherit;font-family:inherit;padding:1px 6px;border-radius:3px;margin-left:5px;vertical-align:1px}
.rmc-t .tag.bad{background:var(--badbg);color:var(--bad)}
.rmc-t .tag.warn{background:var(--warnbg);color:#7A5208}
.rmc-ban{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rmc-ban>div{padding:8px 10px;border:1px solid var(--line);border-radius:6px}
.rmc-ban>div.hit{border-color:var(--bad);background:var(--badbg)}
.rmc-ban .b{font:600 13px ui-monospace,Menlo,Consolas,monospace;color:var(--bad);white-space:nowrap}
.rmc-ban .r{font-size:11px;color:var(--ink3)}
.rmc-ban .r b{color:var(--sub);font-weight:500}
.rmc-ban .r b.bad{color:var(--bad);font-weight:700}
.rmc-note{font-size:12px;color:var(--sub);margin:10px 0 0;padding-left:10px;border-left:3px solid var(--qg);line-height:1.55}
@media(max-width:820px){.rmc-grid,.rmc-sum{grid-template-columns:1fr 1fr}.rmc-two{grid-template-columns:1fr}}
@media print{.rmc{page-break-inside:avoid}}

/* ── 실 분할 체크 ── */
.splitbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;margin-bottom:14px;border:1px solid var(--line);background:#fbfaf7;font-size:12.5px}
.splitbar label{display:flex;align-items:center;gap:8px;cursor:pointer}
.splitbar input{width:16px;height:16px;accent-color:var(--accent)}
.splitbar span{color:var(--sub);font-size:11.5px}
.splitbar .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.splitbar .save-note{margin-left:auto}
.splitbar a{color:var(--accent)}
td.ins{font-size:11.5px}
.notes-inst{margin:8px 0;border:1px solid var(--line);background:#fbfaf7}
.notes-inst summary{cursor:pointer;padding:7px 12px;font-size:12px;font-weight:700}
.notes-inst .bl{margin:0 12px 6px}
.notes-inst .nd{font-size:11px;color:var(--sub);font-weight:400}
td.ins.ok{color:#2E7D5B}
td.ins.warn{color:#7A5208}
td.ins.bad{color:var(--stop);font-weight:700}
.bp.ref{color:var(--accent);background:var(--fill);padding:8px 12px;border-left:3px solid var(--accent)}

/* ── 보류 · 진행포기 기록 ── */
.notes{margin-top:14px;border:1px solid var(--line);background:#fff}
.notes summary{cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:12.5px;background:var(--fill)}
.notes summary b{letter-spacing:.06em}
.nt-sub{color:var(--sub);font-size:11.5px;flex:1}
.nt-sub em{font-style:normal;font-weight:700;color:var(--stop)}
.nt-b{padding:12px 14px}
.nt-tabs{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.nt-tab{font-family:inherit;font-size:12px;font-weight:700;padding:6px 14px;border-radius:3px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer}
.nt-tab.on{background:var(--stop);border-color:var(--stop);color:#fff}
.nt-path{margin-left:auto;font-size:11px;color:var(--sub);font-family:ui-monospace,Menlo,Consolas,monospace}
#ntText{display:block;width:100%;min-height:96px;border:1px solid var(--line);border-radius:3px;padding:9px 11px;font:13px/1.55 inherit;font-family:inherit;color:var(--ink);resize:vertical}
#ntText:focus{outline:none;border-color:var(--accent)}
.nt-files{margin-top:8px}
.nt-drop{margin-top:0}
.nt-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nt-p{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:3px;background:#fbfaf7}
.nt-p img{width:28px;height:22px;object-fit:cover;border:1px solid var(--line)}
.nt-p button{border:0;background:transparent;color:#b6b4ab;cursor:pointer;font-size:14px;padding:0}
.nt-p button:hover{color:var(--stop)}
.nt-list{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.nt-f{font-size:12.5px;color:var(--accent);text-decoration:none;padding:5px 8px;border-bottom:1px dashed var(--hair);display:flex;justify-content:space-between;gap:10px}
.nt-f:hover{background:var(--fill)}
.nt-f small{color:var(--sub);font-size:11px}
.nt-dim{font-size:12px;color:var(--sub)}
.nt-foot{display:flex;align-items:center;gap:10px;margin-top:10px}
.nt-st{flex:1;font-size:12px;color:var(--sub)}
@media print{.notes{display:none !important}}

/* ── 고객전송용 사전검토서 — 화면 ── */
.q03bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--fill);border-bottom:1px solid var(--line);font-size:12px;color:var(--sub)}
.q03bar span{flex:1;font-weight:700;letter-spacing:.06em}
.q03bar em{font-style:normal;font-weight:400;letter-spacing:0;color:var(--accent);margin-left:10px}
.q03bar em a{color:var(--accent);font-weight:700}
.q03bar em small{color:var(--stop);font-size:11px}
.q03steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--hair)}
.q03step{border:1px solid var(--line);background:#fbfaf7}
.q03sh{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12px;font-weight:700;border-bottom:1px solid var(--hair)}
.q03sh b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px}
.q03sh span{flex:1;font-weight:400;color:var(--sub);font-size:11px}
.q03step textarea{display:block;width:100%;height:140px;border:0;background:#fff;font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:8px 10px;resize:vertical;color:#33475a}
.q03step textarea:focus{outline:none;background:#fffdf5}
.q03frame{display:block;width:100%;min-height:1123px;border:0;background:#e9ebef}
.q03fmt{margin:0 14px 10px;border:1px solid var(--line);background:#fbfaf7;font-size:12px}
.q03fmt summary{cursor:pointer;padding:7px 10px;font-weight:700;display:flex;align-items:center;gap:8px}
.q03fmt summary b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sub);color:#fff;font-size:11px}
.q03fmt-tip{flex:1;font-weight:400;color:var(--sub);font-size:11px}
.q03fmt-b textarea{display:block;width:100%;height:160px;border:0;border-top:1px solid var(--hair);background:#fff;font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:8px 10px;resize:vertical;color:#33475a}
.q03fmt-a{display:flex;gap:6px;justify-content:flex-end;padding:8px 10px;border-top:1px solid var(--hair)}
@media print{.q03fmt{display:none !important}}
.q03-empty{display:grid;place-items:center;min-height:260px;text-align:center;color:var(--sub);font-size:15px;font-weight:700;line-height:1.9;background:#f4f4f0}
.q03-empty small{font-size:12px;font-weight:400}
body.q03mode .peek{border:0}
body.q03mode #apane{padding:0 !important}
body.q03mode .idbox,body.q03mode .logbox{display:none}
@media(max-width:820px){.q03steps{grid-template-columns:1fr}}
@media print{body.q03mode .q03bar,body.q03mode .q03steps,body.q03mode .abar,body.q03mode .hd{display:none !important}}

@media(max-width:820px){
  body{padding:0}
  .sheet{box-shadow:none}
  .hd{padding:18px 20px 0} .intake{margin:12px 20px 0}
  .body{padding:16px 20px 8px} .foot{padding:14px 20px 22px} .done{padding:28px 20px}
  .il2{width:auto;flex:0 0 auto}
}
@media print{
  @page{size:A4;margin:11mm 12mm}
  .abar,.hd,.intake,.foot,.restart{display:none !important}
  body{background:#fff;padding:0;font-size:9pt}
  .sheet{box-shadow:none;max-width:none}
  .body,.done{padding:0}
  .bp,.bl{font-size:8.5pt} .bt{font-size:8.2pt}
  .bsec,.bt,.bw{page-break-inside:avoid}
}
</style>
</head>

async function api(payload){
  if(!ENDPOINT) return null;
  const r = await fetch(ENDPOINT, {
    method:"POST",
    redirect:"follow",
    headers:{"Content-Type":"text/plain;charset=utf-8"},  // 사전요청 회피
    body: JSON.stringify(payload)
  });
  return await r.json();
}

const MEM = {};

  async set(k,v){
    try{ if(window.storage){ await window.storage.set(k, JSON.stringify(v)); return; } }catch(e){}
    MEM[k]=v;
  },
  async get(k){
    try{ if(window.storage){ const r=await window.storage.get(k); return r? JSON.parse(r.value):null; } }catch(e){ return MEM[k]||null; }
    return MEM[k]||null;
  }
};
function newId(idx){
  const yy = String(new Date().getFullYear()).slice(2);      // 26
  const pre = "AC" + yy + "-";                                // AC26-
  const nums = idx.filter(x=>x.id.startsWith(pre))
                  .map(x=>parseInt(x.id.slice(pre.length),10))
                  .filter(n=>!isNaN(n));
  const next = nums.length ? Math.max(...nums)+1 : 1001;      // 그 해 1001부터
  return pre + next;
}

function roomAcOf(use, sounds){
  let k=ROOMAC_MAP[use];

  if(k==="개인 연습실" && S.some(n=>["성악","바이올린","비올라","첼로","콘트라베이스","판소리"].includes(n))) k="성악 · 현악 연습실";
  if(k==="개인 연습실" && S.includes("노래 · 보컬") && !S.some(n=>!["노래 · 보컬","유튜브 · 방송 · 스트리밍"].includes(n))) k="보컬 연습실";
  return k ? ROOMAC[k] : null;
}
function roomAcHTML(use, sounds, opts){
  const r=roomAcOf(use, sounds); if(!r) return "";

  "음악학원":[0.50,"강사 지시가 전달되어야 함"],
  "홈시어터":[0.35,"대사 명료도 우선"],
  "유튜브 · 스트리밍 · 리딩방":[0.30,"마이크에 잔향이 실리지 않게"],
  "댄스 · 짐":[0.70,"음악 재생 위주. 과하게 죽일 필요 없음"],
  "공부방 · 주식방":[0.50,"일반 실내 수준"],
  "작업실":[0.50,"일반 실내 수준"],
  "상담실 · 회의실":[0.60,"말소리 명료도"],
  "독서실 · 스터디카페":[0.60,"일반 실내 수준"],
  "여러 방을 나누는 공사":[0.50,"용도별 재확인 필요"],
  "기타":[0.50,"용도 확인 후 조정"]
};

function buildBrief(){
  if(D.space==="흡음") return null;

  /* ── 1. 대상 주파수 ── */
  let lo=9999, loName="", hit=false, loud=[], quiet=[], both=false, inbound=false;
  const picked=[];
  D.sounds.forEach(n=>{
    const i=FIND(n); if(!i) return;
    if(i[2]==="hit"||i[2]==="hitq") hit=true;
    if(i[2]==="loud") loud.push(n);
    if(i[2]==="quiet") quiet.push(n);
    if(i[2]==="both"){ quiet.push(n); both=true; }
    if(i[2]==="in") inbound=true;
    if(i[1]>0){ picked.push([n,i[1]]); if(i[1]<lo){ lo=i[1]; loName=n; } }
  });
  /* 전자 드럼 — 합주·학원은 스피커 모니터가 전제이므로 어쿠스틱에 준해 잡는다 */
  const SPK_SPACE = ["합주실","음악학원","홈시어터","댄스 · 짐"];
  let eDrumSpk = false;
  if(D.sounds.includes("드럼 (전자)")){
    const withSpk = D.sounds.some(n=>["모니터 스피커","서브우퍼","홈시어터"].includes(n));
    if(SPK_SPACE.includes(D.space) || withSpk){
      eDrumSpk = true;
      for(const it of picked) if(it[0]==="드럼 (전자)") it[1] = 50;
    }
  }
  /* 전자 드럼 + 서브우퍼 조합이면 전자 드럼을 40Hz로 본다 */
  let subLow = false;
  if(D.sounds.includes("드럼 (전자)") && D.sounds.includes("서브우퍼")){
    subLow = true;
    for(const it of picked) if(it[0]==="드럼 (전자)") it[1] = 40;
  }

  picked.sort((a,b)=>a[1]-b[1]);
  if(picked.length){ lo = picked[0][1]; loName = picked[0][0]; }
  const quietOnly = quiet.length && lo===9999;

  /* 음원 음압 추정 */
  const QUIETSET = ["공부","주식 매매","화상회의","명상 · 요가","수면"];
  const AMPSET = ["일렉기타 앰프","베이스 앰프","모니터 스피커","서브우퍼","홈시어터"];
  const TALKSET = ["강의 · 회의"];
  function splOf(n){
    if(QUIETSET.includes(n)||TALKSET.includes(n)) return SPLTAB.quiet;
    const i=FIND(n); if(!i) return SPLTAB.normal;
    if(i[2]==="hit") return SPLTAB.hit;
    if(i[2]==="hitq"){
      const spk = ["합주실","음악학원","홈시어터","댄스 · 짐"].includes(D.space)
        || D.sounds.some(x=>["모니터 스피커","서브우퍼","홈시어터"].includes(x));
      return spk ? 110 : SPLTAB.hitq;
    }
    if(i[2]==="loud"||AMPSET.includes(n)) return SPLTAB.loud;
    return SPLTAB.normal;
  }
  let B_SPL = null;
  if(D.sounds.length) B_SPL = Math.max(...D.sounds.map(splOf));

  /* ── 2. 목표 f₀ ── */
  const f0 = lo<9999 ? (lo/1.414) : null;

  /* ── 3. 등급 산정 ── */
  /* 최저 기음이 각 등급의 "막히기 시작" 주파수 이상인지로 판정 */
  let base, overLimit=false, noneOK=false, target=lo, targetName=loName, skipped=[];
  if(quietOnly){ base = 2; }
  else {
    const pick = f => { for(let L=1;L<=5;L++) if(f >= START[L]) return L; return null; };
    base = pick(lo);
    if(base===null){
      /* 최저 기음이 L5로도 안 잡힘 → 다음 소리로 타겟 하향 */
      overLimit = true;
      for(const [n,f] of picked){
        const L = pick(f);
        if(L===null){ skipped.push([n,f]); continue; }
        base = L; target = f; targetName = n; break;
      }
      if(base===null){ base = 5; noneOK = true; }
    }
  }

  let fL = base, cL = base, wL = base;
  /* 바닥은 층 위치와 무관하게 유지 — 고체전달음은 위·옆으로도 돈다 */
  if(hit) fL = Math.min(5, base+1);
  if(D.floor==="최상층" || D.floor==="건물 전체") cL = Math.max(0, cL-2);

  /* 천장고 제약 — 잔여 2.1m 확보 */
  const H = (!D.noH && parseFloat(D.h)) ? parseFloat(D.h)*1000 : null;
  let capped=false, rest=null;
  if(H){
    while(cL>0){
      rest = H - SPEC.C[cL].h - FH[fL];
      if(rest >= 2100) break;
      cL--; capped=true;
    }
    rest = H - SPEC.C[cL].h - FH[fL];
  }
  /* 제안값 보존 후 현장 조정(실제 시공) 등급 적용 — 이후 계산은 전부 실제 시공 등급을 따른다 */
  const prop = { fL, wL:Math.max(1,wL), wpL:Math.max(1,wL), cL };
  const ov = VIEW==="partner" ? {} : (D.ov||{});
  const num = v => (v===null||v===undefined||v==="") ? null : +v;
  if(num(ov.F)!==null)  fL = num(ov.F);
  if(num(ov.WS)!==null) wL = num(ov.WS);
  const wpL = num(ov.WP)!==null ? num(ov.WP) : prop.wpL;
  if(num(ov.C)!==null)  cL = num(ov.C);
  let restLow=false;
  if(H){ rest = H - SPEC.C[cL].h - FH[fL]; restLow = rest<2100; }
  const adjusted = ["F","WS","WP","C"].filter(k=>num(ov[k])!==null);

  /* ── 아파트형 (M 시리즈) — L 등급 대신 유닛 조립형으로 판정. 천장은 시트 확정, 벽·바닥은 시트 대기 ── */
  let apt=null;
  if(typeof isApt==="function" && isApt()){
    const lowSrc = picked.filter(([,f])=>f<100).map(x=>x[0]);
    const drum = picked.some(([n])=>n==="드럼 (어쿠스틱)");
    const cM = lowSrc.length ? "M2" : "M1";
    const ovm = VIEW==="partner" ? {} : (D.ovm||{});
    const C = SPECM.C[ovm.C]?ovm.C:cM, F = SPECM.F[ovm.F]?ovm.F:"M2";
    const party = ovm.party==="건식" ? "건식" : "콘크리트";          // 세대 경계벽 종류 — 검토자 지정, 기본 콘크리트
    const Wp = party==="건식" ? "M3" : "M2";                          // 경계벽 유닛
    const wallBan = SPECM.W[Wp].ban.filter(b=>picked.some(([n])=>n===b));
    let restM=null;
    if(H){ restM = H - SPECM.C[C].h - SPECM.F[F].h; }
    apt = { prop:{C:cM,W:"M1",F:"M2"}, C,W:"M1",Wp,party,F, lowSrc, drum, rest:restM,
            notes:[ drum?"어쿠스틱 드럼 불가 — 부유바닥이 필요한데 아파트 바닥고가 부족. 전자드럼으로 전환하거나 아파트형 해제 후 L 등급 검토":null,
                    wallBan.length?`${party} 경계벽(AC-W-${Wp})에서 ${wallBan.join(", ")}은(는) 대응 불가 — 경계벽에 피스 고정도 못 하는 조건이라 저역 음원은 아파트 구조에서 막을 수 없음`:null,
                    lowSrc.length?`100Hz 이하 소리(${lowSrc.join(", ")}) — 천장 M2(기존 천장 하면 돌차음판 4T). 대출력 저역은 비대응, 계약 전 서면 고지`:null,
                    "위층 뛰는 소리 · 인접 세대 충격음은 비대응 — 기존 천장 존치 조건에서 구조적으로 불가, 서면 고지" ].filter(Boolean) };
  }

  if(apt && apt.rest!==null){ rest=apt.rest; restLow=rest<2100; }

  /* ── 4. 룸 모드 ── */
  let modes=null, clash=[], cube=false;
  if(!D.noSize && parseFloat(D.w) && parseFloat(D.d)){
    const L=Math.max(parseFloat(D.w),parseFloat(D.d)),
          W=Math.min(parseFloat(D.w),parseFloat(D.d)),
          Hm=(H? (rest||H)/1000 : parseFloat(D.h)||2.4);
    modes=[["길이 "+L+"m", 171.5/L],["폭 "+W+"m", 171.5/W],["높이 "+Hm.toFixed(2)+"m", 171.5/Hm]];
    const r=L/W;
    if(r<1.15) cube=true;
    picked.forEach(([n,f])=>{
      modes.forEach(m=>{ if(Math.abs(m[1]-f)/f < 0.12) clash.push([n,f,m[0],m[1]]); });
    });
  }

  /* ── 4-b. 사용 시간대 · 목표 배경소음 ── */
  const BG = {
    "낮에만 · 오후 6시까지":[45,40,"생활소음이 깔려 있어 여유가 큼"],
    "저녁까지 · 밤 10시까지":[40,35,"저녁은 배경소음이 낮아지기 시작"],
    "밤늦게도 · 10시 이후":[30,25,"배경소음이 사라져 저역이 그대로 드러남"],
    "정해지지 않음":[30,25,"최악 조건(심야)으로 잡아둠"]
  };
  const sensitive = (D.bldg==="아파트"||D.bldg==="빌라 · 다세대") && D.floor==="중간층";
  const raw = BG[D.when] || [30,25,"—"];
  const bg = [sensitive?raw[1]:raw[0], raw[2], sensitive];
  let need = null;
  if(B_SPL) need = B_SPL - bg[0];

  /* ── 5. 시공 주의 ── */
  const care=[];
  if(apt){
    care.push(["전제","기존 천장 철거 금지 — 원상복구 조건 · M 시리즈 전제. 슬래브 타공 0, 방진행거 병용 금지(접촉점 0 원칙)."]);
    care.push(["전제","벽면 · 경계벽에 피스 고정 금지 — 진동 직결 · 원상복구 불가. 유닛은 피스 체결만, 접착제 사용 금지(재사용 불가)."]);
    care.push(["천장","방 폭 실측 → 스팬 판정: ≤ 2.7m @600 / ≤ 2.9m @450 / 초과 시 짧은 변 방향. 3.0m @600 강행 금지(처짐 15mm)."]);
    care.push(["천장","박스빔은 벽 유닛 상단 턱에 양단 지지 — 턱이 PB면 각재로 보강(천장 하중 약 145kg 집중). 유닛 상면 마블 50 사전 접착은 표준, 슬래브 비접촉 최종 확인(배관 · 배선 · 유닛 상면)."]);
    care.push(["천장","흡음텍스는 구조 아님 — 벽 안쪽 면까지만, 벽 마감과 만나는 곳은 그림자 홈 5~10mm(장기 처짐). 벽-천장 접합은 강결(턱 위 방진 패드 금지)."]);
    if(apt.C==="M2") care.push(["천장","M2 — 기존 천장 하면에 돌차음판 4T 자체 점착(1000×1000 · 6.5kg). 노후 세대는 기존 달대 이완 · 부식 먼저 확인(7.2 → 13.7kg/㎡). 유닛 거치 전에 부착."]);
    care.push(["벽","유닛 프레임은 반 칸 어긋내기(정렬 배치 시 관통 경로). 유닛 관통 피스 금지(두 판 직결 → 중공층 무효). 마블은 압착하지 않는다(흐름저항 저하 · 브릿지). 상하부 고무패드 생략 금지."]);
    care.push(["벽",apt.party==="건식"
      ?"M3 건식 경계벽 — 벽면 차음석고 12.5T 보강이 먼저(19 → 32kg/㎡). 콘센트 마주보기 지점 점검 후 착공(개구부로 남음). 경계벽 철거 · 개조 금지(내화 · 법정 차음 구조). 스터드 관통 시 옆 세대 직결."
      :"M2 콘크리트 경계벽 — 유닛 2겹 같은 방향(마블면이 벽) + 차음석고 12.5T. 마감판을 유닛에 선부착하지 않는다(600마다 관통 이음선)."]);
    care.push(["벽","M1 내부벽 — 유닛 A 마블면이 벽, 유닛 B 뒤집어 PB끼리 맞댐. 기존 내부벽에 PB 15T 보강. 실내측 마블 50이 타공판 배후 흡음층."]);
    care.push(["바닥","벽 하단 하중 분산판(합판 18T · 접지 폭 300) 생략 금지 — 천장 145 + 벽 920 ≈ 1,065kg, 5.8kPa는 AC-F-M2 방진층 설계 하중 초과. 분산판 적용 시 약 3.5kPa."]);
    care.push(["고지","위층 뛰는 소리 · 대출력 저역 비대응을 계약 전 서면 고지. 추정 성능 대외 기재 금지(마블 흡음 데이터 미확보). 인허가 시설은 마블 대신 미네랄울 50K."]);
  } else {
  care.push(["공통","외벽(구조벽에 접한 벽)은 원 슬래브에 직접 세운다. 부유바닥 위에 올리거나 하부에 방진패드를 넣지 않는다."]);
  care.push(["공통","내벽은 부유바닥 위에 세우고, 부유 슬래브 단부는 공기층 안에서 끝낸다. 슬래브 단부를 복도로 노출하지 않는다."]);
  care.push(["공통","모든 러너는 실런트 베드(Ecoseal 805) 위에 고정한다. 방진패드나 경질재로 대체하지 않는다 — 질량 결합이 끊겨 중역 공진이 증폭된다."]);
  care.push(["공통","삼중 구성 금지. 판을 한 겹 더 띄우면 저역에서 오히려 나빠진다."]);
  if(wL>=3) care.push(["벽","그린글루 제진층 적용(L3부터). 도포 후 15분 내 압착."]);
  if(wL>=1) care.push(["벽","돌차음판 4T는 구조체 면에 전 등급 적용. L5는 마감판 사이에 한 겹 더."]);
  care.push(["벽","이격·열간분리 최대 50mm, 미네랄울 충진 최대 100T(50K). 미네랄울은 구조체 쪽에 밀착하고 마감판 뒷면과 닿지 않게 한다."]);
  care.push(["벽","하지는 바닥에서 눕혀 짜고 세워 고정. 스태거드 스터드는 눕혀 짜기가 불가해 표준에서 제외."]);
  care.push(["벽","WS 배선은 관이 구조체와 각재를 동시에 접촉하지 않게 한다. WP 배선은 반드시 한쪽 열에만 — 열간 분리 구간 횡단은 이중벽을 무효로 만든다."]);
  if(cL>=2) care.push(["천장","천장 장선은 개별 설치. 2×4 표준이며 2×6은 하중 때문에 제외. 장스팬은 제작 박스빔."]);
  if(cL>=4) care.push(["천장","상부 천장에 방진행거, 이격 50mm 확보. 하부는 박스빔 140mm."]);
  care.push(["천장","드레인은 응축수 펌프 방식으로 한다."]);
  if(hit) care.push(["바닥","충격음 대응이 우선. 방진고무는 점 지지(십자형)로 면압을 확보한다 — 판재를 전면에 깔면 눌리지 않아 f₀가 올라간다."]);
  care.push(["바닥","이중벽 공기층은 최소 100mm. 내부는 비워두고 단열은 각 벽 스터드 안에만 넣는다."]);
  }

  /* ── 6. 확인 필요 ── */
  const ask=[];
  ask.push("맞닿은 면 — 위·아래·옆 몇 면인지 (시공 면 = 물량 결정)");
  ask.push("철거 가능 여부 — 임차면 원상복구 범위");
  ask.push("개구부 — 문·창·에어컨·환기·덕트 (실제 성능 상한을 결정)");
  ask.push("사용 시간대 — 심야 포함 여부");
  if(D.sounds.includes("드럼 (전자)")) ask.push("전자 드럼 모니터 방식 — 헤드폰인지 스피커인지");
  if(capped) ask.push("천장고 조정 의사 — 잔여 "+(rest/1000).toFixed(2)+"m 수용 가능한지");
  if(overLimit) ask.push("저역 목표 합의 — AC-B(박스인박스) 전환 여부와 예산");
  if(apt){
    ask.push("기존 천장 상태 — 달대 이완 · 부식, 기존 천장고 실측(유닛 128 + 공동 200 확보 가능한지)");
    ask.push("세대 경계벽 종류 — 콘크리트(두드려 판정)인지 건식인지 · 콘센트 마주보기 위치");
    ask.push("관리규약 · 인테리어 신고 — 바닥 · 천장 변경 허용 범위, 원상복구 조건");
    ask.push("비대응 고지 동의 — 위층 뛰는 소리 · 대출력 저역은 못 막는다는 서면 확인");
    if(apt.drum) ask.push("어쿠스틱 드럼 — 전자드럼 헤드폰 전환 의사 (아파트에서는 불가)");
  } else if(D.bldg==="아파트") ask.push("관리규약상 바닥 구조 변경 허용 여부");
  if(D.ct!=="계약 완료") ask.push("계약 조건 — 원상복구 범위·구조 변경 허용 조항");
  if(D.noSize) ask.push("실측 — 치수 미기재");
  if(D.soundEtc) ask.push("직접 입력 악기 대역 확인: "+D.soundEtc);

  /* ── 실내 음향 ── */
  let ac=null;
  if(!D.noSize && parseFloat(D.w) && parseFloat(D.d)){
    const W=parseFloat(D.w), Dp=parseFloat(D.d),
          Hi=(H? (rest||H)/1000 : (parseFloat(D.h)||2.4));
    const V = W*Dp*Hi;
    const S = 2*(W*Dp + W*Hi + Dp*Hi);
    const key = RT[D.space] ? D.space : "기타";
    const tgt = RT[key][0], why = RT[key][1];
    const a0 = 0.06;                    // 석고 마감 평균 흡음률
    const A0 = a0*S;
    const rtNow = 0.161*V/A0;           // 마감만 했을 때
    const Areq = 0.161*V/tgt;
    const dA = Areq - A0;
    const aAbs = 0.85;                  // 흡음 마감 평균
    const need = dA>0 ? dA/(aAbs-a0) : 0;
    ac = {V,S,Hi,tgt,why,rtNow,Areq,A0,need, pct: need/S*100};
  }

  return {apt,prop,wpL,adjusted,restLow,lo,loName,f0,picked,hit,loud,quiet,both,inbound,quietOnly,overLimit,
          fL,wL,cL,capped,rest,H,modes,clash,cube,care,ask,ac,bg,need,B_SPL,
          target,targetName,skipped,noneOK,eDrumSpk,subLow,splOf};
}

function grade(){
  if(D.space==="흡음") return {g:"AC-AB 흡음 상담", note:["차음 등급 산정 대상 아님"]};
  let lo=9999, loName="", hit=false, loud=[], inbound=false, quiet=[], both=false;
  D.sounds.forEach(n=>{
    const i=FIND(n); if(!i) return;
    if(i[2]==="hit"||i[2]==="hitq") hit=true;
    if(i[2]==="loud") loud.push(n);
    if(i[2]==="in") inbound=true;
    if(i[2]==="quiet") quiet.push(n);
    if(i[2]==="both"){ quiet.push(n); both=true; }
    if(i[1]>0 && i[1]<lo){ lo=i[1]; loName=n; }
  });
  let g="—";
  if(lo<9999){
    g = lo<=35 ? "L5 초과 — AC-B 검토" : lo<=50 ? "L4" : lo<=80 ? "L3"
      : lo<=150 ? "L2" : "L1 ~ L2";
  } else if(quiet.length) g = "유입 차단형 — 소음원 확인 후 결정";
  else if(hit) g = "충격음 전용 — 바닥 중심";
  const n=[];
  if(quiet.length) n.push(`<b>${quiet.join(", ")}</b> — 내보낼 소리가 없는 실. 등급은 <b>무엇을 막느냐</b>로 정한다. 2단계에서 방해 소음원 확인 (윗집 발소리 / 도로 / 옆방 / 설비 / 복도)`);
  if(both) n.push("<b>화상회의 — 양방향</b>. 들어오는 소음뿐 아니라 통화 음성·스피커 소리가 나가는 것도 잡아야 함");
  if(lo<9999) n.push(`최저 기음 <b>${lo}Hz</b> (${loName}) 기준`);
  if(lo<=35) n.push("<b>AC-A 한계 초과</b> — 박스인박스(AC-B) 검토 필요");
  if(inbound) n.push("<b>유입 차단 중심 현장</b> — 마이크에 잡히는 외부 소음이 실제 문제일 가능성. 벽 등급보다 창호 · 환기구 · 기밀이 관건. 목표 배경소음(NC) 확인");
  if(hit) n.push("충격음 동반 — 바닥 등급 우선");
  if(loud.length) n.push(`음압 큼 (${loud.join(", ")}) — 벽 질량 · 기밀 강화`);
  if(D.sounds.some(x=>x.startsWith("피아노"))) n.push("피아노 — 실사용 하한 60Hz로 봄. 연주 장르 확인");
  if(!D.noH && parseFloat(D.h)){
    const hv=parseFloat(D.h);
    if(hv<=2.5) n.push(`천장고 <b>${hv}m</b> — 상급 천장(365mm+) 적용 시 잔여 ${(hv-0.4).toFixed(2)}m. <b>천장 등급 상한 걸림</b>`);
    else if(hv<=2.8) n.push(`천장고 <b>${hv}m</b> — 중급까지 여유. 상급 적용 시 잔여 ${(hv-0.4).toFixed(2)}m`);
    else n.push(`천장고 <b>${hv}m</b> — 등급 제약 없음`);
  } else n.push("천장고 미기재 — 실측 선행");
  if(D.bldg==="아파트") n.push("아파트 — 관리규약상 바닥 구조 변경 가능 여부 확인");
  if(D.floor==="중간층") n.push("중간층 — 바닥·천장 모두 필요");
  if(D.floor==="1층 · 필로티 위") n.push("아래 세대 없음 — 바닥 등급 완화 가능");
  if(D.floor==="최상층") n.push("위 세대 없음 — 천장 등급 완화 가능");
  if(D.space==="공부방 · 주식방" || D.space==="작업실")
    n.push("가정 내 실 — 인접면 중 자가 공간 비율 확인. 그만큼 등급 완화 여지");
  if(D.space==="독서실 · 스터디카페" || D.space==="음악학원" || D.space==="상담실 · 회의실" || D.space==="여러 방을 나누는 공사")
    n.push("다실 구성 — 실간 칸막이(AC-WP) 중심 · 다중이용업소 마감재 규정 확인");
  if(D.sido==="그 밖의 지역") n.push(`<b>수도권 외 — ${D.gu}</b>. 출장 조건 · 숙식 · 자재 운송비 반영 여부 판단 후 회신`);
  if(D.ct==="계약 전") n.push("<b>계약 전</b> — 공간 미확정. 실측 불가하나 <b>계약 전 조건 검토가 가장 값어치 있는 개입 시점</b>. 층고 · 구조 변경 가능 여부 · 인접 용도 확인 권고");
  if(D.ct==="계약 예정") n.push("계약 예정 — 계약서에 원상복구 범위 · 구조 변경 허용 여부를 넣도록 조언");
  if(D.ct==="계약 완료") n.push("계약 완료 — 즉시 실측 가능");
  if(D.pt==="1개월 이내") n.push("<b>1개월 이내</b> — 공기가 등급보다 우선. 달성 가능 등급 하향 고지 필요");
  if(D.bTBD) n.push("예산 미제시 — 등급별 안 2~3개로 제시");
  if(D.noSize) n.push("치수 미기재 — 실측 선행");
  if(D.soundEtc) n.push(`직접 입력: ${D.soundEtc} — 대역 확인 필요`);
  if(!n.length) n.push("특이사항 없음");
  return {g, note:n};
}

/* 실 분할 — 접수가 "여러 방을 나누는 공사"면 고정, 그 외는 검토자가 체크. 실이 등록돼 있어도 분할로 본다 */
function isSplit(){ return D.space==="여러 방을 나누는 공사" || !!D.split || (D.rooms||[]).length>0; }
/* 아파트형 — 접수 건물이 아파트면 자동, 검토자가 켜고 끌 수 있다 (null = 건물 따름) */
function isApt(){ return D.apt===null||D.apt===undefined ? D.bldg==="아파트" : !!D.apt; }
function splitBarHTML(){
  if(VIEW!=="internal") return "";
  const fixed = D.space==="여러 방을 나누는 공사";
  const aptAuto = D.apt===null||D.apt===undefined;
  return `<div class="splitbar">
    <label><input type="checkbox" id="splitChk" ${isSplit()?"checked":""} ${fixed?"disabled":""}>
      <b>실을 나눔</b> — 04 · 06 대신 07 실별 설계로</label>
    <span>${fixed?"접수 공간이 '여러 방을 나누는 공사'라 고정":(D.rooms||[]).length?"실이 등록되어 분할로 봄":"한 방이면 끄고, 나누면 켠다"}</span>
    <i class="sep"></i>
    <label><input type="checkbox" id="aptChk" ${isApt()?"checked":""}>
      <b>아파트형</b> — 아파트 단면 규칙으로 검토</label>
    <span>${aptAuto?`접수 건물 '${D.bldg||"—"}'에 따라 ${isApt()?"자동 켜짐":"자동 꺼짐"} · 바꾸려면 체크`:`검토자 지정 (건물은 '${D.bldg||"—"}')`}${aptAuto?"":` · <a href="#" id="aptAuto">건물 따름으로</a>`}</span>
    <span class="save-note">검토 조정 저장으로 기록</span></div>`;
}
function briefHTML(){
  const B=buildBrief();
  if(!B) return `<div class="bsec"><div class="bh">판정</div>
    <div class="bp">흡음 단독 공사 — 차음 등급 산정 대상 아님. AC-AB 계열로 진행.</div></div>`;
  let h=splitBarHTML();

  /* 1 목표 */
  h+=`<div class="bsec"><div class="bh">01 &nbsp;체크하신 소리</div>`;
  if(B.quietOnly){
    h+=`<div class="bp">내보낼 소리가 없는 실(${B.quiet.join(", ")}).
        <b>등급은 무엇을 막느냐로 정한다.</b> 방해 소음원을 먼저 확정해야 설계가 시작된다.</div>`;
  } else {
    h+=`<table class="bt"><tr><th>소리원천</th><th>최저기음</th><th>음압</th><th>필요 천장고<br><small>최저 · 연습 · 녹음</small></th><th>부스</th><th>진동</th></tr>`;
    B.picked.forEach(([n,f])=>{
      const i=FIND(n), d=noteOf(n);
      const bo=d?d.booth:"—", boCls=bo==="X"?"bad":bo==="△"?"warn":"ok";
      h+=`<tr${f===B.lo?' class="hi"':''}><td>${n}</td><td class="m">${f} Hz</td>
          <td class="m">${B.splOf(n)} dB</td>
          <td class="m">${d?[d.hmin,d.hpr,d.hrec].filter(Boolean).join(" · "):"—"}</td>
          <td class="ins ${boCls}">${bo}</td>
          <td class="ins ${d&&/큼/.test(d.vib||"")?"bad":""}">${d?d.vib:(i&&(i[2]==="hit"||i[2]==="hitq")?"바닥 진동":"—")}</td></tr>`;
    });
    h+=`</table>`;
    h+=`<div class="bp">가장 낮은 소리 <b>${B.lo}Hz</b> (${B.loName}) ·
        가장 큰 소리 <b>${B.B_SPL}dB</b>. 부스 O 가능 · △ 조건부 · X 룸 공사.</div>`;
    /* 항목별 설계 비고 — AC 사전 비고판 */
    const noted=B.picked.map(([n])=>[n,noteOf(n)]).filter(x=>x[1]);
    if(noted.length){
      h+=`<details class="notes-inst"${VIEW==="partner"?"":" open"}><summary>항목별 설계 비고 (${noted.length}) — AC 사전 비고판</summary>`;
      noted.forEach(([n,d])=>{
        h+=`<div class="bl"><b>${n}</b> <span class="nd">AC 하한 ${d.ac}${d.flag&&d.flag!=="—"?" · "+d.flag:""}${d.absorb?" · 흡음 "+d.absorb:""}</span><br>${d.note}${n==="드럼 (전자)"?" <i>(전자드럼: 킥 페달 충격은 어쿠스틱과 동일 — 방진 플랫폼)</i>":""}</div>`;
      });
      h+=`</details>`;
    }
    /* 필요 천장고 — 접수 공간 용도 기준 */
    const nh=needHeight(B.picked.map(x=>x[0]), D.space);
    if(nh){
      const cur = B.H ? B.rest/1000 : null;
      const bad = cur!==null && cur < nh.v - 0.005, tight = cur!==null && !bad && nh.min && cur < nh.min;
      h+=`<div class="${bad?"bw":"bp"}"><b>필요 천장고 ${nh.v.toFixed(1)}m</b> (${nh.n} · ${nh.src} 기준)${cur!==null?` — 시공 후 실높이 <b>${cur.toFixed(2)}m</b>${bad?" 미달":" 충족"}`:" — 천장고 실측 후 비교"}.${bad?" 등급을 낮춰 높이를 벌지, 용도를 연습 전용으로 낮출지, 이 소리를 빼야 할지 정해야 한다.":""}</div>`;
    }
  }
  h+=`</div>`;

  /* 필요 차음량 */
  if(B.need!==null){
    h+=`<div class="bsec"><div class="bh">02 &nbsp;필요 차음량</div>`;
    h+=`<table class="bt"><tr><th>소리원천</th><th>음압</th><th>목표</th><th>필요 차음량</th></tr>`;
    const rows = B.quietOnly ? [] : B.picked.slice().sort((a,b)=>B.splOf(b[0])-B.splOf(a[0]));
    rows.forEach(([n,f])=>{
      const sp=B.splOf(n);
      h+=`<tr${sp===B.B_SPL?' class="hi"':''}><td>${n}</td><td class="m">${sp}</td>
          <td class="m">${B.bg[0]}</td><td class="m">${sp-B.bg[0]} dB</td></tr>`;
    });
    h+=`</table>`;
    h+=`<div class="bp">사용 시간대 <b>${D.when}</b> → 목표 배경소음 <b>${B.bg[0]}dB</b>.
        ${B.bg[1]}. ${B.bg[2]?"<b>주거 인접 중간층이라 5dB 조여 잡았다.</b>":""}</div>`;
    h+=`<table class="bt"><tr><th>시간대</th><th>목표</th><th>최대 필요 차음량</th></tr>
      <tr><td>낮에만</td><td class="m">45</td><td class="m">${B.B_SPL-45} dB</td></tr>
      <tr><td>저녁까지</td><td class="m">40</td><td class="m">${B.B_SPL-40} dB</td></tr>
      <tr><td>심야</td><td class="m">30</td><td class="m">${B.B_SPL-30} dB</td></tr>
      </table>`;
    h+=`<div class="bp">낮에만 쓰면 심야 대비 <b>15dB</b>이 내려간다.
        <b>시간대 조정이 등급을 올리는 것보다 효과가 큰 경우가 많다.</b></div>`;
    if(D.when==="밤늦게도 · 10시 이후")
      h+=`<div class="bw"><b>심야 사용.</b> 남는 대역이 있으면 <b>사용 시간 제한을 계약 조건으로 명시</b>한다.
          시공 조건이 아니라 사용 조건이므로 문서에 남기지 않으면 나중에 우리 책임이 된다.</div>`;
    if(D.when==="정해지지 않음")
      h+=`<div class="bw">사용 시간 미정 — 심야 기준으로 잡아두었다. 상담에서 반드시 확정할 것.</div>`;
    h+=`</div>`;
  }

  /* 벽 사다리 · 목표 주파수 — 아파트형은 M 시리즈 대응 범위로 */
  if(!B.quietOnly && B.apt){
    h+=`<div class="bsec"><div class="bh">03 &nbsp;어디까지 잡히는가</div>`+aptReachHTML(B)+`</div>`;
  }
  if(!B.quietOnly && !B.apt){
    h+=`<div class="bsec"><div class="bh">03 &nbsp;어디까지 잡히는가</div>`;
    h+=`<table class="bt"><tr><th>등급</th><th>공진점 f₀</th><th>막히기 시작</th><th>STC 추정</th></tr>`;
    for(let L=1;L<=5;L++){
      const on = (L===Math.max(1,B.wL));
      h+=`<tr${on?' class="hi"':''}><td>${on?"▶ ":""}L${L}</td><td class="m">${F0[L]} Hz</td>
          <td class="m">${START[L]} Hz 이상</td><td class="m">${STC[L]}</td></tr>`;
    }
    h+=`</table>`;
    h+=`<div class="bp">벽은 자기 공진점 근처에서 가장 약하다. 확실히 막히는 것은
        공진점의 <b>약 1.4배(√2)</b> 위부터다. 위 표의 세 번째 칸이 그 값이다.</div>`;
    if(B.overLimit){
      h+=`<div class="bw"><b>1순위 ${B.loName} ${B.lo}Hz — AC-A로 도달 불가.</b>
          최고 등급 L5의 공진점이 44Hz라 <b>62Hz 아래는 벽으로 막을 수 없다.</b></div>`;
      let rank=1;
      h+=`<table class="bt"><tr><th>순위</th><th>대상</th><th>결과</th></tr>`;
      B.skipped.forEach(([n,f])=>{
        h+=`<tr><td class="m">${rank++}</td><td>${n} ${f}Hz</td><td>AC-A 범위 밖</td></tr>`;
      });
      if(B.noneOK){
        h+=`</table>`;
        h+=`<div class="bw"><b>체크하신 소리가 전부 AC-A 범위 밖이다.</b>
            L5는 우리가 세울 수 있는 최고 등급일 뿐 이 대역을 막는다는 뜻이 아니다.

/* 천장 등급을 바꿔 높이를 벌 때의 선택지 — 바닥은 고정 */
function altHTML(B){
  if(!B.H) return "";
  const CAP = {0:["차음 아님 — 소리는 그대로 위로 감",""],
               1:["중고역만 (5~8dB) — 저역·충격음 통과",""],
               2:["전대역 (벽 지지 독립) — 위층 충격음은 남음",""],
               3:["충격음 포함 · 설비층 별도",""],
               4:["방진행거 — 위층 충격음까지 차단",""],
               5:["최상 — 마감판 상향",""]};

  /* 후보: 현재 등급과 그 아래 두 단계 */
  const cand = [];
  for(let L=B.cL; L>=0 && cand.length<3; L--){
    const rest = B.H - SPEC.C[L].h - FH[B.fL];
    if(rest < 1800) continue;
    const hm = 171.5 / (rest/1000);
    cand.push({L, rest, hm});
  }
  if(cand.length < 2) return "";

  /* 악기 기음과 겹치는지 */
  const clash = f => B.picked.filter(p => Math.abs(p[1]-f)/f < 0.12);

  let h = `<div class="bg">천장 등급별 높이 · 대안</div>`;
  h += `<div class="bp">천장높이 <b>${D.h}m</b> · 바닥 <b>AC-F-${lvName(B.fL)} (${FH[B.fL]}mm)</b> 고정.
        천장 등급만 바꿔 남는 높이를 비교한다.</div>`;
  h += `<table class="bt"><tr><th>대안</th><th>천장</th><th>먹는 높이</th>
        <th>방음실높이</th><th>높이 모드</th><th>잡히는 것</th></tr>`;
  cand.forEach((c,i)=>{
    const cl = clash(c.hm);
    h += `<tr${i===0?' class="hi"':''}>
      <td class="m">${i===0?(B.adjusted.includes("C")?"시공":"권장"):"대안 "+(i+1)}</td>
      <td class="m b">AC-C-${lvName(c.L)}</td>
      <td class="m">${SPEC.C[c.L].h} mm</td>
      <td class="m b">${(c.rest/1000).toFixed(2)} m</td>
      <td class="m">${c.hm.toFixed(0)} Hz${cl.length?" ⚠":""}</td>
      <td>${CAP[c.L][0]}</td></tr>`;
  });
  h += `</table>`;

  cand.forEach((c,i)=>{
    const cl = clash(c.hm);
    if(cl.length)
      h += `<div class="bw"><b>${i===0?(B.adjusted.includes("C")?"시공안":"권장안"):"대안 "+(i+1)}</b> 방음실높이 ${(c.rest/1000).toFixed(2)}m가
            만드는 ${c.hm.toFixed(0)}Hz 모드가 ${cl.map(x=>x[0]+" "+x[1]+"Hz").join(", ")}와 겹친다.
            그 음이 유독 크게 들린다는 지적이 나올 자리다.</div>`;
  });

  const low = cand[cand.length-1];
  if(low.L <= 1)
    h += `<div class="bp">가장 낮은 대안은 천장 차음을 사실상 포기하는 구성이다.
          <b>위층 용도가 주거면 권하지 않는다.</b> 옥상·창고·주차장이면 이 선택이 합리적이다.</div>`;

  h += `<div class="bg">바닥을 낮추는 것에 대해</div>`;
  h += `<div class="bl">바닥을 한 단계 낮추면 <b>${
        FH[B.fL] - FH[Math.max(0,B.fL-1)]}mm</b>를 더 벌 수 있다.
        다만 권하지 않는다 — 충격음 진동은 아래로만 가는 것이 아니라 기둥과 내력벽을 타고
        위·옆으로도 돈다. 바닥을 낮추면 그 경로가 열린다.</div>`;
  h += `<div class="bl">높이가 정말 부족하고 <b>충격음이 없는 현장</b>에 한해 검토한다.
        ${B.hit?"<b>이 건은 충격음이 있어 해당하지 않는다.</b>":"이 건은 충격음이 없어 검토 여지가 있다."}</div>`;
  return h;
}

/* ══════════════ 실별 설계 ══════════════
   D.rooms = [{ name:"A", use:"", sounds:[], w:"", d:"", h:"" }]
   높이(h)는 비워두면 방음실높이(공사 후 실치수)를 쓴다 */
const ROOM_USES = ["개인 연습실","합주실","녹음실 · 스튜디오","컨트롤룸","보컬 부스","음악학원 강의실",
                   "홈시어터","댄스 · 짐","유튜브 · 스트리밍","공부방 · 주식방","작업실",
                   "상담실 · 회의실","대기실 · 공용","기타"];
const RT_USE = {"개인 연습실":"개인 연습실","합주실":"합주실","녹음실 · 스튜디오":"녹음실 · 스튜디오",
  "컨트롤룸":"유튜브 · 스트리밍 · 리딩방","보컬 부스":"녹음실 · 스튜디오","음악학원 강의실":"음악학원",
  "홈시어터":"홈시어터","댄스 · 짐":"댄스 · 짐","유튜브 · 스트리밍":"유튜브 · 스트리밍 · 리딩방",
  "공부방 · 주식방":"공부방 · 주식방","작업실":"작업실","상담실 · 회의실":"상담실 · 회의실",
  "대기실 · 공용":"상담실 · 회의실","기타":"기타"};
/* 룸모드 계산기(AC 사전 #modes)와 같은 판정 규칙
   높이 모드 1·2차 위에 길이·폭 1~4차가 ±tol 안에 앉으면 겹침, 길이×폭끼리 겹치면 주의 */
const RM_TOL = 0.05;
function modeVerdict(L,W,H,tol=RM_TOL){
  const fh=171.5/H, fl=171.5/L, fw=171.5/W, hh=[fh,fh*2];
  const hits=[], near=[];
  [["길이",fl],["폭",fw]].forEach(([name,f1])=>{
    for(let n=1;n<=4;n++){ const f=f1*n;
      hh.forEach((fx,k)=>{ const d=Math.abs(f-fx)/fx;
        if(d<=tol) hits.push({name,n,f,fx,k:k+1});
        else if(d<=tol*1.6) near.push({name,n,f,fx,k:k+1}); }); }
  });
  const lw=[];
  for(let a=1;a<=4;a++)for(let b=1;b<=4;b++){ const d=Math.abs(fl*a-fw*b)/(fw*b); if(d<=tol&&fl*a<200) lw.push({a,b,f:fl*a}); }
  const st = hits.length?"bad":lw.length?"warn":"ok";
  return {fh,fl,fw,hits,near,lw,st};
}
function banBands(H,tol=RM_TOL){ const o=[]; for(let n=1;n<=4;n++) o.push({n,lo:H*n*(1-tol),hi:H*n*(1+tol)}); return o; }
/* 한 변만 움직여 OK가 되는 가장 가까운 치수 (±1.0m, 5cm 단위) */
function nearestOK(L,W,H){
  const out=[];
  [["폭",W,v=>modeVerdict(L,v,H)],["길이",L,v=>modeVerdict(v,W,H)]].forEach(([nm,base,fn])=>{
    let best=null;
    for(let i=1;i<=20;i++){ for(const sg of [-1,1]){ const v=+(base+sg*i*0.05).toFixed(2);
      if(v<1.5) continue; if(fn(v).st==="ok"){ best={nm,v,d:v-base}; break; } } if(best) break; }
    if(best) out.push(best);
  });
  return out.sort((a,b)=>Math.abs(a.d)-Math.abs(b.d));
}
const RM_C = 343;

function roomName(i){ return String.fromCharCode(65+i); }
function roomQty(r){ const q=parseInt(r.qty,10); return q>0?q:1; }
const ROOM_OPEN=new Set();   // 세부 설계가 펼쳐진 실 (화면 상태) — "i" 는 실 전체, "i:grade" 등은 하위 항목
function subDet(i,key,title,sum,body){
  const k=`${i}:${key}`;
  return `<details class="rm-sub" data-k="${k}"${ROOM_OPEN.has(k)?" open":""}><summary><span>${title}</span><span class="rm-sum">${sum||""}</span></summary><div class="rm-subb">${body}</div></details>`;
}
function roomH(r,B){
  const v=parseFloat(r.h); if(v) return v;
  if(B && B.H && B.apt) return (B.H - SPECM.C[B.apt.C].h - SPECM.F[B.apt.F].h)/1000;
  if(B && B.H){ const a=roomActual(r,B); return (B.H - SPEC.C[a.C].h - FH[a.F])/1000; }
  return parseFloat(D.h)||2.4;
}
/* 실별 제안 등급과 실제 시공 등급. 제안: 바닥·천장은 부지 실제 등급, 벽·칸막이는 그 실의 소리로 */
function roomDims(r,B){
  const w=parseFloat(r.w), d=parseFloat(r.d);
  if(!w||!d) return null;
  return {L:Math.max(w,d), W:Math.min(w,d), H:roomH(r,B)};
}

/* 축 모드 1~4차 + 겹침(5% 이내) + 비율 진단 */
function analyzeDims(L,W,H){
  const ax=[["길이",L],["폭",W],["높이",H]];
  const modes=[];
  ax.forEach(([a,len])=>{ for(let n=1;n<=3;n++) modes.push({axis:a,n,f:RM_C*n/(2*len)}); });
  modes.sort((a,b)=>a.f-b.f);
  const coinc=[];
  for(let i=0;i<modes.length;i++) for(let j=i+1;j<modes.length;j++){
    const a=modes[i], b=modes[j];
    if(a.axis===b.axis) continue;
    if(Math.abs(a.f-b.f)/Math.min(a.f,b.f) < 0.05) coinc.push([a,b]);
  }
  const rat=[["길이/폭",L/W],["길이/높이",L/H],["폭/높이",W/H]];
  const intRatio=rat.filter(([,v])=>{ const k=Math.round(v); return k>=2 && Math.abs(v-k)/k<0.05; });
  return { modes, coinc, lw:L/W, square:L/W<1.15, long:L/W>2.5, intRatio,
           f1:Math.min(...modes.map(m=>m.f)) };
}

/* 용도별 목표 배경소음 — 옆 실이 이 용도면 이 값 아래로 넘어와야 한다 (dB) */
const ROOM_BG = {"녹음실 · 스튜디오":30,"보컬 부스":30,"컨트롤룸":35,"유튜브 · 스트리밍":35,"홈시어터":40,"공부방 · 주식방":40,"상담실 · 회의실":40,
  "작업실":45,"개인 연습실":45,"음악학원 강의실":45,"합주실":50,"댄스 · 짐":50,"대기실 · 공용":50,"기타":45};
function roomBg(r){ return ROOM_BG[r.use] ?? 45; }
function roomId(r){ if(!r.id) r.id="r"+Math.random().toString(36).slice(2,8); return r.id; }
function adjOf(r){ return Array.isArray(r.adj)?r.adj:(r.adj=[]); }
/* 인접 쌍 — 상호 체크된 실끼리. 소리 방향 · 필요 차음량 · 최저 기음 · 칸막이 등급 */
function roomPairs(B, rooms, grades){
  const out=[], pick=f=>{ for(let L=1;L<=5;L++) if(f>=START[L]) return L; return null; };
  rooms.forEach((a,i)=>rooms.forEach((b,j)=>{ if(j<=i) return;
    if(!adjOf(a).includes(roomId(b)) && !adjOf(b).includes(roomId(a))) return;
    const ga=grades[i], gb=grades[j];
    const n1 = ga.spl!==null ? ga.spl-roomBg(b) : null;   // A 소리 → B
    const n2 = gb.spl!==null ? gb.spl-roomBg(a) : null;   // B 소리 → A
    const need = Math.max(n1??-99, n2??-99), dir = (n1??-99)>=(n2??-99) ? [i,j] : [j,i];
    const los=[ga.lo,gb.lo].filter(v=>v!==null&&v!==undefined);
    const lo = los.length?Math.min(...los):null;
    let wL=null, over=false;
    if(lo!==null){ wL=pick(lo); if(wL===null){ wL=5; over=true; } }
    else wL=2;   // 둘 다 조용한 실 — 말소리 프라이버시 기준
    out.push({i,j,need:need>-99?need:null,dir,lo,wL,over});
  }));
  return out;
}
function roomProp(r,B,g){
  g = g || roomGrade(r,B);
  /* 칸막이 — 인접 실이 지정돼 있으면 그 쌍들 중 최고, 없으면 이웃 기준(자기 소리) */
  let wp = g.wL!==null ? g.wL : B.wpL;
  const rooms=D.rooms||[], idx=rooms.indexOf(r);
  if(idx>-1 && adjOf(r).length){
    const grades=rooms.map(x=>x===r?g:roomGrade(x,B));
    const mine=roomPairs(B,rooms,grades).filter(p=>p.i===idx||p.j===idx);
    if(mine.length) wp=Math.max(...mine.map(p=>p.wL));
  }
  return { F:B.fL, WS: g.wL!==null ? g.wL : Math.max(1,B.wL), WP: wp, C:B.cL };
}
function roomActual(r,B,g){
  const p=roomProp(r,B,g), o=r.ov||{}, num=v=>(v===null||v===undefined||v==="")?null:+v;
  return { F:num(o.F)??p.F, WS:num(o.WS)??p.WS, WP:num(o.WP)??p.WP, C:num(o.C)??p.C, prop:p };
}
/* 05·07 공통 — 제안 / 실제 시공 선택 행 */
function ovRow(key,label,pre,propL,actL,minL,ri){
  const sp = SPEC[key][actL], diff = propL!==actL;
  const src = ri!==undefined ? (D.rooms[ri].ov||{}) : D.ov;
  const cur = (src[key]===null||src[key]===undefined||src[key]==="") ? "" : String(src[key]);
  let sel=`<select class="ovsel" data-k="${key}"${ri!==undefined?` data-i="${ri}"`:""}>`;
  sel+=`<option value=""${cur===""?" selected":""}>제안대로</option>`;
  for(let L=minL;L<=5;L++) sel+=`<option value="${L}"${cur===String(L)?" selected":""}>L${L}</option>`;
  sel+=`</select>`;
  return `<tr${diff?' class="hi"':''}><td>${label}</td><td class="m">${pre}-L${propL}</td>
    <td class="m b">${sel}${diff?` <span style="color:var(--stop);font-size:11px">${actL>propL?"상향":"하향"}</span>`:""}</td>
    <td>${sp.n}</td><td class="m">${sp.t}</td></tr>`;
}
/* 실별 등급 — 접수 판정과 같은 규칙 */
function roomGrade(r,B){
  const fmap={}; B.picked.forEach(([n,f])=>fmap[n]=f);
  const picked=r.sounds.filter(n=>fmap[n]).map(n=>[n,fmap[n]]).sort((a,b)=>a[1]-b[1]);
  let hit=false, quiet=false;
  r.sounds.forEach(n=>{ const i=FIND(n); if(!i) return;
    if(i[2]==="hit"||i[2]==="hitq") hit=true; if(i[2]==="quiet"||i[2]==="both") quiet=true; });
  const pick=f=>{ for(let L=1;L<=5;L++) if(f>=START[L]) return L; return null; };
  let lo=null, loName="", wL=null, over=false;
  for(const [n,f] of picked){ if(lo===null){lo=f;loName=n;} const g=pick(f); if(g){ wL=g; break; } over=true; }
  if(wL===null && picked.length){ wL=5; over=true; }
  if(wL===null && quiet) wL=2;
  const spl = r.sounds.length ? Math.max(...r.sounds.map(B.splOf)) : null;
  return { picked, lo, loName, wL, over, hit, quiet, spl, need: spl!==null ? spl-B.bg[0] : null };
}

/* 현장 치수 진단 → 문제·보완책 */
function roomIssues(r,B,dims,g){
  const a=analyzeDims(dims.L,dims.W,dims.H);
  const out=[];
  if(a.square)
    out.push(["정방형 (길이/폭 "+a.lw.toFixed(2)+")",
      "두 축의 모드가 같은 대역에 겹쳐 특정 음이 크게 부푼다. 등급을 올려도 사라지지 않는다.",
      ["칸막이 위치를 옮겨 비율을 벌릴 수 있으면 그것이 1순위 (아래 조정안)",
       "마주 보는 두 벽 중 한쪽만 흡음 — 네 벽 균등 시공 금지",
       "실간 칸막이(AC-WP)라면 한쪽 벽을 5° 이상 기울여 비평행으로",
       "코너 베이스트랩(50K) 4곳 — 모든 모드의 음압 최대점"]]);
  if(a.long)
    out.push(["긴 실 (길이/폭 "+a.lw.toFixed(2)+")",
      "긴 축 방향 플러터 에코와 후벽 반사가 문제. 앞뒤가 멀어 연주자·마이크 위치에 따라 소리가 달라진다.",
      ["후벽 두꺼운 흡음(≥100T 이격) 또는 2D 스카이라인 디퓨저",
       "긴 축 측벽은 비대칭 — 한쪽 흡음·한쪽 확산",
       "가능하면 길이 방향으로 나눠 두 실로 (칸막이 추가)"]]);
  /* 악기 기음 충돌 — 1·2차. 최저 모드보다 낮은 기음은 아래 압력 영역에서 다룬다 */
  const clash=[];
  g.picked.filter(([,f])=>f>=a.f1).forEach(([n,f])=>a.modes.filter(m=>m.n<=2).forEach(m=>{ if(Math.abs(m.f-f)/f<0.12) clash.push([n,f,m]); }));
  if(clash.length)
    out.push(["악기 기음 ↔ 모드 충돌",
      clash.map(([n,f,m])=>`${n} ${f}Hz ↔ ${m.axis} ${m.n}차 ${m.f.toFixed(1)}Hz`).join(" / ")+". 그 음만 웅웅거린다는 지적이 나올 자리.",
      ["음원 위치 — 1차 모드는 벽·코너에서 최대, 실 중앙에서 최소. 해당 축 중앙 근처에 두고 벽 밀착 금지",
       "충돌 주파수 타겟 레조네이터 또는 멤브레인(GIK Scopus·현장 제작) — 코너 우선",
       "높이 축 충돌이면 천장 등급 대안으로 높이를 바꾸는 것이 가장 확실"]]);
  /* 압력 영역 */
  if(g.lo && g.lo < a.f1)
    out.push(["압력 영역 — "+g.loName+" "+g.lo+"Hz < 최저 모드 "+a.f1.toFixed(1)+"Hz",
      "실이 그 파장보다 작다. 모드가 서지 않고 실 전체가 같은 압력으로 채워진다 — 흡음·베이스트랩이 무력한 대역.",
      ["이 대역은 벽 차음(등급)과 음원 방진으로만 대응",
       "베이스트랩은 "+a.f1.toFixed(0)+"Hz 이상 모드 대역용으로 산정",
       "고객에게 '안에서 저역이 뭉치는 느낌'은 실 크기의 한계임을 고지"]]);
  return {a, out};
}


/* ── 실별 룸 모드 — AC 사전 룸모드 계산기와 같은 구성 (숫자 타일 → 판정 → 주파수 자 → 모드 표 + 금지 치수) ── */
function roomCalcHTML(r, i, B, dims, g, ra, rtKey){
  const F=v=>v.toFixed(1), tol=RM_TOL;
  const H0=parseFloat(D.h)||0, hf=FH[ra.F]||0, hc=SPEC.C[ra.C].h||0;
  const h=dims.H, L=dims.L, W=dims.W, V=L*W*h, rt=RT[rtKey][0];
  const fh=171.5/h, fl=171.5/L, fw=171.5/W, fs=2000*Math.sqrt(rt/V);
  const mv=modeVerdict(L,W,h);
  const manualH=!!parseFloat(r.h);
  let s=`<div class="rmc">`;

  s+=`<div class="rmc-h"><span class="n">1</span>방 치수</div>

      <div class="f"><label>천장 구성 <em>${B.apt?"AC-C-"+B.apt.C:"AC-C-L"+ra.C}</em></label><div class="v">${B.apt?SPECM.C[B.apt.C].h:hc}<small>mm</small></div></div>

  /* 2 공진음 */
  s+=`<div class="rmc-h"><span class="n">2</span>이 방의 공진음</div>
    <div class="rmc-sum">
      <div class="k gold"><div class="l">높이 모드 (고정)</div><div class="v">${F(fh)}<small>Hz</small></div><div class="s">실높이가 정하는 값 · 치수로 못 바꿈</div></div>

  let vc="ok", vi="OK", vt=`세 축의 공진음이 서로 떨어져 있습니다. 높이 모드 ${F(fh)}Hz 는 남지만 한 음에 몰리지 않고, ${F(fs)}Hz 위부터는 고르게 들립니다.`;
  if(mv.st==="bad"){ vc="bad"; vi="겹침"; vt=mv.hits.map(x=>`${x.name} ${x.n}차 ${F(x.f)}Hz 가 높이 모드 ${F(x.fx)}Hz 위에 앉습니다`).join(" · ")+". 이 치수는 피하세요."; }
  else if(mv.st==="warn"){ vc="warn"; vi="주의"; vt=`높이 모드와는 안 겹치지만 길이 ${mv.lw[0].a}차와 폭 ${mv.lw[0].b}차가 ${F(mv.lw[0].f)}Hz 에서 겹칩니다. 한쪽 치수를 10% 정도 바꿔 보세요.`; }
  s+=`<div class="rmc-verdict ${vc}"><span class="ic">${vi}</span><span>${vt}</span></div>`;
  /* 주파수 자 */
  const lo=20, hi=400, X=f=>40+820*Math.log10(f/lo)/Math.log10(hi/lo);
  let sv="";
  [fh,fh*2].forEach(f=>{ if(f*(1+tol)>lo&&f*(1-tol)<hi) sv+=`<rect x="${X(f*(1-tol))}" y="22" width="${X(f*(1+tol))-X(f*(1-tol))}" height="86" fill="#F3E7E7" rx="2"/>`; });
  sv+=`<line x1="40" y1="108" x2="860" y2="108" stroke="#0D2B4A" stroke-width="1.4"/>`;
  [20,30,40,50,60,80,100,150,200,300,400].forEach(f=>{ sv+=`<line x1="${X(f)}" y1="104" x2="${X(f)}" y2="112" stroke="#0D2B4A"/><text x="${X(f)}" y="128" text-anchor="middle" font-size="11" fill="#8A93A0">${f}${f===400?" Hz":""}</text>`; });
  if(fs>lo&&fs<hi) sv+=`<line x1="${X(fs)}" y1="14" x2="${X(fs)}" y2="108" stroke="#0D2B4A" stroke-width="1.4" stroke-dasharray="5 4"/><text x="${X(fs)}" y="148" text-anchor="middle" font-size="11" fill="#0D2B4A" font-weight="600">슈뢰더 ${fs.toFixed(0)}Hz</text>`;
  [[fh,"#E3B23C",40,"높이"],[fl,"#0D2B4A",62,"길이"],[fw,"#6B7FA3",84,"폭"]].forEach(([f1,col,y,name])=>{
    sv+=`<text x="34" y="${y+4}" text-anchor="end" font-size="11" fill="#4A5563">${name}</text>`;
    for(let n=1;n<=8;n++){ const f=f1*n; if(f<lo||f>hi) continue; const rr=n===1?7:5-Math.min(n,4)*0.5;

    sv+=`<polygon points="${X(f)-6},6 ${X(f)+6},6 ${X(f)},16" fill="#B3402F"/><text x="${X(f)}" y="${k%2?4:4}" text-anchor="middle" font-size="9.5" fill="#B3402F" font-weight="600" dy="${k%2?-0:-0}"></text>`; });
  s+=`<div class="rmc-ruler"><svg viewBox="0 0 900 162" xmlns="http://www.w3.org/2000/svg">${sv}</svg></div>
    <div class="rmc-legend"><span><i style="background:#E3B23C"></i>높이 모드</span><span><i style="background:#0D2B4A"></i>길이 모드</span><span><i style="background:#6B7FA3"></i>폭 모드</span><span><i style="background:#F3E7E7;border:1px solid #D9B9B5"></i>겹침 판정 폭</span>${g.picked.length?`<span><i style="background:#B3402F;border-radius:0;clip-path:polygon(0 0,100% 0,50% 100%)"></i>배치된 소리 최저음 ${g.picked.slice(0,3).map(x=>x[0]+" "+x[1]).join(" · ")}</span>`:""}<span>세로 점선 = 슈뢰더 (이 위는 고르게 들림)</span></div>`;
  /* 3 모드 표 + 4 금지 치수 */
  let rows="";
  [["길이",L,fl],["폭",W,fw]].forEach(([name,len,f1])=>{
    rows+=`<tr><td class="t">${name}</td><td>${len.toFixed(2)} m</td>`;
    for(let n=1;n<=4;n++){ const f=f1*n; let cls="",tag="";
      [fh,fh*2].forEach((fx,k)=>{ const d=Math.abs(f-fx)/fx; if(d<=tol){cls="bad";tag=`<span class="tag bad">높이 ${k+1}차와 겹침</span>`;} else if(d<=tol*1.6&&!cls){cls="warn";tag=`<span class="tag warn">근접</span>`;} });
      rows+=`<td class="${cls}">${F(f)}${tag}</td>`; }
    rows+=`</tr>`; });
  let ban="";
  for(let n=1;n<=4;n++){ const len=h*n, blo=len*(1-tol), bhi=len*(1+tol), hitL=L>=blo&&L<=bhi, hitW=W>=blo&&W<=bhi;
    ban+=`<div class="${hitL||hitW?"hit":""}"><div class="b">${blo.toFixed(2)} ~ ${bhi.toFixed(2)} m</div><div class="r"><b>${n}차</b> = 높이 × ${n}${hitL?' · <b class="bad">길이 걸림</b>':""}${hitW?' · <b class="bad">폭 걸림</b>':""}</div></div>`; }
  s+=`<div class="rmc-two">
      <div><div class="rmc-h"><span class="n">3</span>모드 표 (1 ~ 4차)</div>

        <p class="rmc-note">붉게 표시된 칸은 높이 모드와 겹치는 배음입니다. 겹친 모드는 서로 보강해서 그 음 하나가 유독 크게 울립니다.</p></div>
      <div><div class="rmc-h"><span class="n">4</span>금지 치수 — 이 높이에서 피할 가로 · 세로</div>

    </div>`;
  /* 아파트형 — 박스빔 스팬 판정 (짧은 변) */
  if(B.apt){
    const sh=Math.min(L,W), lg=Math.max(L,W);
    let cls="ok", txt=`짧은 변 ${sh.toFixed(2)}m — @600 (≤ 2.7m)`;
    if(sh>M_SPAN[450]){ cls="bad"; txt=`짧은 변 ${sh.toFixed(2)}m 이 2.9m를 넘는다 — 박스빔 스팬 한계 초과. 실을 좁히거나 M 시리즈 밖(L 등급) 검토`; }
    else if(sh>M_SPAN[600]){ cls="warn"; txt=`짧은 변 ${sh.toFixed(2)}m — @450 (2.7~2.9m). 보를 짧은 변 방향으로 건다`; }
    s+=`<div class="rmc-h"><span class="n">5</span>아파트형 · 박스빔 스팬</div><div class="rmc-verdict ${cls}"><span class="ic">${cls==="ok"?"OK":cls==="warn"?"@450":"초과"}</span><span>${txt} · 긴 변 ${lg.toFixed(2)}m</span></div>`;
  }
  /* 최소 조정 */
  if(mv.st!=="ok"){
    const fix=nearestOK(L,W,h);
    if(fix.length){
      s+=`<div class="rmc-h"><span class="n">5</span>가장 적게 움직여 OK가 되는 치수 · 높이 고정</div>
        <table class="rmc-t"><thead><tr><th>바꿀 변</th><th>현재</th><th>권장</th><th>이동량</th></tr></thead><tbody>`;
      fix.forEach(f=>s+=`<tr><td class="t">${f.nm}</td><td>${(f.nm==="폭"?W:L).toFixed(2)} m</td><td class="ok">${f.v.toFixed(2)} m</td><td>${(f.d>=0?"+":"")+f.d.toFixed(2)} m</td></tr>`);
      s+=`</tbody></table><p class="rmc-note">칸막이(AC-WP)는 실측 후 위치를 잡으므로 이 단계에서 옮기는 것이 비용이 가장 적다. 두 변 다 걸리면 첫 줄부터 적용하고 다시 본다.</p>`;
    } else s+=`<p class="rmc-note">한 변만 1m 안에서 움직여서는 풀리지 않는다 — 두 변을 같이 조정하거나 실 분할을 다시 본다.</p>`;
  }
  return s+`</div>`;
}

/* 부지 대비 실 면적 — 수량 포함 */
function roomFit(B, rooms, grades){
  if(D.noSize || !parseFloat(D.w) || !parseFloat(D.d)) return null;
  const site=parseFloat(D.w)*parseFloat(D.d);
  const wls=rooms.map((r,i)=>roomActual(r,B,grades[i]).WP).filter(v=>v!==null);
  const wsT=parseInt(SPEC.WS[Math.max(1,B.wL)].t)/1000;
  const wpT=wls.length ? parseInt(SPEC.WP[Math.max(...wls)].t)/1000 : parseInt(SPEC.WP[B.wpL].t)/1000;
  const inner=(parseFloat(D.w)-2*wsT)*(parseFloat(D.d)-2*wsT);
  const n=rooms.reduce((k,r)=>k+roomQty(r),0);
  const sum=rooms.reduce((s,r)=>{ const d=roomDims(r,B); return s+(d?d.L*d.W*roomQty(r):0); },0);
  const part=Math.max(0,n-1)*wpT*Math.min(parseFloat(D.w),parseFloat(D.d));
  return {site,wsT,wpT,inner,sum,avail:inner-part};
}

        h+=`<table class="bt"><tr><th>쌍</th><th>소리 방향</th><th>필요 차음량</th><th>최저 기음</th><th>칸막이</th></tr>`;
        pairs.forEach(p=>{ const a=rooms[p.i], b=rooms[p.j], src=rooms[p.dir[0]], dst=rooms[p.dir[1]];
          h+=`<tr><td class="b">${roomName(p.i)} ↔ ${roomName(p.j)}</td>
            <td>${p.need!==null?`${roomName(p.dir[0])} ${src.use||""} ${grades[p.dir[0]].spl}dB → ${roomName(p.dir[1])} ${dst.use||""} 목표 ${roomBg(dst)}dB`:"둘 다 조용한 실"}</td>
            <td class="m b">${p.need!==null?p.need+" dB":"—"}</td><td class="m">${p.lo!==null?p.lo+" Hz":"—"}</td>
            <td class="m b">AC-WP-L${p.wL}${p.over?' <span style="color:var(--stop)">범위 밖</span>':""}</td></tr>`; });
        h+=`</table>`;
        h+=`<div class="bp">필요 차음량 = 시끄러운 쪽 음압 − 조용한 쪽 <b>용도 목표 배경</b>(녹음실·부스 30 · 컨트롤룸·스트리밍 35 · 연습실 45 · 합주실 50dB). 이웃 기준(${B.bg[0]}dB)보다 낮은 목표를 가진 실이 옆에 오면 그만큼 더 막아야 한다. 등급은 두 실 소리의 최저 기음으로.</div>`;
      } else {
        h+=`<div class="bp" style="color:var(--sub)">맞닿는 실이 지정되지 않았다 — 실 블록의 <b>맞닿는 실</b>에서 체크하면 쌍별로 계산한다. 지금은 실마다 이웃 기준으로 본 등급이며 최고 <b>AC-WP-L${top}</b>.</div>`;
      }
      h+=`<div class="bp">칸막이 하나에 등급이 둘이면 <b>높은 값</b>으로 시공한다. 실별 표의 칸막이 제안 등급은 그 실이 맞닿은 쌍들 중 최고값.</div>`;
      if(grades.some(g=>g.hit))
        h+=`<div class="bp">충격음 실이 있다 — 부유바닥은 <b>실별로 끊어</b> 시공한다. 한 판으로 깔면 진동이 옆 실로 그대로 간다.</div>`;
    }
    if(fit){
      const {site,wsT,wpT,inner,sum,avail}=fit;
      h+=`<div class="bg">부지 적합성</div>`;
      h+=`<table class="bt"><tr><th>항목</th><th>값</th></tr>
        <tr><td>현장 바닥</td><td class="m">${D.w} × ${D.d} = ${site.toFixed(1)} m²</td></tr>
        <tr><td>외벽 AC-WS-L${Math.max(1,B.wL)} 4면 (${(wsT*1000).toFixed(0)}mm) 제외</td><td class="m">${inner.toFixed(1)} m²</td></tr>
        ${nRooms>1?`<tr><td>칸막이 ${nRooms-1}면 (${(wpT*1000).toFixed(0)}mm) 제외 · 개략</td><td class="m">${avail.toFixed(1)} m²</td></tr>`:""}
        <tr><td>실 내부 면적 합 · 실 ${nRooms}개</td><td class="m ${sum>avail?"b":""}">${rooms.map((r,i)=>{ const d=roomDims(r,B); return d?`${roomName(i)}${roomQty(r)>1?"×"+roomQty(r):""} ${(d.L*d.W*roomQty(r)).toFixed(1)}`:null; }).filter(Boolean).join(" + ")||"—"}</td></tr>
        <tr class="${sum>avail?"hi":""}"><td>합계</td><td class="m b">${sum.toFixed(1)} m² ${avail>0?"("+(sum/avail*100).toFixed(0)+"%)":""}</td></tr>
        </table>`;
      if(sum>avail) h+=`<div class="bw"><b>실 합계가 가용 면적을 넘는다.</b> 벽 두께를 빼면 안 들어간다. 실 하나를 줄이거나 등급(두께)을 조정할 것.</div>`;
      else if(avail>0 && sum/avail<0.7 && sum>0) h+=`<div class="bp">가용 면적의 ${(sum/avail*100).toFixed(0)}%만 쓴다. 남는 부분은 복도·대기·사운드락 자리로.</div>`;
    }
  }
  h+=`<div class="rm-foot">
      <button class="rmb" id="rmAdd">+ 실 추가</button>
      <button class="rmb solid" id="rmSave">검토 조정 저장 (등급 · 실별 설계)</button>
      <span class="st" id="rmMsg"></span></div>`;
  h+=`</div>`;
  return h;
}

/* 섹션만 다시 그리고 다시 묶는다 — 검토서 전체를 새로 그리지 않음 */
function repaintRooms(id){
  const sec=document.getElementById("roomsec"); if(!sec) return;
  const B=buildBrief(); if(!B) return;
  const ae=document.activeElement, keep = ae && ae.dataset && ae.dataset.i!==undefined
    ? {cls:[...ae.classList].find(c=>c.startsWith("rm-")), i:ae.dataset.i} : null;
  const tmp=document.createElement("div"); tmp.innerHTML=roomsHTML(B);
  sec.outerHTML=tmp.innerHTML;
  bindRooms(id);
  if(keep){ const el=document.querySelector(`.${keep.cls}[data-i="${keep.i}"]`); if(el && el.tagName==="INPUT") el.focus(); }
}

function repaintBrief(id){
  const pb=document.querySelector(".peek-b"); if(!pb) return;
  const y=window.scrollY;
  pb.innerHTML=briefHTML(); bindReview(id); window.scrollTo(0,y);
}
function bindReview(id){
  window.__briefId=id;
  const sc=document.getElementById("splitChk"); if(sc) sc.onchange=e=>{ D.split=e.target.checked; repaintBrief(id); };
  const ac=document.getElementById("aptChk"); if(ac) ac.onchange=e=>{ D.apt=e.target.checked; repaintBrief(id); };
  const aa=document.getElementById("aptAuto"); if(aa) aa.onclick=e=>{ e.preventDefault(); D.apt=null; repaintBrief(id); };
  document.querySelectorAll(".ovsel:not([data-i]):not(.ovm)").forEach(el=>el.onchange=e=>{
    D.ov[el.dataset.k]= e.target.value===""?null:+e.target.value; repaintBrief(id); });
  document.querySelectorAll(".ovsel.ovm").forEach(el=>el.onchange=e=>{ D.ovm[el.dataset.k]=e.target.value; repaintBrief(id); });
  bindRooms(id);
}
function bindRooms(id){
  const sec=document.getElementById("roomsec"); if(!sec) return;
  const g=x=>document.getElementById(x);
  sec.querySelectorAll(".ovsel[data-i]").forEach(el=>el.onchange=e=>{
    const r=D.rooms[+el.dataset.i]; r.ov=r.ov||{F:null,WS:null,WP:null,C:null};
    r.ov[el.dataset.k]= e.target.value===""?null:+e.target.value; repaintRooms(id); });
  if(g("rmAdd")) g("rmAdd").onclick=()=>{
    if((D.rooms||[]).length>=8){ alert("실은 8개까지."); return; }
    D.rooms.push({id:"r"+Math.random().toString(36).slice(2,8), name:roomName(D.rooms.length), use:"", sounds:[], w:"", d:"", h:"", qty:1, adj:[], ov:{F:null,WS:null,WP:null,C:null}});
    ROOM_OPEN.add(D.rooms.length-1);
    repaintRooms(id);
  };
  sec.querySelectorAll(".rm-del").forEach(b=>b.onclick=()=>{
    if(!confirm("실 "+roomName(+b.dataset.i)+"을 지웁니다.")) return;
    const gone=roomId(D.rooms[+b.dataset.i]);
    D.rooms.splice(+b.dataset.i,1); D.rooms.forEach((r,i)=>{ r.name=roomName(i); r.adj=adjOf(r).filter(x=>x!==gone); }); ROOM_OPEN.clear(); repaintRooms(id);
  });
  sec.querySelectorAll(".rm-use").forEach(b=>b.onclick=()=>{ D.rooms[+b.dataset.i].use=b.dataset.v; repaintRooms(id); });
  sec.querySelectorAll(".rm-snd").forEach(b=>b.onclick=()=>{
    const r=D.rooms[+b.dataset.i], k=r.sounds.indexOf(b.dataset.v);
    k>-1 ? r.sounds.splice(k,1) : r.sounds.push(b.dataset.v); repaintRooms(id);
  });
  const num=(cls,key)=>sec.querySelectorAll(cls).forEach(el=>{
    el.oninput=e=>{ D.rooms[+el.dataset.i][key]=e.target.value; };
    el.onchange=e=>{ const v=parseFloat(e.target.value), r=D.rooms[+el.dataset.i];
      r[key]= isNaN(v)?"":String(Math.round(v*100)/100); e.target.value=r[key];
      if(key!=="h"&&key!=="w"&&key!=="d"){}
      /* 가로·세로가 다 들어왔을 때만 다시 그린다 — 탭으로 넘어가는 중에 화면이 바뀌지 않게 */
      if(key==="h" || (parseFloat(r.w)&&parseFloat(r.d)) || r[key]==="") repaintRooms(id); };
  });
  num(".rm-w","w"); num(".rm-d","d"); num(".rm-h","h");
  /* 높이가 비어 있을 때 화살표를 누르면 자동 높이에서 시작 */
  sec.querySelectorAll(".rm-h").forEach(el=>el.addEventListener("keydown",e=>{
    if((e.key==="ArrowUp"||e.key==="ArrowDown") && el.value===""){ e.preventDefault();
      const base=parseFloat(el.placeholder)||2.4, v=Math.round((base+(e.key==="ArrowUp"?0.05:-0.05))*100)/100;
      el.value=v; D.rooms[+el.dataset.i].h=String(v); repaintRooms(id); } }));
  sec.querySelectorAll(".rm-adj").forEach(b=>b.onclick=()=>{
    const r=D.rooms[+b.dataset.i], o=D.rooms.find(x=>roomId(x)===b.dataset.o); if(!o) return;
    const A=adjOf(r), Bb=adjOf(o), on=A.includes(roomId(o));
    if(on){ A.splice(A.indexOf(roomId(o)),1); const k=Bb.indexOf(roomId(r)); if(k>-1) Bb.splice(k,1); }
    else { A.push(roomId(o)); if(!Bb.includes(roomId(r))) Bb.push(roomId(r)); }
    repaintRooms(id); });
  sec.querySelectorAll(".rm-q").forEach(el=>{ el.onchange=e=>{ const v=parseInt(e.target.value,10); D.rooms[+el.dataset.i].qty=v>0?v:1; repaintRooms(id); }; });
  sec.querySelectorAll(".rm-det").forEach(d=>d.addEventListener("toggle",()=>{ const i=+d.dataset.i; d.open?ROOM_OPEN.add(i):ROOM_OPEN.delete(i); }));
  sec.querySelectorAll(".rm-sub").forEach(d=>d.addEventListener("toggle",()=>{ d.open?ROOM_OPEN.add(d.dataset.k):ROOM_OPEN.delete(d.dataset.k); }));
  /* 세부 설계 요약줄 오른쪽 '모두' 버튼 */
  sec.querySelectorAll(".rm-all").forEach(b=>b.onclick=e=>{ e.preventDefault(); e.stopPropagation();
    const det=b.closest(".rm-det"), subs=det.querySelectorAll(".rm-sub"), anyClosed=[...subs].some(x=>!x.open);
    subs.forEach(x=>{ x.open=anyClosed; anyClosed?ROOM_OPEN.add(x.dataset.k):ROOM_OPEN.delete(x.dataset.k); }); });
  if(g("rmSave")) g("rmSave").onclick=()=>saveRooms(id);
}

async function saveRooms(id){ return saveReview(id, document.getElementById("rmSave")); }
async function saveReview(id, btn){
  const msg=document.getElementById("rmMsg")||{textContent:""}; btn=btn||{};
  const label=btn.textContent;
  if(!id){ if(msg) msg.textContent="접수 저장 후에 실별 설계를 저장할 수 있다."; return; }
  btn.disabled=true; msg.textContent="저장 중…";
  const before=window.__editBefore||{};
  const log=diffLog(before,D);
  let ok=false;
  const Dout=JSON.parse(JSON.stringify(D)); delete Dout.q03;
  try{ const res=await api({action:"update", id, data:Dout, log, pass:ADMIN_PASS}); ok=!!(res&&res.ok); }catch(e){}
  const rec=await STORE.get("req:"+id);
  if(rec){ rec.data=Dout; rec.log=(rec.log?rec.log+"\n":"")+(log||""); await STORE.set("req:"+id,rec); }
  window.__editBefore=JSON.parse(JSON.stringify(Dout));
  btn.disabled=false; if(!document.getElementById("rmMsg")) btn.textContent= ok?"저장됨":"저장 실패"; setTimeout(()=>{ if(btn.textContent!==label && label) btn.textContent=label; },1500);
  msg.textContent = ok ? "저장됨 "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}) : "서버 저장 실패 — 화면에만 반영";
}

      <p class="q-p">귀하의 소중한 프로젝트를 조용한청년들 어쿠스틱랩에 문의해 주셔서 감사합니다. 일단 보내주신 내용으로 어떤 공사가 될지 먼저 판단해 보았습니다.</p>
      <div class="q-key"><div class="q-k1">본 프로젝트에서 가장 핵심적인 마스터키는</div>
        <div class="q-k2 q-ed" data-f="key">"두께가 아니라 구조를 잡아야 합니다"</div>
        <div class="q-k3">간략적인 내용을 첨부해드리며, 자세한 컨설팅을 원하시면 현장에서 뵙고 귀하의 소중한 공간에 기술력과 창작의 힘을 더해서 one &amp; only하게 다듬어가겠습니다.</div>
        <div class="q-k4">조용한청년들 어쿠스틱랩 일동</div></div>
