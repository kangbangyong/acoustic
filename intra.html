<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그리드에이포유 &amp; 조용한 청년들 — INTRA_NET</title>
<style>
:root{
  --ink:#1b2a38; --sub:#6b6a63; --line:#cfcdc4; --hair:#e4e2da;
  --accent:#002945; --fill:#f4f6f8; --paper:#ffffff;
  --gold:#C79A2E; --stop:#a8281b; --stop-bg:#fbeae8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color:var(--ink);background:#edece6;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:22px 18px 50px;display:flex;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:1000px;
  box-shadow:0 2px 18px rgba(0,0,0,.08)}

/* 헤더 */
.hd{padding:20px 44px 0}
.hd-brand{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:8px}
.logo{height:68px;width:auto;display:block;flex:0 0 auto}
@media print{.logo{height:56px}}
.hd-mid{flex:1;min-width:0;text-align:right}
.hd-t{font-size:24px;font-weight:700;letter-spacing:.14em;color:var(--accent);display:block}
.hd-t::after{content:"INTRA_NET · 접수 입력";display:block;font-size:10.5px;
  letter-spacing:.14em;color:var(--sub);font-weight:400;margin-top:6px}
.hd-top{display:flex;justify-content:flex-end;gap:6px}
@media(max-width:820px){
  .logo{height:48px}
  .hd-t{font-size:18px}
  .hd-t::after{font-size:9px}
}
@media(max-width:520px){
  .hd-brand{flex-wrap:wrap;gap:10px}
  .hd-mid{flex-basis:100%;text-align:left}
  .logo{height:44px}
}

.hd hr{border:0;border-top:1.5px solid var(--ink);margin-top:12px}
.adminbtn{background:transparent;color:var(--sub);border:1px solid var(--line);
  font-family:inherit;font-size:9.5px;letter-spacing:.16em;font-weight:700;
  padding:4px 10px;border-radius:3px;cursor:pointer}
.adminbtn:hover{border-color:var(--accent);color:var(--accent)}

/* 접수 바 */
.intake{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;margin:14px 44px 0;
  padding:10px 12px;background:var(--fill);border:1px solid var(--line)}
.intake .grp{display:flex;align-items:flex-end;gap:6px}
.intake .il{font-size:10px;letter-spacing:.1em;color:var(--sub);padding-bottom:5px;white-space:nowrap}
.intake input{font-family:inherit;font-size:13px;color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid var(--line);padding:4px 2px}
.intake input:focus{outline:none;border-bottom:1.5px solid var(--accent)}
.intake input::placeholder{color:#b6b4ab}
.intake .w1{width:96px} .intake .w2{width:80px} .intake .w3{width:132px}
.intake .div{flex:1;min-width:6px}

/* 본문 */
.body{padding:18px 44px 10px}
.sec{border-top:1px solid var(--hair);padding:14px 0 6px}
.sec:first-child{border-top:0}
.sh{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.sn{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
  border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;flex:0 0 19px}
.st{font-size:15px;font-weight:700;letter-spacing:-.01em}
.ss{font-size:11.5px;color:var(--sub);margin-left:auto}

.grid2{display:block}

.lb{font-size:10px;letter-spacing:.1em;color:var(--sub);margin:12px 0 6px;
  padding-bottom:3px;border-bottom:1px solid var(--hair)}
.lb:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#fff;border:1px solid var(--line);border-radius:4px;
  padding:6px 11px;font-size:12.5px;cursor:pointer;transition:.1s;font-family:inherit;color:inherit}
.chip:hover{border-color:var(--sub)}
.chip.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:700}

.txt{font-family:inherit;font-size:13px;color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid var(--line);padding:5px 2px}
.txt:focus{outline:none;border-bottom:1.5px solid var(--accent)}
.txt::placeholder{color:#b6b4ab}
.row{display:flex;align-items:flex-end;gap:7px;flex-wrap:wrap;margin-top:4px}
.il2{font-size:10px;letter-spacing:.1em;color:var(--sub);padding-bottom:6px;
  width:56px;flex:0 0 56px;white-space:nowrap}
.gap{width:22px;flex:0 0 22px}
.row .chips{padding-bottom:1px}
.txt:disabled{opacity:.35}
.row i{font-style:normal;color:var(--sub);font-size:11.5px;padding-bottom:5px}
.row b{font-weight:400;color:var(--sub);padding-bottom:4px}
.w-num{width:74px;text-align:center}
.w-gu{width:150px}
.w-bud{width:110px;text-align:center}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--sub);
  padding-bottom:3px}
.chk .bx{width:14px;height:14px;border:1px solid var(--line);border-radius:3px;background:#fff;
  display:grid;place-items:center}
.chk.on{color:var(--accent);font-weight:700}
.chk.on .bx{border-color:var(--accent);background:var(--accent)}
.chk.on .bx::after{content:"";width:6px;height:6px;background:#fff;border-radius:1px}

.hint{margin-top:9px;background:var(--fill);border-left:2px solid var(--accent);
  padding:9px 12px;font-size:11.5px;line-height:1.55;color:#33475a}
.hint b{color:var(--accent);font-weight:700}
.alert{margin-top:9px;border-left:2px solid var(--stop);background:var(--stop-bg);
  padding:9px 12px;font-size:12px;line-height:1.55;color:#7a2016}
.alert b{font-weight:700;color:var(--stop)}
.drop{margin-top:6px;border:1px dashed var(--line);background:#fbfaf7;padding:14px;
  text-align:center;cursor:pointer;transition:.12s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--fill)}
.drop .t{font-size:13px;font-weight:700;color:var(--accent)}
.drop .s{font-size:11.5px;color:var(--sub);margin-top:4px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.th{position:relative;width:96px}
.th img{width:96px;height:72px;object-fit:cover;border:1px solid var(--line);display:block}
.th .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
  border:1px solid var(--line);background:#fff;color:var(--sub);font-size:12px;line-height:1;
  cursor:pointer;padding:0}
.th .x:hover{border-color:var(--stop);color:var(--stop)}
.th .n{font-size:10px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.notice{margin-top:12px;padding:10px 12px;background:#FBF6E8;border-left:2px solid var(--gold);
  font-size:12px;line-height:1.6;color:#6b5518;font-style:italic}
.notice b{font-style:normal;font-weight:700;color:#8a6a12}

.foot{padding:16px 44px 28px;display:flex;gap:9px;align-items:center;
  border-top:1px solid var(--hair);margin-top:8px}
.msg{font-size:12px;color:var(--stop);flex:1}
.btn{font-family:inherit;font-size:14px;font-weight:700;padding:12px 30px;
  border-radius:4px;border:1px solid var(--accent);cursor:pointer;letter-spacing:.04em}
.btn.go{background:var(--accent);color:#fff}
.btn.go:hover{background:#013a5f}
.btn.go:disabled{background:#c9c7be;border-color:#c9c7be;cursor:not-allowed}
.btn.gh{background:transparent;color:var(--sub);border-color:var(--line);padding:12px 18px}

/* 완료 */
.done{padding:36px 44px}
.done-i{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:19px;margin-bottom:14px}
.done h2{font-size:19px;font-weight:700}
.done p{font-size:13px;color:var(--sub);margin-top:6px}
.idbox{margin-top:18px;border:1px solid var(--accent);background:var(--fill);padding:15px;text-align:center}
.idbox .l{font-size:9.5px;letter-spacing:.18em;color:var(--sub)}
.idbox .no{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:.1em;margin-top:4px}
.idbox .sm{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6}
.card{margin-top:18px;border:1px solid var(--line)}
.card-h{font-size:10px;letter-spacing:.14em;color:var(--sub);padding:9px 13px;
  border-bottom:1px solid var(--line);background:var(--fill)}
.crow{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:8px 13px;
  border-bottom:1px dashed var(--hair);font-size:12.5px}
.crow:last-child{border-bottom:0}
.crow .k{color:var(--sub);font-size:11.5px}
.crow .v{font-weight:700}
.restart{margin-top:16px;width:100%;background:transparent;border:1px solid var(--line);
  padding:11px;font-family:inherit;font-size:13px;color:var(--sub);cursor:pointer}

/* 관리자 */
body.admin .sheet{max-width:1080px}
.brow{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:14px;
  background:#fff;border:1px solid var(--line);padding:10px 13px;margin-bottom:6px;font-size:13px}
.brow .id{font-weight:700;letter-spacing:.03em;white-space:nowrap}
.brow .stf{font-weight:700;color:var(--accent);white-space:nowrap;
  padding:2px 9px;background:var(--fill);border-radius:3px;font-size:12.5px}
@media(max-width:820px){
  .brow{grid-template-columns:1fr auto;gap:6px 10px}
  .brow .stf{justify-self:start}
  .brow .mt{grid-column:1/-1}
}
.brow .mt{color:var(--sub);font-size:11.5px}
.brow .stt{font-size:11px;font-weight:700;padding:4px 10px;border-radius:3px;border:1px solid;
  white-space:nowrap}
.brow .st-new{color:#6b6a63;border-color:var(--line);background:#f6f5f1}
.brow .st-booth{color:#5b3a86;border-color:#d7c9ea;background:#f1ebf9}
.brow .st-drop{color:#7a7770;border-color:#d5d3cb;background:#e9e8e2}
.brow .st-call{color:#0b4f7a;border-color:#bcd6e8;background:#e9f2f9}
.brow .st-go{color:#8a5a05;border-color:#ecd9ab;background:#faf0d8}
.brow .st-done{color:#0c5a3c;border-color:#bfe0d0;background:#e8f5ee}
.brow .st-fin{color:#fff;border-color:var(--accent);background:var(--accent)}
.brow .st-hold{color:#a8281b;border-color:#eecbc6;background:#fbeae8}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.legend .lg{font-size:11px;font-weight:700;padding:5px 11px;border-radius:3px;
  border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;transition:.1s}
.legend .lg:hover{border-color:var(--accent)}
.legend .lg.on{outline:2px solid var(--accent);outline-offset:1px}
.bhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.bhead h3{font-size:16px;font-weight:700}
.bhead .c{font-size:12px;color:var(--sub)}
.abar{background:var(--fill);border-bottom:1px solid var(--line);padding:10px 14px;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:0;z-index:30}
.abar .l{font-size:10px;letter-spacing:.1em;color:var(--sub);margin-right:2px}
.abar input{font-family:inherit;font-size:13px;background:#fff;
  border:1px solid var(--line);border-radius:3px;padding:7px 9px}
.abar input:focus{outline:none;border-color:var(--accent)}
.abar .w1{width:120px} .abar .w2{width:76px} .abar .w3{width:112px}
.abar button{font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 12px;
  border-radius:3px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
.abar button:hover{background:var(--accent);color:#fff}
.abar button.solid{background:var(--accent);color:#fff}
.abar button.ghost{border-color:var(--line);color:var(--sub)}
.abar button.ghost:hover{border-color:var(--accent);color:var(--accent);background:#fff}
.abar .sep{width:1px;height:19px;background:var(--line);margin:0 3px}
.reqrow{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line);padding:10px 12px;margin-bottom:6px;
  cursor:pointer;font-size:13px}
.reqrow .id{font-weight:700;letter-spacing:.05em}
.reqrow .mt{color:var(--sub);font-size:11.5px}
.reqrow .stt{font-size:11px;font-weight:700;padding:4px 9px;border-radius:3px;border:1px solid;
  font-family:inherit;cursor:pointer;background:#fff;white-space:nowrap}
.reqrow .st-booth{color:#5b3a86;border-color:#d7c9ea;background:#f1ebf9}
.reqrow .st-drop{color:#7a7770;border-color:#d5d3cb;background:#e9e8e2}
.reqrow .st-call{color:#0b4f7a;border-color:#bcd6e8;background:#e9f2f9}
.reqrow .st-booth{color:#5b3a86;border-color:#d7c9ea;background:#f1ebf9}
.reqrow .st-drop{color:#7a7770;border-color:#d5d3cb;background:#e9e8e2}
.reqrow .st-booth{color:#5b3a86;border-color:#d7c9ea;background:#f1ebf9}
.st-drop{color:#7a7770;border-color:#d5d3cb;background:#e9e8e2}
.st-call{color:#0b4f7a;border-color:#bcd6e8;background:#e9f2f9}
.st-new{color:#6b6a63;border-color:var(--line);background:#f6f5f1}
.reqrow .st-go{color:#8a5a05;border-color:#ecd9ab;background:#faf0d8}
.reqrow .st-done{color:#0c5a3c;border-color:#bfe0d0;background:#e8f5ee}
.reqrow .st-fin{color:#fff;border-color:var(--accent);background:var(--accent)}
.reqrow .st-hold{color:#a8281b;border-color:#eecbc6;background:var(--stop-bg)}
.reqrow .del{border:1px solid var(--line);background:#fff;color:#b6b4ab;width:26px;height:26px;
  border-radius:3px;cursor:pointer;font-size:14px;line-height:1;padding:0}
.reqrow .del:hover{border-color:var(--stop);color:var(--stop);background:var(--stop-bg)}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;
  font-size:12.5px;color:var(--sub)}
.pager button{font-family:inherit;font-size:12.5px;padding:6px 12px;border:1px solid var(--line);
  background:#fff;border-radius:3px;cursor:pointer}
.pager button:disabled{color:#c9c7be;cursor:not-allowed}
.sub{font-size:10.5px;letter-spacing:.1em;color:var(--sub);margin:14px 0 8px}
.logbox{margin-top:14px;border:1px solid var(--line);background:var(--fill);padding:11px 14px}
.logh{font-size:10px;letter-spacing:.14em;color:var(--sub);font-weight:700;margin-bottom:6px}
.logl{font-size:12px;line-height:1.6;color:#33475a;padding:3px 0;border-bottom:1px dashed var(--hair)}
.logl:last-child{border-bottom:0}
.flink{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none}
.flink:hover{text-decoration:underline}
.peek{margin-top:14px;border:1px solid var(--line)}
.peek-b{padding:14px 16px;font-size:13px;line-height:1.6}
.bsec{border-top:1px solid var(--hair);padding:14px 0 4px}
.bsec:first-child{border-top:0;padding-top:2px}
.bh{font-size:10.5px;letter-spacing:.14em;color:var(--accent);font-weight:700;margin-bottom:9px}
.bp{font-size:12.5px;line-height:1.6;margin:7px 0}
.bw{font-size:12.5px;line-height:1.6;background:var(--stop-bg);border-left:2px solid var(--stop);
  color:#7a2016;padding:10px 12px;margin:8px 0}
.bt{width:100%;border-collapse:collapse;font-size:12px;margin:7px 0}
.bt th{background:var(--fill);color:var(--sub);font-size:9.5px;letter-spacing:.08em;
  padding:6px 9px;text-align:left;font-weight:700;border-bottom:1px solid var(--line)}
.bt td{padding:7px 9px;border-bottom:1px dashed var(--hair)}
.bt td.b{font-weight:700;color:var(--accent)}
.bt tr.hi td{background:#fdf8ec;font-weight:700}
.bg{font-size:9.5px;letter-spacing:.1em;color:var(--sub);margin:12px 0 4px}
.bl{font-size:12px;line-height:1.55;padding:5px 0 5px 13px;position:relative;
  border-bottom:1px dashed var(--hair)}
.bl::before{content:"—";position:absolute;left:0;color:var(--line)}
.bl.ck::before{content:"☐"}

/* 실별 설계 */
.rm{border:1px solid var(--line);margin:10px 0;background:#fff}
.rm-h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--fill);border-bottom:1px solid var(--line)}
.rm-h .nm{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.rm-h .use{font-size:12px;color:var(--sub)}
.rm-h .x{margin-left:auto;border:1px solid var(--line);background:#fff;color:#b6b4ab;width:24px;height:24px;
  border-radius:3px;cursor:pointer;font-size:13px;line-height:1;padding:0}
.rm-h .x:hover{border-color:var(--stop);color:var(--stop)}
.rm-b{padding:8px 12px 10px}
.rm .lb{display:block;margin-top:9px}
.rm .chip{padding:5px 9px;font-size:12px}
.rm .row{margin-top:2px}
.rm .txt.w-num{width:64px}
.rmb{font-family:inherit;font-size:12px;font-weight:700;padding:7px 14px;border-radius:3px;
  border:1px dashed var(--accent);background:#fff;color:var(--accent);cursor:pointer}
.rmb:hover{background:var(--fill)}
.rmb.solid{border-style:solid;background:var(--accent);color:#fff}
.rmb:disabled{opacity:.5;cursor:wait}
.rm-foot{display:flex;gap:8px;align-items:center;margin-top:10px}
.rm-foot .st{font-size:11.5px;color:var(--sub);margin-left:auto}
.bt td .dim{color:var(--sub);font-size:11px}
@media print{
  .rm .chips .chip:not(.on),.rmb,.rm-h .x,.rm-foot .st{display:none !important}
  .rm .chip.on{background:transparent;color:var(--ink);border-color:var(--ink)}
  .rm .txt{border:0}
  .rm{page-break-inside:avoid}
}

@media(max-width:820px){
  body{padding:0}
  .sheet{box-shadow:none}
  .hd{padding:18px 20px 0} .intake{margin:12px 20px 0}
  .body{padding:16px 20px 8px} .foot{padding:14px 20px 22px} .done{padding:28px 20px}
  .il2{width:auto;flex:0 0 auto}
}
@media print{
  @page{size:A4;margin:11mm 12mm}
  .abar,.hd,.intake,.foot,.restart{display:none !important}
  body{background:#fff;padding:0;font-size:9pt}
  .sheet{box-shadow:none;max-width:none}
  .body,.done{padding:0}
  .bp,.bl{font-size:8.5pt} .bt{font-size:8.2pt}
  .bsec,.bt,.bw{page-break-inside:avoid}
}
</style>
</head>
<body>
<div class="sheet" id="sheet">

  <div class="hd">
    <div class="hd-top">
      <button id="boardBtn" class="adminbtn">처리현황</button>
      <button id="adminBtn" class="adminbtn">ADMIN</button>

async function api(payload){
  if(!ENDPOINT) return null;
  const r = await fetch(ENDPOINT, {
    method:"POST",
    redirect:"follow",
    headers:{"Content-Type":"text/plain;charset=utf-8"},  // 사전요청 회피
    body: JSON.stringify(payload)
  });
  return await r.json();
}

  async get(k){
    try{ if(window.storage){ const r=await window.storage.get(k); return r? JSON.parse(r.value):null; } }catch(e){ return MEM[k]||null; }
    return MEM[k]||null;
  }
};
function newId(idx){
  const yy = String(new Date().getFullYear()).slice(2);      // 26
  const pre = "AC" + yy + "-";                                // AC26-
  const nums = idx.filter(x=>x.id.startsWith(pre))
                  .map(x=>parseInt(x.id.slice(pre.length),10))
                  .filter(n=>!isNaN(n));
  const next = nums.length ? Math.max(...nums)+1 : 1001;      // 그 해 1001부터
  return pre + next;
}

function newId(idx){
  const yy = String(new Date().getFullYear()).slice(2);
  const pre = "조용한청년들-AC" + yy + "-";
  const nums = idx.filter(x=>String(x.id).startsWith(pre))
                  .map(x=>parseInt(String(x.id).slice(pre.length),10))
                  .filter(n=>!isNaN(n));
  const next = nums.length ? Math.max(...nums)+1 : 1;
  return pre + String(next).padStart(4,"0");
}

function buildBrief(){
  if(D.space==="흡음") return null;

  /* ── 1. 대상 주파수 ── */
  let lo=9999, loName="", hit=false, loud=[], quiet=[], both=false, inbound=false;
  const picked=[];
  D.sounds.forEach(n=>{
    const i=FIND(n); if(!i) return;
    if(i[2]==="hit"||i[2]==="hitq") hit=true;
    if(i[2]==="loud") loud.push(n);
    if(i[2]==="quiet") quiet.push(n);
    if(i[2]==="both"){ quiet.push(n); both=true; }
    if(i[2]==="in") inbound=true;
    if(i[1]>0){ picked.push([n,i[1]]); if(i[1]<lo){ lo=i[1]; loName=n; } }
  });
  /* 전자 드럼 — 합주·학원은 스피커 모니터가 전제이므로 어쿠스틱에 준해 잡는다 */
  const SPK_SPACE = ["합주실","음악학원","홈시어터","댄스 · 짐"];
  let eDrumSpk = false;
  if(D.sounds.includes("드럼 (전자)")){
    const withSpk = D.sounds.some(n=>["모니터 스피커","서브우퍼","홈시어터"].includes(n));
    if(SPK_SPACE.includes(D.space) || withSpk){
      eDrumSpk = true;
      for(const it of picked) if(it[0]==="드럼 (전자)") it[1] = 50;
    }
  }
  /* 전자 드럼 + 서브우퍼 조합이면 전자 드럼을 40Hz로 본다 */
  let subLow = false;
  if(D.sounds.includes("드럼 (전자)") && D.sounds.includes("서브우퍼")){
    subLow = true;
    for(const it of picked) if(it[0]==="드럼 (전자)") it[1] = 40;
  }

  picked.sort((a,b)=>a[1]-b[1]);
  if(picked.length){ lo = picked[0][1]; loName = picked[0][0]; }
  const quietOnly = quiet.length && lo===9999;

  /* 음원 음압 추정 */
  const QUIETSET = ["공부","주식 매매","화상회의","명상 · 요가","수면"];
  const AMPSET = ["일렉기타 앰프","베이스 앰프","모니터 스피커","서브우퍼","홈시어터"];
  const TALKSET = ["강의 · 회의"];
  function splOf(n){
    if(QUIETSET.includes(n)||TALKSET.includes(n)) return SPLTAB.quiet;
    const i=FIND(n); if(!i) return SPLTAB.normal;
    if(i[2]==="hit") return SPLTAB.hit;
    if(i[2]==="hitq"){
      const spk = ["합주실","음악학원","홈시어터","댄스 · 짐"].includes(D.space)
        || D.sounds.some(x=>["모니터 스피커","서브우퍼","홈시어터"].includes(x));
      return spk ? 110 : SPLTAB.hitq;
    }
    if(i[2]==="loud"||AMPSET.includes(n)) return SPLTAB.loud;
    return SPLTAB.normal;
  }
  let B_SPL = null;
  if(D.sounds.length) B_SPL = Math.max(...D.sounds.map(splOf));

  /* ── 2. 목표 f₀ ── */
  const f0 = lo<9999 ? (lo/1.414) : null;

  /* ── 3. 등급 산정 ── */
  /* 최저 기음이 각 등급의 "막히기 시작" 주파수 이상인지로 판정 */
  let base, overLimit=false, noneOK=false, target=lo, targetName=loName, skipped=[];
  if(quietOnly){ base = 2; }
  else {
    const pick = f => { for(let L=1;L<=5;L++) if(f >= START[L]) return L; return null; };
    base = pick(lo);
    if(base===null){
      /* 최저 기음이 L5로도 안 잡힘 → 다음 소리로 타겟 하향 */
      overLimit = true;
      for(const [n,f] of picked){
        const L = pick(f);
        if(L===null){ skipped.push([n,f]); continue; }
        base = L; target = f; targetName = n; break;
      }
      if(base===null){ base = 5; noneOK = true; }
    }
  }

  let fL = base, cL = base, wL = base;
  /* 바닥은 층 위치와 무관하게 유지 — 고체전달음은 위·옆으로도 돈다 */
  if(hit) fL = Math.min(5, base+1);
  if(D.floor==="최상층" || D.floor==="건물 전체") cL = Math.max(0, cL-2);

  /* 천장고 제약 — 잔여 2.1m 확보 */
  const H = (!D.noH && parseFloat(D.h)) ? parseFloat(D.h)*1000 : null;
  let capped=false, rest=null;
  if(H){
    while(cL>0){
      rest = H - SPEC.C[cL].h - FH[fL];
      if(rest >= 2100) break;
      cL--; capped=true;
    }
    rest = H - SPEC.C[cL].h - FH[fL];
  }

  /* ── 4. 룸 모드 ── */
  let modes=null, clash=[], cube=false;
  if(!D.noSize && parseFloat(D.w) && parseFloat(D.d)){
    const L=Math.max(parseFloat(D.w),parseFloat(D.d)),
          W=Math.min(parseFloat(D.w),parseFloat(D.d)),
          Hm=(H? (rest||H)/1000 : parseFloat(D.h)||2.4);
    modes=[["길이 "+L+"m", 171.5/L],["폭 "+W+"m", 171.5/W],["높이 "+Hm.toFixed(2)+"m", 171.5/Hm]];
    const r=L/W;
    if(r<1.15) cube=true;
    picked.forEach(([n,f])=>{
      modes.forEach(m=>{ if(Math.abs(m[1]-f)/f < 0.12) clash.push([n,f,m[0],m[1]]); });
    });
  }

  /* ── 4-b. 사용 시간대 · 목표 배경소음 ── */
  const BG = {
    "낮에만 · 오후 6시까지":[45,40,"생활소음이 깔려 있어 여유가 큼"],
    "저녁까지 · 밤 10시까지":[40,35,"저녁은 배경소음이 낮아지기 시작"],
    "밤늦게도 · 10시 이후":[30,25,"배경소음이 사라져 저역이 그대로 드러남"],
    "정해지지 않음":[30,25,"최악 조건(심야)으로 잡아둠"]
  };
  const sensitive = (D.bldg==="아파트"||D.bldg==="빌라 · 다세대") && D.floor==="중간층";
  const raw = BG[D.when] || [30,25,"—"];
  const bg = [sensitive?raw[1]:raw[0], raw[2], sensitive];
  let need = null;
  if(B_SPL) need = B_SPL - bg[0];

  /* ── 5. 시공 주의 ── */
  const care=[];
  care.push(["공통","외벽(구조벽에 접한 벽)은 원 슬래브에 직접 세운다. 부유바닥 위에 올리거나 하부에 방진패드를 넣지 않는다."]);
  care.push(["공통","내벽은 부유바닥 위에 세우고, 부유 슬래브 단부는 공기층 안에서 끝낸다. 슬래브 단부를 복도로 노출하지 않는다."]);
  care.push(["공통","모든 러너는 실런트 베드(Ecoseal 805) 위에 고정한다. 방진패드나 경질재로 대체하지 않는다 — 질량 결합이 끊겨 중역 공진이 증폭된다."]);
  care.push(["공통","삼중 구성 금지. 판을 한 겹 더 띄우면 저역에서 오히려 나빠진다."]);
  if(wL>=3) care.push(["벽","그린글루 제진층 적용(L3부터). 도포 후 15분 내 압착."]);
  if(wL>=1) care.push(["벽","돌차음판 4T는 구조체 면에 전 등급 적용. L5는 마감판 사이에 한 겹 더."]);
  care.push(["벽","이격·열간분리 최대 50mm, 미네랄울 충진 최대 100T(50K). 미네랄울은 구조체 쪽에 밀착하고 마감판 뒷면과 닿지 않게 한다."]);
  care.push(["벽","하지는 바닥에서 눕혀 짜고 세워 고정. 스태거드 스터드는 눕혀 짜기가 불가해 표준에서 제외."]);
  care.push(["벽","WS 배선은 관이 구조체와 각재를 동시에 접촉하지 않게 한다. WP 배선은 반드시 한쪽 열에만 — 열간 분리 구간 횡단은 이중벽을 무효로 만든다."]);
  if(cL>=2) care.push(["천장","천장 장선은 개별 설치. 2×4 표준이며 2×6은 하중 때문에 제외. 장스팬은 제작 박스빔."]);
  if(cL>=4) care.push(["천장","상부 천장에 방진행거, 이격 50mm 확보. 하부는 박스빔 140mm."]);
  care.push(["천장","드레인은 응축수 펌프 방식으로 한다."]);
  if(hit) care.push(["바닥","충격음 대응이 우선. 방진고무는 점 지지(십자형)로 면압을 확보한다 — 판재를 전면에 깔면 눌리지 않아 f₀가 올라간다."]);
  care.push(["바닥","이중벽 공기층은 최소 100mm. 내부는 비워두고 단열은 각 벽 스터드 안에만 넣는다."]);

  /* ── 6. 확인 필요 ── */
  const ask=[];
  ask.push("맞닿은 면 — 위·아래·옆 몇 면인지 (시공 면 = 물량 결정)");
  ask.push("철거 가능 여부 — 임차면 원상복구 범위");
  ask.push("개구부 — 문·창·에어컨·환기·덕트 (실제 성능 상한을 결정)");
  ask.push("사용 시간대 — 심야 포함 여부");
  if(D.sounds.includes("드럼 (전자)")) ask.push("전자 드럼 모니터 방식 — 헤드폰인지 스피커인지");
  if(capped) ask.push("천장고 조정 의사 — 잔여 "+(rest/1000).toFixed(2)+"m 수용 가능한지");
  if(overLimit) ask.push("저역 목표 합의 — AC-B(박스인박스) 전환 여부와 예산");
  if(D.bldg==="아파트") ask.push("관리규약상 바닥 구조 변경 허용 여부");
  if(D.ct!=="계약 완료") ask.push("계약 조건 — 원상복구 범위·구조 변경 허용 조항");
  if(D.noSize) ask.push("실측 — 치수 미기재");
  if(D.soundEtc) ask.push("직접 입력 악기 대역 확인: "+D.soundEtc);

  /* ── 실내 음향 ── */
  let ac=null;
  if(!D.noSize && parseFloat(D.w) && parseFloat(D.d)){
    const W=parseFloat(D.w), Dp=parseFloat(D.d),
          Hi=(H? (rest||H)/1000 : (parseFloat(D.h)||2.4));
    const V = W*Dp*Hi;
    const S = 2*(W*Dp + W*Hi + Dp*Hi);
    const key = RT[D.space] ? D.space : "기타";
    const tgt = RT[key][0], why = RT[key][1];
    const a0 = 0.06;                    // 석고 마감 평균 흡음률
    const A0 = a0*S;
    const rtNow = 0.161*V/A0;           // 마감만 했을 때
    const Areq = 0.161*V/tgt;
    const dA = Areq - A0;
    const aAbs = 0.85;                  // 흡음 마감 평균
    const need = dA>0 ? dA/(aAbs-a0) : 0;
    ac = {V,S,Hi,tgt,why,rtNow,Areq,A0,need, pct: need/S*100};
  }

  return {lo,loName,f0,picked,hit,loud,quiet,both,inbound,quietOnly,overLimit,
          fL,wL,cL,capped,rest,H,modes,clash,cube,care,ask,ac,bg,need,B_SPL,
          target,targetName,skipped,noneOK,eDrumSpk,subLow,splOf};
}

function grade(){
  if(D.space==="흡음") return {g:"AC-AB 흡음 상담", note:["차음 등급 산정 대상 아님"]};
  let lo=9999, loName="", hit=false, loud=[], inbound=false, quiet=[], both=false;
  D.sounds.forEach(n=>{
    const i=FIND(n); if(!i) return;
    if(i[2]==="hit"||i[2]==="hitq") hit=true;
    if(i[2]==="loud") loud.push(n);
    if(i[2]==="in") inbound=true;
    if(i[2]==="quiet") quiet.push(n);
    if(i[2]==="both"){ quiet.push(n); both=true; }
    if(i[1]>0 && i[1]<lo){ lo=i[1]; loName=n; }
  });
  let g="—";
  if(lo<9999){
    g = lo<=35 ? "L5 초과 — AC-B 검토" : lo<=50 ? "L4" : lo<=80 ? "L3"
      : lo<=150 ? "L2" : "L1 ~ L2";
  } else if(quiet.length) g = "유입 차단형 — 소음원 확인 후 결정";
  else if(hit) g = "충격음 전용 — 바닥 중심";
  const n=[];
  if(quiet.length) n.push(`<b>${quiet.join(", ")}</b> — 내보낼 소리가 없는 실. 등급은 <b>무엇을 막느냐</b>로 정한다. 2단계에서 방해 소음원 확인 (윗집 발소리 / 도로 / 옆방 / 설비 / 복도)`);
  if(both) n.push("<b>화상회의 — 양방향</b>. 들어오는 소음뿐 아니라 통화 음성·스피커 소리가 나가는 것도 잡아야 함");
  if(lo<9999) n.push(`최저 기음 <b>${lo}Hz</b> (${loName}) 기준`);
  if(lo<=35) n.push("<b>AC-A 한계 초과</b> — 박스인박스(AC-B) 검토 필요");
  if(inbound) n.push("<b>유입 차단 중심 현장</b> — 마이크에 잡히는 외부 소음이 실제 문제일 가능성. 벽 등급보다 창호 · 환기구 · 기밀이 관건. 목표 배경소음(NC) 확인");
  if(hit) n.push("충격음 동반 — 바닥 등급 우선");
  if(loud.length) n.push(`음압 큼 (${loud.join(", ")}) — 벽 질량 · 기밀 강화`);
  if(D.sounds.some(x=>x.startsWith("피아노"))) n.push("피아노 — 실사용 하한 60Hz로 봄. 연주 장르 확인");
  if(!D.noH && parseFloat(D.h)){
    const hv=parseFloat(D.h);
    if(hv<=2.5) n.push(`천장고 <b>${hv}m</b> — 상급 천장(365mm+) 적용 시 잔여 ${(hv-0.4).toFixed(2)}m. <b>천장 등급 상한 걸림</b>`);
    else if(hv<=2.8) n.push(`천장고 <b>${hv}m</b> — 중급까지 여유. 상급 적용 시 잔여 ${(hv-0.4).toFixed(2)}m`);
    else n.push(`천장고 <b>${hv}m</b> — 등급 제약 없음`);
  } else n.push("천장고 미기재 — 실측 선행");
  if(D.bldg==="아파트") n.push("아파트 — 관리규약상 바닥 구조 변경 가능 여부 확인");
  if(D.floor==="중간층") n.push("중간층 — 바닥·천장 모두 필요");
  if(D.floor==="1층 · 필로티 위") n.push("아래 세대 없음 — 바닥 등급 완화 가능");
  if(D.floor==="최상층") n.push("위 세대 없음 — 천장 등급 완화 가능");
  if(D.space==="공부방 · 주식방" || D.space==="작업실")
    n.push("가정 내 실 — 인접면 중 자가 공간 비율 확인. 그만큼 등급 완화 여지");
  if(D.space==="독서실 · 스터디카페" || D.space==="음악학원" || D.space==="상담실 · 회의실" || D.space==="여러 방을 나누는 공사")
    n.push("다실 구성 — 실간 칸막이(AC-WP) 중심 · 다중이용업소 마감재 규정 확인");
  if(D.sido==="그 밖의 지역") n.push(`<b>수도권 외 — ${D.gu}</b>. 출장 조건 · 숙식 · 자재 운송비 반영 여부 판단 후 회신`);
  if(D.ct==="계약 전") n.push("<b>계약 전</b> — 공간 미확정. 실측 불가하나 <b>계약 전 조건 검토가 가장 값어치 있는 개입 시점</b>. 층고 · 구조 변경 가능 여부 · 인접 용도 확인 권고");
  if(D.ct==="계약 예정") n.push("계약 예정 — 계약서에 원상복구 범위 · 구조 변경 허용 여부를 넣도록 조언");
  if(D.ct==="계약 완료") n.push("계약 완료 — 즉시 실측 가능");
  if(D.pt==="1개월 이내") n.push("<b>1개월 이내</b> — 공기가 등급보다 우선. 달성 가능 등급 하향 고지 필요");
  if(D.bTBD) n.push("예산 미제시 — 등급별 안 2~3개로 제시");
  if(D.noSize) n.push("치수 미기재 — 실측 선행");
  if(D.soundEtc) n.push(`직접 입력: ${D.soundEtc} — 대역 확인 필요`);
  if(!n.length) n.push("특이사항 없음");
  return {g, note:n};
}

function briefHTML(){
  const B=buildBrief();
  if(!B) return `<div class="bsec"><div class="bh">판정</div>
    <div class="bp">흡음 단독 공사 — 차음 등급 산정 대상 아님. AC-AB 계열로 진행.</div></div>`;
  let h="";

  /* 1 목표 */
  h+=`<div class="bsec"><div class="bh">01 &nbsp;체크하신 소리</div>`;
  if(B.quietOnly){
    h+=`<div class="bp">내보낼 소리가 없는 실(${B.quiet.join(", ")}).
        <b>등급은 무엇을 막느냐로 정한다.</b> 방해 소음원을 먼저 확정해야 설계가 시작된다.</div>`;
  } else {
    h+=`<table class="bt"><tr><th>소리원천</th><th>최저기음</th><th>음압</th><th>별도 경로</th></tr>`;
    B.picked.forEach(([n,f])=>{
      const i=FIND(n);
      h+=`<tr${f===B.lo?' class="hi"':''}><td>${n}</td><td class="m">${f} Hz</td>
          <td class="m">${B.splOf(n)} dB</td>
          <td class="m">${i&&(i[2]==="hit"||i[2]==="hitq")?"바닥 진동":"—"}</td></tr>`;
    });
    h+=`</table>`;
    h+=`<div class="bp">가장 낮은 소리 <b>${B.lo}Hz</b> (${B.loName}) ·
        가장 큰 소리 <b>${B.B_SPL}dB</b></div>`;
  }
  h+=`</div>`;

  /* 필요 차음량 */
  if(B.need!==null){
    h+=`<div class="bsec"><div class="bh">02 &nbsp;필요 차음량</div>`;
    h+=`<table class="bt"><tr><th>소리원천</th><th>음압</th><th>목표</th><th>필요 차음량</th></tr>`;
    const rows = B.quietOnly ? [] : B.picked.slice().sort((a,b)=>B.splOf(b[0])-B.splOf(a[0]));
    rows.forEach(([n,f])=>{
      const sp=B.splOf(n);
      h+=`<tr${sp===B.B_SPL?' class="hi"':''}><td>${n}</td><td class="m">${sp}</td>
          <td class="m">${B.bg[0]}</td><td class="m">${sp-B.bg[0]} dB</td></tr>`;
    });
    h+=`</table>`;
    h+=`<div class="bp">사용 시간대 <b>${D.when}</b> → 목표 배경소음 <b>${B.bg[0]}dB</b>.
        ${B.bg[1]}. ${B.bg[2]?"<b>주거 인접 중간층이라 5dB 조여 잡았다.</b>":""}</div>`;
    h+=`<table class="bt"><tr><th>시간대</th><th>목표</th><th>최대 필요 차음량</th></tr>
      <tr><td>낮에만</td><td class="m">45</td><td class="m">${B.B_SPL-45} dB</td></tr>
      <tr><td>저녁까지</td><td class="m">40</td><td class="m">${B.B_SPL-40} dB</td></tr>
      <tr><td>심야</td><td class="m">30</td><td class="m">${B.B_SPL-30} dB</td></tr>
      </table>`;
    h+=`<div class="bp">낮에만 쓰면 심야 대비 <b>15dB</b>이 내려간다.
        <b>시간대 조정이 등급을 올리는 것보다 효과가 큰 경우가 많다.</b></div>`;
    if(D.when==="밤늦게도 · 10시 이후")
      h+=`<div class="bw"><b>심야 사용.</b> 남는 대역이 있으면 <b>사용 시간 제한을 계약 조건으로 명시</b>한다.
          시공 조건이 아니라 사용 조건이므로 문서에 남기지 않으면 나중에 우리 책임이 된다.</div>`;
    if(D.when==="정해지지 않음")
      h+=`<div class="bw">사용 시간 미정 — 심야 기준으로 잡아두었다. 상담에서 반드시 확정할 것.</div>`;
    h+=`</div>`;
  }

  /* 벽 사다리 · 목표 주파수 */
  if(!B.quietOnly){
    h+=`<div class="bsec"><div class="bh">03 &nbsp;어디까지 잡히는가</div>`;
    h+=`<table class="bt"><tr><th>등급</th><th>공진점 f₀</th><th>막히기 시작</th><th>STC 추정</th></tr>`;
    for(let L=1;L<=5;L++){
      const on = (L===Math.max(1,B.wL));
      h+=`<tr${on?' class="hi"':''}><td>${on?"▶ ":""}L${L}</td><td class="m">${F0[L]} Hz</td>
          <td class="m">${START[L]} Hz 이상</td><td class="m">${STC[L]}</td></tr>`;
    }
    h+=`</table>`;
    h+=`<div class="bp">벽은 자기 공진점 근처에서 가장 약하다. 확실히 막히는 것은
        공진점의 <b>약 1.4배(√2)</b> 위부터다. 위 표의 세 번째 칸이 그 값이다.</div>`;
    if(B.overLimit){
      h+=`<div class="bw"><b>1순위 ${B.loName} ${B.lo}Hz — AC-A로 도달 불가.</b>
          최고 등급 L5의 공진점이 44Hz라 <b>62Hz 아래는 벽으로 막을 수 없다.</b></div>`;
      let rank=1;
      h+=`<table class="bt"><tr><th>순위</th><th>대상</th><th>결과</th></tr>`;
      B.skipped.forEach(([n,f])=>{
        h+=`<tr><td class="m">${rank++}</td><td>${n} ${f}Hz</td><td>AC-A 범위 밖</td></tr>`;
      });
      if(B.noneOK){
        h+=`</table>`;
        h+=`<div class="bw"><b>체크하신 소리가 전부 AC-A 범위 밖이다.</b>
            L5는 우리가 세울 수 있는 최고 등급일 뿐 이 대역을 막는다는 뜻이 아니다.
            <b>박스인박스(AC-B) 전환</b>을 먼저 꺼내고, 그것이 어려우면
            음원 방진 · 실내 저역 저감 · 사용 시간 제한으로 어디까지 줄일 수 있는지를 말할 것.
            "막아드립니다"라고 하면 안 되는 현장이다.</div>`;
      } else {
        h+=`<tr class="hi"><td class="m">${rank}</td><td>${B.targetName} ${B.target}Hz</td>
            <td><b>L${B.wL}로 달성 — 설계 기준</b></td></tr></table>`;
        h+=`<div class="bp"><b>설계 기준 ${B.target}Hz · 벽 L${B.wL}.</b>
            그 아래 대역은 박스인박스(AC-B) 전환, 또는 음원 방진·실내 저역 저감으로 대응한다.</div>`;
      }
    } else {
      h+=`<div class="bp"><b>설계 기준 ${B.lo}Hz · 벽 L${Math.max(1,B.wL)}.</b>
          체크하신 소리는 모두 이 등급으로 대응된다.</div>`;
    }
    if(D.sounds.includes("드럼 (전자)")){
      if(B.eDrumSpk)
        h+=`<div class="bp"><b>전자 드럼 — 스피커 모니터 전제로 잡았다.</b>
            합주·학원에서는 다른 연주자가 드럼을 들어야 하므로 헤드폰만으로는 진행되지 않는다.
            저역이 스피커로 나오므로 <b>어쿠스틱에 준해</b> 산정했다.</div>`;
      else
        h+=`<div class="bw"><b>전자 드럼 — 모니터 방식을 확인할 것.</b>
            헤드폰만 쓰면 공기전달음은 패드 타격음(80dB 안팎)뿐이고 <b>바닥 진동만</b> 남는다.
            스피커를 쓰면 킥 샘플이 어쿠스틱과 같은 저역을 낸다. 등급이 크게 달라진다.</div>`;
    }
    if(B.subLow)
      h+=`<div class="bw"><b>전자 드럼 + 서브우퍼 — 킥 저역을 40Hz로 잡았다.</b>
          서브우퍼를 통해 킥이 재생되면 어쿠스틱보다 더 낮은 대역까지 내려간다.
          실제 기기와 사용 음량을 확인할 것.</div>`;
    if(B.hit) h+=`<div class="bp"><b>충격음 동반.</b> 공기전달음과 별개 경로다.
        슬래브에 들어간 진동은 아래뿐 아니라 기둥·내력벽을 타고 위·옆으로도 돈다.
        <b>바닥 등급은 층 위치와 무관하게 유지</b>하며 한 단계 올려 잡는다.</div>`;
    if(B.loud.length) h+=`<div class="bp"><b>고음압 (${B.loud.join(", ")}).</b> 대역은 높지만 절대 음압이 커서 벽 질량과 기밀이 관건.</div>`;
    if(B.both) h+=`<div class="bp"><b>화상회의 — 양방향.</b> 유입 차단만으로 부족. 통화 음성·스피커 출력도 잡는다.</div>`;
    if(B.inbound) h+=`<div class="bp"><b>유입 차단 중심.</b> 벽 등급보다 창호·환기구·기밀이 성능을 좌우한다.</div>`;
    h+=`</div>`;
  }

  /* 2 실 조건 */
  if(B.modes){
    h+=`<div class="bsec"><div class="bh">04 &nbsp;실 조건 · 룸 모드</div>`;
    h+=`<table class="bt"><tr><th>축</th><th>1차 공진</th></tr>`;
    B.modes.forEach(m=>h+=`<tr><td>${m[0]}</td><td class="m">${m[1].toFixed(1)} Hz</td></tr>`);
    h+=`</table>`;
    if(B.H) h+=`<div class="bp">높이는 <b>방음실높이</b>(공사 후 실치수) 기준이다.
        천장높이 ${D.h}m에서 천장 ${SPEC.C[B.cL].h}mm + 바닥 ${FH[B.fL]}mm를 뺀 값.</div>`;
    h+=`<div class="bp">축방향 1차 모드(c/2L)다. 이 주파수에서 실 안이 뭉친다.
        <b>차음 성능과 무관한 실 형상의 문제</b>이므로 등급을 올려도 사라지지 않는다.</div>`;
    if(B.cube) h+=`<div class="bw"><b>정방형에 가깝다.</b> 두 축의 모드가 겹쳐 특정 대역이 크게 부풀 수 있다. 흡음 배치나 비대칭 마감으로 완화한다.</div>`;
    B.clash.forEach(c=>h+=`<div class="bw"><b>모드 충돌</b> ${c[0]} 기음 ${c[1]}Hz가 ${c[2]} 방향 모드 ${c[3].toFixed(1)}Hz와 겹친다. 그 음이 유독 크게 들린다고 할 가능성.</div>`);
    h+=`</div>`;
  }

  /* 3 부위별 등급 */
  h+=`<div class="bsec"><div class="bh">05 &nbsp;부위별 공법</div>`;
  const wp = (D.space==="음악학원"||D.space==="독서실 · 스터디카페"||
              D.space==="상담실 · 회의실"||D.space==="여러 방을 나누는 공사");
  h+=`<table class="bt">
    <tr><th>부위</th><th>등급</th><th>공법</th><th>두께</th></tr>
    <tr><td>바닥</td><td class="m b">AC-F-${lvName(B.fL)}</td><td>${SPEC.F[B.fL].n}</td><td class="m">${SPEC.F[B.fL].t}</td></tr>
    <tr><td>벽 · 구조벽면</td><td class="m b">AC-WS-${lvName(Math.max(1,B.wL))}</td><td>${SPEC.WS[Math.max(1,B.wL)].n}</td><td class="m">${SPEC.WS[Math.max(1,B.wL)].t}</td></tr>`;
  if(wp) h+=`<tr><td>벽 · 실간 칸막이</td><td class="m b">AC-WP-${lvName(Math.max(1,B.wL))}</td><td>${SPEC.WP[Math.max(1,B.wL)].n}</td><td class="m">${SPEC.WP[Math.max(1,B.wL)].t}</td></tr>`;
  h+=`<tr><td>천장</td><td class="m b">AC-C-${lvName(B.cL)}</td><td>${SPEC.C[B.cL].n}</td><td class="m">${SPEC.C[B.cL].t}</td></tr>
    </table>`;
  h+=`<div class="bp">벽 두께는 <b>LT(목재) / LS(경량스터드)</b> 순이다.</div>`;
  const wlv = Math.max(1,B.wL);
  const DOOR = {1:["단일 방음문","STC 33 이상"],2:["단일 방음문","STC 35 이상"],
                3:["이중 방음문","STC 45 이상 · 단일문 적용 시 벽 성능 10dB 이상 손실"],
                4:["사운드락 권장","자리가 없으면 이중 방음문 + 성능 한계 고지"],
                5:["사운드락 필수","단일문으로는 벽 등급이 성립하지 않는다"]};
  h+=`<div class="bg">출입문</div>`;
  h+=`<div class="bl"><b>${DOOR[wlv][0]}</b> — ${DOOR[wlv][1]}</div>`;
  if(wlv>=3)
    h+=`<div class="bl">벽만 올리고 문을 방치하면 <b>벽에 쓴 돈이 문으로 빠져나간다.</b>
        벽 STC 65에 문 STC 30이면 합성 결과는 40이다.</div>`;
  if(wlv>=4)
    h+=`<div class="bl">사운드락 — 문 간격 <b>900mm 이상</b>, 중간 공간 흡음 처리, 두 문 엇갈림 배치.
        이중 방음문(간격 200~300mm)과는 다른 물건이며 성능 차이가 크다.
        피난 동선이 되므로 문 열림 방향·유효 폭·피난 표시를 함께 확인한다.</div>`;
  if(B.H){
    h+=`<div class="bp">천장 ${D.h}m에서 천장 ${SPEC.C[B.cL].h}mm + 바닥 ${FH[B.fL]}mm를 빼면
        <b>실내 잔여 ${(B.rest/1000).toFixed(2)}m</b>.</div>`;
    if(B.capped)
      h+=`<div class="bw"><b>천장고 제약으로 등급을 낮췄다.</b> 층고가 부족해 목표 등급을
          그대로 쓰면 거실 반자 최소 높이(2.1m)를 못 지킨다. 고객에게 <b>등급을 내릴지,
          높이를 감수할지</b> 선택하게 할 것. 시공 후에 말하면 늦다.</div>`;
    h += altHTML(B);
  }
  if(B.floorNote) h+=`<div class="bp">${B.floorNote}</div>`;
  if(D.floor==="1층 · 필로티 위") h+=`<div class="bp">아래에 사용 공간이 없어 바닥 등급을 낮춰 잡았다. 다만 충격음이 있으면 구조체 전달은 남는다.</div>`;
  if(D.floor==="최상층") h+=`<div class="bp">위에 사용 공간이 없어 천장 등급을 낮춰 잡았다. 옥상 설비 소음·우수 소음은 별도 확인.</div>`;
  if(D.floor==="지하") h+=`<div class="bp">지하 — 소리가 나갈 곳은 적으나 구조체 전달과 결로·환기가 별도 과제다.</div>`;
  h+=`</div>`;


  /* 4 실내 음향 */
  if(B.ac){
    const a=B.ac;
    h+=`<div class="bsec"><div class="bh">06 &nbsp;실내 음향 설계</div>`;
    h+=`<div class="bp">차음이 끝나면 <b>안에서 쓸 수 있는 방인지</b>가 남는다.
        밖으로는 안 나가는데 안이 뭉개지면 합주도 녹음도 안 된다. 아래는 개략 산정(Sabine)이며
        실측 후 조정한다.</div>`;
    h+=`<table class="bt">
      <tr><th>항목</th><th>값</th></tr>
      <tr><td>실 부피</td><td class="m">${a.V.toFixed(1)} m³</td></tr>
      <tr><td>내부 표면적</td><td class="m">${a.S.toFixed(1)} m²</td></tr>
      <tr><td>목표 잔향(RT)</td><td class="m b">${a.tgt.toFixed(2)} 초</td></tr>
      <tr><td>흡음 없을 때</td><td class="m">약 ${a.rtNow.toFixed(2)} 초</td></tr>

          흡음 계획을 견적에 처음부터 포함할 것. 나중에 붙이면 층이 하나 더 생겨
          치수와 마감이 다 틀어진다.</div>`;
    if(B.modes){
      const lowF = Math.min(...B.modes.map(m=>m[1]));
      const q = 343/lowF/4;
      h+=`<div class="bg">저역</div>`;
      h+=`<div class="bl">이 방의 가장 낮은 모드는 <b>${lowF.toFixed(1)}Hz</b>다.
          다공질 흡음재는 파장의 1/4 두께가 있어야 그 대역에서 작동하는데,
          ${lowF.toFixed(0)}Hz면 <b>${q.toFixed(1)}m</b>가 필요하다. 현실적으로 불가능하다.</div>`;
      h+=`<div class="bl">따라서 저역은 흡음보드로 못 잡는다. <b>판진동(멤브레인)형</b>이나
          <b>헬름홀츠 공진기</b>로 대응하며, 모서리(코너)가 모든 모드의 음압이 최대인 지점이라
          가장 효율이 좋다.</div>`;
      if(B.picked.length && B.lo<80)
        h+=`<div class="bl">${B.loName} ${B.lo}Hz 대역을 실제로 쓰므로, 저역 처리를 빼면
            시공 후 "안에서 웅웅거린다"는 지적이 나온다.</div>`;
    }
    h+=`<div class="bg">중고역 · 배치</div>`;
    h+=`<div class="bl">마주 보는 벽이 평행하면 <b>플러터 에코</b>가 생긴다. 한쪽만 흡음하거나
        확산체를 넣어 비대칭으로 구성한다. 네 벽을 균등하게 덮는 것은 좋은 방법이 아니다.</div>`;
    h+=`<div class="bl">천장은 바닥과 마주 보는 평행면이다. 바닥이 반사면(마루)이면
        천장 흡음 비중을 높인다.</div>`;
    if(D.space==="합주실"||D.space==="개인 연습실"||D.space==="음악학원")
      h+=`<div class="bl">과도한 흡음은 금물. 연주자가 자기 소리를 못 들으면 무리하게 세게 치게 되고,
          그러면 차음 부담이 다시 커진다.</div>`;
    if(D.space==="녹음실 · 스튜디오"||D.space==="유튜브 · 스트리밍 · 리딩방")
      h+=`<div class="bl">마이크 주변 초기 반사가 음질을 좌우한다. 마이크 위치 기준
          <b>1차 반사점</b>(측벽·천장·후벽)을 우선 처리한다.</div>`;
    h+=`<div class="bw"><b>흡음은 차음이 아니다.</b> 흡음재를 아무리 붙여도 밖으로 나가는 소리는
        줄지 않는다. 견적서에서 두 항목을 반드시 갈라 적어야 타사 비교에서 오해가 없다.
        (AC-AB 계열로 분리)</div>`;
    h+=`</div>`;
  }

  /* 5 주의 */
  h+=roomsHTML(B);

  h+=`<div class="bsec"><div class="bh">08 &nbsp;시공 주의</div>`;
  let last="";
  B.care.forEach(([g,t])=>{
    if(g!==last){ h+=`<div class="bg">${g}</div>`; last=g; }
    h+=`<div class="bl">${t}</div>`;
  });
  h+=`</div>`;

  /* 5 확인 */
  h+=`<div class="bsec"><div class="bh">09 &nbsp;상담에서 확인할 것</div>`;
  B.ask.forEach(t=>h+=`<div class="bl ck">${t}</div>`);
  h+=`</div>`;

  return h;
}


/* 천장 등급을 바꿔 높이를 벌 때의 선택지 — 바닥은 고정 */
function altHTML(B){
  if(!B.H) return "";
  const CAP = {0:["차음 아님 — 소리는 그대로 위로 감",""],
               1:["중고역만 (5~8dB) — 저역·충격음 통과",""],
               2:["전대역 (벽 지지 독립) — 위층 충격음은 남음",""],
               3:["충격음 포함 · 설비층 별도",""],
               4:["방진행거 — 위층 충격음까지 차단",""],
               5:["최상 — 마감판 상향",""]};

  /* 후보: 현재 등급과 그 아래 두 단계 */
  const cand = [];
  for(let L=B.cL; L>=0 && cand.length<3; L--){
    const rest = B.H - SPEC.C[L].h - FH[B.fL];
    if(rest < 1800) continue;
    const hm = 171.5 / (rest/1000);
    cand.push({L, rest, hm});
  }
  if(cand.length < 2) return "";

  /* 악기 기음과 겹치는지 */
  const clash = f => B.picked.filter(p => Math.abs(p[1]-f)/f < 0.12);

  let h = `<div class="bg">천장 등급별 높이 · 대안</div>`;
  h += `<div class="bp">천장높이 <b>${D.h}m</b> · 바닥 <b>AC-F-${lvName(B.fL)} (${FH[B.fL]}mm)</b> 고정.
        천장 등급만 바꿔 남는 높이를 비교한다.</div>`;
  h += `<table class="bt"><tr><th>대안</th><th>천장</th><th>먹는 높이</th>
        <th>방음실높이</th><th>높이 모드</th><th>잡히는 것</th></tr>`;
  cand.forEach((c,i)=>{
    const cl = clash(c.hm);
    h += `<tr${i===0?' class="hi"':''}>
      <td class="m">${i===0?"권장":"대안 "+(i+1)}</td>
      <td class="m b">AC-C-${lvName(c.L)}</td>
      <td class="m">${SPEC.C[c.L].h} mm</td>
      <td class="m b">${(c.rest/1000).toFixed(2)} m</td>
      <td class="m">${c.hm.toFixed(0)} Hz${cl.length?" ⚠":""}</td>
      <td>${CAP[c.L][0]}</td></tr>`;
  });
  h += `</table>`;

  cand.forEach((c,i)=>{
    const cl = clash(c.hm);
    if(cl.length)
      h += `<div class="bw"><b>${i===0?"권장안":"대안 "+(i+1)}</b> 방음실높이 ${(c.rest/1000).toFixed(2)}m가
            만드는 ${c.hm.toFixed(0)}Hz 모드가 ${cl.map(x=>x[0]+" "+x[1]+"Hz").join(", ")}와 겹친다.
            그 음이 유독 크게 들린다는 지적이 나올 자리다.</div>`;
  });

  const low = cand[cand.length-1];
  if(low.L <= 1)
    h += `<div class="bp">가장 낮은 대안은 천장 차음을 사실상 포기하는 구성이다.
          <b>위층 용도가 주거면 권하지 않는다.</b> 옥상·창고·주차장이면 이 선택이 합리적이다.</div>`;

  h += `<div class="bg">바닥을 낮추는 것에 대해</div>`;
  h += `<div class="bl">바닥을 한 단계 낮추면 <b>${
        FH[B.fL] - FH[Math.max(0,B.fL-1)]}mm</b>를 더 벌 수 있다.
        다만 권하지 않는다 — 충격음 진동은 아래로만 가는 것이 아니라 기둥과 내력벽을 타고
        위·옆으로도 돈다. 바닥을 낮추면 그 경로가 열린다.</div>`;
  h += `<div class="bl">높이가 정말 부족하고 <b>충격음이 없는 현장</b>에 한해 검토한다.
        ${B.hit?"<b>이 건은 충격음이 있어 해당하지 않는다.</b>":"이 건은 충격음이 없어 검토 여지가 있다."}</div>`;
  return h;
}

/* ══════════════ 실별 설계 ══════════════
   D.rooms = [{ name:"A", use:"", sounds:[], w:"", d:"", h:"" }]
   높이(h)는 비워두면 방음실높이(공사 후 실치수)를 쓴다 */
const ROOM_USES = ["개인 연습실","합주실","녹음실 · 스튜디오","컨트롤룸","보컬 부스","음악학원 강의실",
                   "홈시어터","댄스 · 짐","유튜브 · 스트리밍","공부방 · 주식방","작업실",
                   "상담실 · 회의실","대기실 · 공용","기타"];
const RT_USE = {"개인 연습실":"개인 연습실","합주실":"합주실","녹음실 · 스튜디오":"녹음실 · 스튜디오",
  "컨트롤룸":"유튜브 · 스트리밍 · 리딩방","보컬 부스":"녹음실 · 스튜디오","음악학원 강의실":"음악학원",
  "홈시어터":"홈시어터","댄스 · 짐":"댄스 · 짐","유튜브 · 스트리밍":"유튜브 · 스트리밍 · 리딩방",
  "공부방 · 주식방":"공부방 · 주식방","작업실":"작업실","상담실 · 회의실":"상담실 · 회의실",
  "대기실 · 공용":"상담실 · 회의실","기타":"기타"};
/* 문헌 비율 (높이 : 폭 : 길이) — 축 모드가 고르게 퍼지는 조합 */
const RATIOS = [
  {k:"콤팩트", r:[1,1.14,1.39], src:"Sepmeyer"},
  {k:"표준",   r:[1,1.40,1.90], src:"Louden"},
  {k:"넓은",   r:[1,1.60,2.33], src:"Sepmeyer"}
];
const RM_C = 343;

function roomName(i){ return String.fromCharCode(65+i); }
function roomH(r,B){
  const v=parseFloat(r.h); if(v) return v;
  if(B && B.H && B.rest) return B.rest/1000;
  return parseFloat(D.h)||2.4;
}
function roomDims(r,B){
  const w=parseFloat(r.w), d=parseFloat(r.d);
  if(!w||!d) return null;
  return {L:Math.max(w,d), W:Math.min(w,d), H:roomH(r,B)};
}

/* 축 모드 1~4차 + 겹침(5% 이내) + 비율 진단 */
function analyzeDims(L,W,H){
  const ax=[["길이",L],["폭",W],["높이",H]];
  const modes=[];
  ax.forEach(([a,len])=>{ for(let n=1;n<=3;n++) modes.push({axis:a,n,f:RM_C*n/(2*len)}); });
  modes.sort((a,b)=>a.f-b.f);
  const coinc=[];
  for(let i=0;i<modes.length;i++) for(let j=i+1;j<modes.length;j++){
    const a=modes[i], b=modes[j];
    if(a.axis===b.axis) continue;
    if(Math.abs(a.f-b.f)/Math.min(a.f,b.f) < 0.05) coinc.push([a,b]);
  }
  const rat=[["길이/폭",L/W],["길이/높이",L/H],["폭/높이",W/H]];
  const intRatio=rat.filter(([,v])=>{ const k=Math.round(v); return k>=2 && Math.abs(v-k)/k<0.05; });
  return { modes, coinc, lw:L/W, square:L/W<1.15, long:L/W>2.5, intRatio,
           f1:Math.min(...modes.map(m=>m.f)) };
}

/* 높이 기준 최적 치수 3안 */
function proposeDims(H){
  return RATIOS.map(x=>{
    const W=+(H*x.r[1]).toFixed(2), L=+(H*x.r[2]).toFixed(2);
    const a=analyzeDims(L,W,H);
    return {k:x.k, src:x.src, W, L, area:+(W*L).toFixed(1), a};
  });
}

/* 실별 등급 — 접수 판정과 같은 규칙 */
function roomGrade(r,B){
  const fmap={}; B.picked.forEach(([n,f])=>fmap[n]=f);
  const picked=r.sounds.filter(n=>fmap[n]).map(n=>[n,fmap[n]]).sort((a,b)=>a[1]-b[1]);
  let hit=false, quiet=false;
  r.sounds.forEach(n=>{ const i=FIND(n); if(!i) return;
    if(i[2]==="hit"||i[2]==="hitq") hit=true; if(i[2]==="quiet"||i[2]==="both") quiet=true; });
  const pick=f=>{ for(let L=1;L<=5;L++) if(f>=START[L]) return L; return null; };
  let lo=null, loName="", wL=null, over=false;
  for(const [n,f] of picked){ if(lo===null){lo=f;loName=n;} const g=pick(f); if(g){ wL=g; break; } over=true; }
  if(wL===null && picked.length){ wL=5; over=true; }
  if(wL===null && quiet) wL=2;
  const spl = r.sounds.length ? Math.max(...r.sounds.map(B.splOf)) : null;
  return { picked, lo, loName, wL, over, hit, quiet, spl, need: spl!==null ? spl-B.bg[0] : null };
}

/* 현장 치수 진단 → 문제·보완책 */
function roomIssues(r,B,dims,g){
  const a=analyzeDims(dims.L,dims.W,dims.H);
  const out=[];
  if(a.square)
    out.push(["정방형 (길이/폭 "+a.lw.toFixed(2)+")",

      ["칸막이 위치를 옮겨 비율을 벌릴 수 있으면 그것이 1순위 (아래 조정안)",
       "마주 보는 두 벽 중 한쪽만 흡음 — 네 벽 균등 시공 금지",

       "코너 베이스트랩(50K) 4곳 — 모든 모드의 음압 최대점"]]);
  if(a.long)
    out.push(["긴 실 (길이/폭 "+a.lw.toFixed(2)+")",
      "긴 축 방향 플러터 에코와 후벽 반사가 문제. 앞뒤가 멀어 연주자·마이크 위치에 따라 소리가 달라진다.",
      ["후벽 두꺼운 흡음(≥100T 이격) 또는 2D 스카이라인 디퓨저",
       "긴 축 측벽은 비대칭 — 한쪽 흡음·한쪽 확산",
       "가능하면 길이 방향으로 나눠 두 실로 (칸막이 추가)"]]);
  a.intRatio.forEach(([nm,v])=>
    out.push([nm+" ≈ "+Math.round(v)+"배 (정수비)",
      "한 축의 고차 모드가 다른 축 1차와 같은 주파수에 앉는다. 그 대역이 두 배로 강조된다.",
      ["한 변을 5% 이상 바꿔 정수비를 깬다 (아래 조정안)",
       "겹친 주파수를 슬랫·타공 레조네이터(공기층 + 50K 배킹)로 타겟 흡음"]]));
  if(a.coinc.length){
    const seen={}; const list=a.coinc.filter(([x,y])=>{ const k=Math.round((x.f+y.f)/2); if(seen[k]) return false; seen[k]=1; return true; });
    out.push(["모드 겹침 "+list.map(([x,y])=>`${Math.round((x.f+y.f)/2)}Hz (${x.axis}${x.n}·${y.axis}${y.n})`).join(", "),
      "서로 다른 축의 모드가 5% 안에서 겹친다. 그 음이 유독 오래 울린다.",
      ["해당 주파수 타겟 헬름홀츠(슬랫 간격·타공률로 튜닝) — 겹친 두 축의 벽면에",
       "코너 베이스트랩으로 광대역 저역 감쇠",
       "높이 축이 끼어 있으면 천장 등급을 바꿔 높이를 옮기는 대안 검토 (05 참조)"]]);
  }
  /* 악기 기음 충돌 — 1·2차 */
  const clash=[];
  /* 최저 모드보다 낮은 기음은 아래 압력 영역에서 다룬다 */
  g.picked.filter(([,f])=>f>=a.f1).forEach(([n,f])=>a.modes.filter(m=>m.n<=2).forEach(m=>{ if(Math.abs(m.f-f)/f<0.12) clash.push([n,f,m]); }));
  if(clash.length)
    out.push(["악기 기음 ↔ 모드 충돌",
      clash.map(([n,f,m])=>`${n} ${f}Hz ↔ ${m.axis} ${m.n}차 ${m.f.toFixed(1)}Hz`).join(" / ")+". 그 음만 웅웅거린다는 지적이 나올 자리.",
      ["음원 위치 — 1차 모드는 벽·코너에서 최대, 실 중앙에서 최소. 해당 축 중앙 근처에 두고 벽 밀착 금지",
       "충돌 주파수 타겟 레조네이터 또는 멤브레인(GIK Scopus·현장 제작) — 코너 우선",
       "높이 축 충돌이면 천장 등급 대안으로 높이를 바꾸는 것이 가장 확실"]]);
  /* 압력 영역 */
  if(g.lo && g.lo < a.f1)
    out.push(["압력 영역 — "+g.loName+" "+g.lo+"Hz < 최저 모드 "+a.f1.toFixed(1)+"Hz",
      "실이 그 파장보다 작다. 모드가 서지 않고 실 전체가 같은 압력으로 채워진다 — 흡음·베이스트랩이 무력한 대역.",
      ["이 대역은 벽 차음(등급)과 음원 방진으로만 대응",
       "베이스트랩은 "+a.f1.toFixed(0)+"Hz 이상 모드 대역용으로 산정",
       "고객에게 '안에서 저역이 뭉치는 느낌'은 실 크기의 한계임을 고지"]]);
  return {a, out};
}

/* 폭·길이 조정안 — 높이 고정, 한 변 유지 시 다른 변 권장값 */
function adjustHTML(dims){
  const H=dims.H;
  const rows=RATIOS.map(x=>{
    const Lw = +(dims.W*x.r[2]/x.r[1]).toFixed(2);   // 폭 유지 → 길이
    const Wl = +(dims.L*x.r[1]/x.r[2]).toFixed(2);   // 길이 유지 → 폭
    return `<tr><td>${x.k}</td>
      <td class="m">${Lw} m <span class="dim">(${(Lw-dims.L>=0?"+":"")+(Lw-dims.L).toFixed(2)})</span></td>
      <td class="m">${Wl} m <span class="dim">(${(Wl-dims.W>=0?"+":"")+(Wl-dims.W).toFixed(2)})</span></td></tr>`;
  }).join("");
  return `<div class="bg">칸막이 이동으로 맞추는 조정안 · 높이 ${H.toFixed(2)}m 고정</div>
    <table class="bt"><tr><th>비율</th><th>폭 ${dims.W}m 유지 → 길이</th><th>길이 ${dims.L}m 유지 → 폭</th></tr>${rows}</table>
    <div class="bp">괄호는 현재 치수 대비 이동량. 칸막이(AC-WP)는 실측 후 위치를 잡으므로 <b>이 단계에서 옮기는 것이 비용이 가장 적다.</b></div>`;
}

function roomsHTML(B){
  if(!B) return "";
  const HD = (B.H && B.rest) ? B.rest/1000 : (parseFloat(D.h)||2.4);
  const prop = proposeDims(HD);
  let h=`<div class="bsec" id="roomsec"><div class="bh">07 &nbsp;실별 설계</div>`;
  h+=`<div class="bp">실을 나누고 접수된 소리를 실마다 배치한다. 높이는 <b>방음실높이 ${HD.toFixed(2)}m</b>
      (천장 AC-C-${lvName(B.cL)} + 바닥 AC-F-${lvName(B.fL)} 적용 후)를 기본으로 쓴다.</div>`;

  /* 최적 치수 */
  h+=`<div class="bg">최적 치수 — 높이 ${HD.toFixed(2)}m 기준 3안</div>`;
  h+=`<table class="bt"><tr><th>안</th><th>폭 × 길이</th><th>면적</th><th>1차 모드 (길이·폭·높이)</th><th>3차까지 겹침</th></tr>`;
  prop.forEach(p=>{
    const m=["길이","폭","높이"].map(ax=>p.a.modes.find(x=>x.axis===ax&&x.n===1).f.toFixed(0)).join(" · ");
    h+=`<tr><td class="b">${p.k}</td><td class="m b">${p.W} × ${p.L} m</td><td class="m">${p.area} m²</td>
        <td class="m">${m} Hz</td><td class="m">${p.a.coinc.length?p.a.coinc.length+"곳":"없음"}</td></tr>`;
  });
  h+=`</table>`;
  h+=`<div class="bp">세 축의 1차 모드가 서로 떨어져 있고 고차 겹침이 가장 적은 문헌 비율이다.
      <b>현장 치수를 넣기 전에 이 표를 기준으로 칸막이 위치를 잡는다.</b> 부지 폭 · 길이가 정해져 있으면 한 변을 그에 맞추고
      나머지 변을 비율로 구한다.</div>`;

  /* 실 목록 */
  const rooms=D.rooms||[];
  if(!rooms.length) h+=`<div class="bp" style="color:var(--sub)">아직 실이 없다. 실 추가로 시작.</div>`;
  const unassigned = B.picked.map(x=>x[0]).filter(n=>!rooms.some(r=>r.sounds.includes(n)));
  const grades=[];
  rooms.forEach((r,i)=>{
    const g=roomGrade(r,B); grades.push(g);
    const dims=roomDims(r,B);
    h+=`<div class="rm" data-i="${i}">
      <div class="rm-h"><span class="nm">실 ${roomName(i)}</span><span class="use">${r.use||"용도 미정"}</span>
        <button class="x rm-del" data-i="${i}" title="삭제">×</button></div>
      <div class="rm-b">`;
    h+=`<span class="lb">용도</span><div class="chips">`+ROOM_USES.map(u=>
        `<button class="chip rm-use${r.use===u?" on":""}" data-i="${i}" data-v="${u}">${u}</button>`).join("")+`</div>`;
    h+=`<span class="lb">소리 배치</span><div class="chips">`+
        (B.picked.length ? B.picked.map(([n,f])=>
        `<button class="chip rm-snd${r.sounds.includes(n)?" on":""}" data-i="${i}" data-v="${n}">${n} <span style="opacity:.6">${f}</span></button>`).join("")
        : `<span class="bp" style="color:var(--sub);margin:0">접수된 소리 없음 (조용한 실)</span>`)+`</div>`;
    h+=`<span class="lb">내부 치수 (m)</span>
      <div class="row"><span class="il2">가로 × 세로</span>
        <input class="txt w-num rm-w" data-i="${i}" placeholder="폭" inputmode="decimal" value="${r.w||""}"><b>×</b>
        <input class="txt w-num rm-d" data-i="${i}" placeholder="길이" inputmode="decimal" value="${r.d||""}">
        <span class="gap"></span><span class="il2">높이</span>
        <input class="txt w-num rm-h" data-i="${i}" placeholder="${HD.toFixed(2)}" inputmode="decimal" value="${r.h||""}">
        <i>비우면 방음실높이</i></div>`;

    /* 실별 등급 */
    if(r.sounds.length){
      h+=`<div class="bp">최저 기음 <b>${g.lo??"—"}Hz</b> (${g.loName||"—"}) · 최대 음압 <b>${g.spl}dB</b> · 필요 차음량 <b>${g.need}dB</b>
          → 벽 <b>AC-WS-L${g.wL}</b>${g.hit?" · 충격음 → 바닥 우선":""}${g.over?" · <b style='color:var(--stop)'>AC-A 범위 밖 소리 포함</b>":""}</div>`;
    }

    /* 치수 진단 */
    if(dims){
      const R=roomIssues(r,B,dims,g);
      const rtKey = RT[RT_USE[r.use]] ? RT_USE[r.use] : "기타";
      const V=dims.L*dims.W*dims.H, fs=2000*Math.sqrt(RT[rtKey][0]/V);
      const near = prop.slice().sort((p,q)=>Math.abs(p.area-dims.L*dims.W)-Math.abs(q.area-dims.L*dims.W))[0];
      h+=`<table class="bt"><tr><th>항목</th><th>현장</th><th>가까운 안 (${near.k})</th><th>차이</th></tr>
        <tr><td>폭</td><td class="m">${dims.W} m</td><td class="m">${near.W} m</td><td class="m">${(dims.W-near.W>=0?"+":"")+(dims.W-near.W).toFixed(2)}</td></tr>
        <tr><td>길이</td><td class="m">${dims.L} m</td><td class="m">${near.L} m</td><td class="m">${(dims.L-near.L>=0?"+":"")+(dims.L-near.L).toFixed(2)}</td></tr>
        <tr><td>면적</td><td class="m">${(dims.L*dims.W).toFixed(1)} m²</td><td class="m">${near.area} m²</td><td class="m">${(dims.L*dims.W-near.area>=0?"+":"")+(dims.L*dims.W-near.area).toFixed(1)}</td></tr>
        <tr><td>1차 모드</td><td class="m">${["길이","폭","높이"].map(ax=>R.a.modes.find(x=>x.axis===ax&&x.n===1).f.toFixed(0)).join(" · ")} Hz</td>
            <td class="m">${["길이","폭","높이"].map(ax=>near.a.modes.find(x=>x.axis===ax&&x.n===1).f.toFixed(0)).join(" · ")} Hz</td><td class="m">—</td></tr>
        <tr><td>슈뢰더 주파수</td><td class="m">${fs.toFixed(0)} Hz</td><td class="m" colspan="2">이 아래는 모드 영역 — 흡음보드가 아니라 저역 처리로</td></tr>
        </table>`;
      if(!R.out.length)
        h+=`<div class="bp"><b>치수 문제 없음.</b> 정방형·정수비·모드 겹침·악기 충돌 모두 해당 없음.</div>`;
      R.out.forEach(([t,why,fix])=>{
        h+=`<div class="bw"><b>${t}</b> — ${why}</div>`;
        fix.forEach(f=>h+=`<div class="bl">${f}</div>`);
      });
      if(R.a.square||R.a.long||R.a.intRatio.length||R.a.coinc.length) h+=adjustHTML(dims);
    }
    h+=`</div></div>`;
  });

  /* 실간 · 배치 · 적합성 */
  if(rooms.length){
    if(unassigned.length)
      h+=`<div class="bw"><b>배치 안 된 소리</b> — ${unassigned.join(", ")}. 어느 실에서 나는지 정해야 실별 등급이 선다.</div>`;
    const wls=grades.map(g=>g.wL).filter(Boolean);
    if(rooms.length>=2 && wls.length){
      const top=Math.max(...wls);
      h+=`<div class="bg">실간 칸막이</div>`;
      h+=`<div class="bp">실간 칸막이는 <b>인접한 두 실 중 높은 등급</b>을 따른다. 현재 최고 <b>AC-WP-L${top}</b>
          (${SPEC.WP[top].n} · ${SPEC.WP[top].t}mm). 배치도에서 어느 실끼리 맞닿는지 확정 후 칸막이별로 낮출 수 있다.</div>`;
      if(grades.some(g=>g.hit))
        h+=`<div class="bp">충격음 실이 있다 — 부유바닥은 <b>실별로 끊어</b> 시공한다. 한 판으로 깔면 진동이 옆 실로 그대로 간다.</div>`;
    }
    if(!D.noSize && parseFloat(D.w) && parseFloat(D.d)){
      const site=parseFloat(D.w)*parseFloat(D.d);
      const wsT=parseInt(SPEC.WS[Math.max(1,B.wL)].t)/1000;
      const wpT=wls.length ? parseInt(SPEC.WP[Math.max(...wls)].t)/1000 : 0;
      const inner=(parseFloat(D.w)-2*wsT)*(parseFloat(D.d)-2*wsT);
      const sum=rooms.reduce((s,r)=>{ const d=roomDims(r,B); return s+(d?d.L*d.W:0); },0);
      const part=(rooms.length-1)*wpT*Math.min(parseFloat(D.w),parseFloat(D.d));
      const avail=inner-part;
      h+=`<div class="bg">부지 적합성</div>`;
      h+=`<table class="bt"><tr><th>항목</th><th>값</th></tr>
        <tr><td>현장 바닥</td><td class="m">${D.w} × ${D.d} = ${site.toFixed(1)} m²</td></tr>
        <tr><td>외벽 AC-WS-L${Math.max(1,B.wL)} 4면 (${(wsT*1000).toFixed(0)}mm) 제외</td><td class="m">${inner.toFixed(1)} m²</td></tr>
        ${rooms.length>1?`<tr><td>칸막이 ${rooms.length-1}면 (${(wpT*1000).toFixed(0)}mm) 제외 · 개략</td><td class="m">${avail.toFixed(1)} m²</td></tr>`:""}
        <tr class="${sum>avail?"hi":""}"><td>실 내부 면적 합</td><td class="m b">${sum.toFixed(1)} m² ${avail>0?"("+(sum/avail*100).toFixed(0)+"%)":""}</td></tr>
        </table>`;
      if(sum>avail) h+=`<div class="bw"><b>실 합계가 가용 면적을 넘는다.</b> 벽 두께를 빼면 안 들어간다. 실 하나를 줄이거나 등급(두께)을 조정할 것.</div>`;
      else if(avail>0 && sum/avail<0.7 && sum>0) h+=`<div class="bp">가용 면적의 ${(sum/avail*100).toFixed(0)}%만 쓴다. 남는 부분은 복도·대기·사운드락 자리로.</div>`;
    }
  }
  h+=`<div class="rm-foot">
      <button class="rmb" id="rmAdd">+ 실 추가</button>
      <button class="rmb solid" id="rmSave">실별 설계 저장</button>
      <span class="st" id="rmMsg"></span></div>`;
  h+=`</div>`;
  return h;
}

/* 섹션만 다시 그리고 다시 묶는다 — 검토서 전체를 새로 그리지 않음 */
function repaintRooms(id){
  const sec=document.getElementById("roomsec"); if(!sec) return;
  const B=buildBrief(); if(!B) return;
  const ae=document.activeElement, keep = ae && ae.dataset && ae.dataset.i!==undefined
    ? {cls:[...ae.classList].find(c=>c.startsWith("rm-")), i:ae.dataset.i} : null;
  const tmp=document.createElement("div"); tmp.innerHTML=roomsHTML(B);
  sec.outerHTML=tmp.innerHTML;
  bindRooms(id);
  if(keep){ const el=document.querySelector(`.${keep.cls}[data-i="${keep.i}"]`); if(el && el.tagName==="INPUT") el.focus(); }
}

function bindRooms(id){
  const sec=document.getElementById("roomsec"); if(!sec) return;
  const g=x=>document.getElementById(x);
  if(g("rmAdd")) g("rmAdd").onclick=()=>{
    if((D.rooms||[]).length>=8){ alert("실은 8개까지."); return; }
    D.rooms.push({name:roomName(D.rooms.length), use:"", sounds:[], w:"", d:"", h:""});
    repaintRooms(id);
  };
  sec.querySelectorAll(".rm-del").forEach(b=>b.onclick=()=>{
    if(!confirm("실 "+roomName(+b.dataset.i)+"을 지웁니다.")) return;
    D.rooms.splice(+b.dataset.i,1); D.rooms.forEach((r,i)=>r.name=roomName(i)); repaintRooms(id);
  });
  sec.querySelectorAll(".rm-use").forEach(b=>b.onclick=()=>{ D.rooms[+b.dataset.i].use=b.dataset.v; repaintRooms(id); });
  sec.querySelectorAll(".rm-snd").forEach(b=>b.onclick=()=>{
    const r=D.rooms[+b.dataset.i], k=r.sounds.indexOf(b.dataset.v);
    k>-1 ? r.sounds.splice(k,1) : r.sounds.push(b.dataset.v); repaintRooms(id);
  });
  const num=(cls,key)=>sec.querySelectorAll(cls).forEach(el=>{
    el.oninput=e=>{ D.rooms[+el.dataset.i][key]=e.target.value; };
    el.onchange=e=>{ const v=parseFloat(e.target.value), r=D.rooms[+el.dataset.i];
      r[key]= isNaN(v)?"":String(Math.round(v*100)/100); e.target.value=r[key];
      /* 가로·세로가 다 들어왔을 때만 다시 그린다 — 탭으로 넘어가는 중에 화면이 바뀌지 않게 */
      if(key==="h" || (parseFloat(r.w)&&parseFloat(r.d)) || r[key]==="") repaintRooms(id); };
  });
  num(".rm-w","w"); num(".rm-d","d"); num(".rm-h","h");
  if(g("rmSave")) g("rmSave").onclick=()=>saveRooms(id);
}

async function saveRooms(id){
  const msg=document.getElementById("rmMsg"), btn=document.getElementById("rmSave");
  if(!id){ if(msg) msg.textContent="접수 저장 후에 실별 설계를 저장할 수 있다."; return; }
  btn.disabled=true; msg.textContent="저장 중…";
  const before=window.__editBefore||{};
  const log=diffLog(before,D);
  let ok=false;
  try{ const res=await api({action:"update", id, data:D, log, pass:ADMIN_PASS}); ok=!!(res&&res.ok); }catch(e){}
  const rec=await STORE.get("req:"+id);
  if(rec){ rec.data=JSON.parse(JSON.stringify(D)); rec.log=(rec.log?rec.log+"\n":"")+(log||""); await STORE.set("req:"+id,rec); }
  window.__editBefore=JSON.parse(JSON.stringify(D));
  btn.disabled=false;
  msg.textContent = ok ? "저장됨 "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}) : "서버 저장 실패 — 화면에만 반영";
}

  ["소리를 내는 공간", ["개인 연습실","합주실","녹음실 · 스튜디오","음악학원","홈시어터","댄스 · 짐"]],
  ["조용해야 하는 공간", ["공부방 · 주식방","작업실","독서실 · 스터디카페","상담실 · 회의실"]],

      <input class="txt w-num" id="inW" placeholder="4.5" inputmode="decimal" value="${D.w}"${D.noSize?" disabled":""}><i>m</i>

      <input class="txt w-num" id="inD" placeholder="3.2" inputmode="decimal" value="${D.d}"${D.noSize?" disabled":""}><i>m</i>
      <span class="chk${D.noSize?" on":""}" id="ckSize"><span class="bx"></span>모름</span>
      <span class="gap"></span>
      <span class="il2">천장</span>
      <input class="txt w-num" id="inH" placeholder="2.4" inputmode="decimal" value="${D.h}"${D.noH?" disabled":""}><i>m</i>
      <span class="chk${D.noH?" on":""}" id="ckH"><span class="bx"></span>모름</span>
    </div>`;
  h += `<div class="row" style="margin-top:10px"><span class="il2">사용 시간</span>
      <span class="chips">` + ["낮에만 · 오후 6시까지","저녁까지 · 밤 10시까지","밤늦게도 · 10시 이후","정해지지 않음"]
        .map(v=>`<button class="chip wh${D.when===v?" on":""}" data-v="${v}">${v}</button>`).join("") + `</span></div>`;
  h += `</div>`;

  /* 04 현장 */
  h += `<div class="sec"><div class="sh"><span class="sn">4</span><span class="st">현장</span></div>`;

function bind(){
  const g=id=>document.getElementById(id);
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{fn(b.dataset.v);render();});

  on(".chip.sp", v=>{ D.space=v; if(v!=="기타") D.spaceEtc=""; });
  on(".chip.snd", v=>{ const i=D.sounds.indexOf(v); i>-1?D.sounds.splice(i,1):D.sounds.push(v);
                       if(!D.sounds.includes("그 밖의 악기")) D.soundEtc=""; });
  on(".chip.wh", v=>D.when=v);
  on(".chip.rg", v=>D.sido=v);
  on(".chip.bd", v=>D.bldg=v);
  on(".chip.fl", v=>D.floor=v);
  on(".chip.ct", v=>D.ct=v);
  on(".chip.pt", v=>{ D.pt=v; if(v!=="희망 날짜 지정") D.pd=""; });

  const num=(el,key)=>{ if(!el) return;
    el.oninput=e=>{D[key]=e.target.value;check()};
    el.onblur=e=>{const v=parseFloat(e.target.value);
      if(!isNaN(v)){ D[key]=(Math.round(v*10)/10).toFixed(1); e.target.value=D[key]; } check(); }; };
  num(g("inW"),"w"); num(g("inD"),"d"); num(g("inH"),"h");

  const txt=(el,key)=>{ if(el) el.oninput=e=>{D[key]=e.target.value;check()}; };
  txt(g("inGu"),"gu"); txt(g("inBud"),"bud");
  txt(g("inSpaceEtc"),"spaceEtc"); txt(g("inSoundEtc"),"soundEtc");
  if(g("inDate")) g("inDate").onchange=e=>{D.pd=e.target.value;check()};

  if(g("ckSize")) g("ckSize").onclick=()=>{D.noSize=!D.noSize; if(D.noSize){D.w="";D.d="";} render();};
  if(g("ckH"))    g("ckH").onclick=()=>{D.noH=!D.noH; if(D.noH){D.h="";} render();};
  if(g("ckBud"))  g("ckBud").onclick=()=>{D.bTBD=!D.bTBD; if(D.bTBD) D.bud=""; render();};

  const drop=g("drop"), inFile=g("inFile");
  if(drop){
    drop.onclick=()=>inFile.click();
    inFile.onchange=e=>addFiles(e.target.files);
    ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{
      e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{
      e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop",e=>{ if(e.dataTransfer.files) addFiles(e.dataTransfer.files); });
    paintThumbs();
  }

  g("inStaff").value=D.staff; g("inN").value=D.name; g("inP").value=D.phone;
  g("inStaff").oninput=e=>{D.staff=e.target.value;check()};
  g("inN").oninput=e=>{D.name=e.target.value;check()};
  g("inP").oninput=e=>{D.phone=e.target.value;check()};
}

/* 사진을 긴 변 1600px 이하로 줄여 base64 로 만든다 */
function shrink(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej();
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej();
      img.onload=()=>{
        const MAX=1600;
        let w=img.width, hh=img.height;
        if(Math.max(w,hh)>MAX){ const r=MAX/Math.max(w,hh); w=Math.round(w*r); hh=Math.round(hh*r); }
        const cv=document.createElement("canvas"); cv.width=w; cv.height=hh;
        cv.getContext("2d").drawImage(img,0,0,w,hh);
        const url=cv.toDataURL("image/jpeg",0.72);
        res({ name:file.name.replace(/\.[^.]+$/,"")+".jpg", type:"image/jpeg",
              data:url.split(",")[1], thumb:url });
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function addFiles(list){
  const arr=[...list].filter(f=>f.type.indexOf("image/")===0);
  if(!arr.length) return;
  if(FILES.length + arr.length > 12){ alert("사진은 한 번에 12장까지 보낼 수 있습니다."); return; }
  const dp=document.getElementById("drop");
  const keep=dp.innerHTML;
  dp.innerHTML='<div class="t">사진 줄이는 중…</div>';
  for(const f of arr){
    try{ FILES.push(await shrink(f)); }catch(e){}
  }
  dp.innerHTML=keep;
  const inF=document.getElementById("inFile");
  if(inF){ inF.value=""; inF.onchange=e=>addFiles(e.target.files); }
  dp.onclick=()=>document.getElementById("inFile").click();
  paintThumbs(); check();
}

function paintThumbs(){
  const t=document.getElementById("thumbs"); if(!t) return;
  t.innerHTML = FILES.map((f,i)=>`<div class="th">
      <img src="${f.thumb}" alt="">
      <button class="x" data-i="${i}">×</button>
      <div class="n">${f.name}</div></div>`).join("");
  t.querySelectorAll(".x").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); FILES.splice(Number(b.dataset.i),1); paintThumbs(); });
}

function missing(){
  const m=[];
  if(!D.staff.trim()) m.push("담당자");
  if(!D.name.trim()) m.push("고객 성명");
  if(!D.phone.trim()) m.push("고객 연락처");
  if(!D.space) m.push("공간");
  else if(D.space==="기타" && !D.spaceEtc.trim()) m.push("공간 내용");
  if(D.space!=="흡음"){
    if(!D.sounds.length) m.push("무엇을 하는가");
    else if(D.sounds.includes("그 밖의 악기") && !D.soundEtc.trim()) m.push("악기 이름");
    if(!D.bldg) m.push("건물");
    if(!D.floor) m.push("층");
  }
  if(!D.noSize && !(D.w.trim() && D.d.trim())) m.push("바닥 크기");
  if(!D.noH && !D.h.trim()) m.push("천장 높이");
  if(!D.when) m.push("사용 시간대");
  if(!D.sido) m.push("지역");
  if(!D.gu.trim()) m.push("시군구");
  if(!D.ct) m.push("계약 여부");
  if(!D.pt) m.push("희망 시기");
  else if(D.pt==="희망 날짜 지정" && !D.pd) m.push("희망 날짜");
  if(!D.bTBD && !D.bud.trim()) m.push("예산");
  return m;
}

function summaryRows(){

  r.push(["공간", D.space==="기타"?D.spaceEtc:(D.space==="흡음"?"실내 울림(흡음)만":D.space)]);
  if(D.space!=="흡음"){
    const t=D.sounds.filter(x=>x!=="그 밖의 악기");
    if(D.soundEtc) t.push(D.soundEtc);
    r.push(["소리", t.join(", ")||"—"]);
  }
  r.push(["크기", D.noSize?"모름":`${D.w} × ${D.d} m`]);
  r.push(["천장", D.noH?"모름":`${D.h} m`]);
  r.push(["사용 시간", D.when]);
  r.push(["지역", `${D.sido} ${D.gu}`]);
  if(D.space!=="흡음"){ r.push(["건물", D.bldg]); r.push(["층", D.floor]); }
  r.push(["계약", D.ct]);
  r.push(["시기", D.pt==="희망 날짜 지정" ? D.pd : D.pt]);
  r.push(["예산", D.bTBD?"상담 후 결정":`${D.bud} 만원`]);
  r.push(["고객", `${D.name} · ${D.phone}`]);
  r.push(["담당자", D.staff]);
  return r;
}

         ok = !!(res && res.ok); }catch(e){}
    if(FILES.length){

             files:FILES.map(f=>({name:f.name,type:f.type,data:f.data})), pass:ADMIN_PASS}); }catch(e){}
      FILES=[];

             rec.log=(rec.log?rec.log+"\n":"")+(log||"");

    const id2=EDIT_ID; EDIT_ID=null; FILES=[];

/* 변경된 항목만 뽑아 한 줄로 */
function diffLog(before, after){
  const L = {space:"공간", spaceEtc:"공간 내용", sounds:"소리", soundEtc:"악기 직접입력",
             w:"가로", d:"세로", noSize:"크기 모름", h:"천장높이", noH:"천장고 모름",
             when:"사용시간", sido:"지역", gu:"시군구", bldg:"건물", floor:"층",
             ct:"계약", pt:"희망시기", pd:"희망날짜", bud:"예산", bTBD:"예산 협의",
             staff:"담당자", name:"고객성명", phone:"고객연락처"};
  const out=[];
  if(JSON.stringify(before.rooms||[])!==JSON.stringify(after.rooms||[]))
    out.push("실별 설계 "+(before.rooms||[]).length+"실 → "+(after.rooms||[]).length+"실 갱신");
  Object.keys(L).forEach(k=>{
    const a=Array.isArray(before[k])?before[k].join(", "):String(before[k]??"");
    const b=Array.isArray(after[k])?after[k].join(", "):String(after[k]??"");
    if(a!==b) out.push(`${L[k]} ${a||"—"} → ${b||"—"}`);
  });
  if(!out.length) return "";
  const d=new Date();
  const t=`${String(d.getFullYear()).slice(2)}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  return t + " · " + out.join(" / ");
}

const STCLS = {"신규":"st-new","전화연락완료":"st-call","계약진행":"st-go","계약완료":"st-done","시공완료":"st-fin","방음부스추천":"st-booth","보류":"st-hold","진행포기":"st-drop"};
const PER=10; let page=0, ADMIN_PASS=null, EDIT_ID=null;

document.getElementById("adminBtn").onclick=async ()=>{
  if(!ADMIN_PASS){
    const v=prompt("관리자 비밀번호"); if(!v) return;
    let ok=false;
    try{ const r=await api({action:"checkpass",pass:v}); ok=!!(r&&r.ok); }catch(e){}
    if(!ok){ alert("비밀번호가 맞지 않습니다."); return; }
    ADMIN_PASS=v;
  }
  renderAdmin();
};

function fmt(v){ if(!v) return "—"; const d=new Date(v);
  return isNaN(d)?String(v):d.toLocaleString("ko-KR",{year:"2-digit",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }

async function renderAdmin(inner){
  document.body.classList.add("admin");
  document.getElementById("intake").style.display="none";
  document.getElementById("foot").style.display="none";
  document.getElementById("hdTitle").textContent="관리자";
  let hits=[];
  try{ const res=await api({action:"list",n:500,pass:ADMIN_PASS}); if(res&&res.ok) hits=res.hits; }catch(e){}
  if(!hits.length) hits=(await STORE.get("req:index"))||[];
  window.__hits=hits;
  const el=document.querySelector(".body")||document.querySelector(".done");
  el.outerHTML=`<div class="body" id="body" style="padding:0">
    <div class="abar">
      <button id="bHome" class="ghost">◀ 목록</button><span class="sep"></span>
      <span class="l">신청번호</span><input class="w1" id="fId" placeholder="…AC26-0001">
      <button id="bLoad">불러오기</button><span class="sep"></span>
      <input class="w2" id="fName" placeholder="성명"><input class="w3" id="fPhone" placeholder="연락처">
      <button id="bFind">찾기</button><span class="sep"></span>
      <button id="bPrint">인쇄</button>
      <button class="solid" onclick="location.reload()">접수화면</button>
    </div>
    <div style="padding:18px 34px 30px" id="apane">${inner || listPane(hits,page)}</div>
  </div>`;
  bindAdmin();
}

function listPane(hits,pg){
  if(!hits.length) return `<div class="bp" style="color:var(--sub)">접수된 신청서가 없습니다.</div>`;
  const total=Math.ceil(hits.length/PER);
  pg=Math.max(0,Math.min(pg,total-1)); page=pg;
  const sl=hits.slice(pg*PER,pg*PER+PER);
  const rows=sl.map(x=>{ const st=x.status||"신규";
    return `<div class="reqrow" data-id="${x.id}">
      <span><span class="id">${x.id}</span><br><span class="mt">${x.space||"—"} · ${x.name||"—"}${x.staff?" · "+x.staff:""}</span></span>
      <span class="mt">${fmt(x.at)}</span>
      <button class="stt ${STCLS[st]||"st-new"}" data-st="${x.id}">${st}</button>
      <button class="del" data-del="${x.id}">×</button></div>`;}).join("");
  return `<div class="sub">접수 ${hits.length}건 · ${pg*PER+1}–${pg*PER+sl.length}</div>
    <div id="reqList">${rows}</div>
    <div class="pager"><button id="pPrev" ${pg===0?"disabled":""}>◀ 이전</button>
      <span>${pg+1} / ${total}</span>
      <button id="pNext" ${pg>=total-1?"disabled":""}>다음 ▶</button></div>`;
}

function repaint(hits,pg){ document.getElementById("apane").innerHTML=listPane(hits,pg); bindList(); }

async function adminHome(){
  EDIT_ID=null; FILES=[];
  const sv=document.getElementById("save");
  if(sv){ sv.textContent="접수 저장"; sv.disabled=false; }
  page=0;
  await renderAdmin();
}

function bindAdmin(){
  const g=id=>document.getElementById(id);
  if(g("bHome")) g("bHome").onclick=adminHome;
  g("bLoad").onclick=()=>showBrief(g("fId").value.trim());
  g("bPrint").onclick=()=>window.print();
  g("bFind").onclick=async ()=>{
    const nm=g("fName").value.trim(), ph=g("fPhone").value.replace(/[^0-9]/g,"");
    if(!nm && !ph){ alert("성명 또는 연락처를 입력하세요."); return; }
    let hits=window.__hits||[];
    try{ const res=await api({action:"find",q:ph||nm,pass:ADMIN_PASS});
         if(res&&res.ok&&res.hits.length) hits=res.hits; }catch(e){}
    const f=hits.filter(x=>(!nm||String(x.name||"").indexOf(nm)>-1) &&
                           (!ph||String(x.phone||"").replace(/[^0-9]/g,"").indexOf(ph)>-1));
    if(!f.length){ alert("찾는 신청서가 없습니다."); return; }
    if(f.length===1){ showBrief(f[0].id); return; }
    window.__hits=f; repaint(f,0);
  };
  bindList();
}

function bindList(){
  const hits=window.__hits||[];
  document.querySelectorAll(".reqrow").forEach(b=>b.onclick=()=>showBrief(b.dataset.id));
  document.querySelectorAll(".pager button").forEach(b=>b.onclick=e=>{e.stopPropagation();
    repaint(hits, b.id==="pPrev"?page-1:page+1);});
  document.querySelectorAll(".stt").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const id=b.dataset.st, cur=b.textContent.trim();
    const next=STATUS[(STATUS.indexOf(cur)+1)%STATUS.length];
    b.textContent=next; b.className="stt "+(STCLS[next]||"st-new");
    const rec=hits.find(x=>x.id===id); if(rec) rec.status=next;
    try{ await api({action:"status",id,status:next,pass:ADMIN_PASS}); }catch(e){}
  });
  document.querySelectorAll(".del").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const id=b.dataset.del;
    if(!confirm(id+" 신청서를 삭제합니다. 되돌릴 수 없습니다.")) return;
    try{ await api({action:"remove",id,pass:ADMIN_PASS}); }catch(e){}
    const idx=(await STORE.get("req:index"))||[];
    await STORE.set("req:index", idx.filter(x=>x.id!==id));
    window.__hits=hits.filter(x=>x.id!==id);
    repaint(window.__hits,page);
  });
}

async function showBrief(id){
  if(!id) return;
  let rec=null, from="";
  try{ const res=await api({action:"find",q:id,pass:ADMIN_PASS});
       if(res&&res.ok&&res.hits.length){
         const h=res.hits[0];
         if(h.data && Object.keys(h.data).length){ rec={at:h.at,data:h.data,log:h.log||"",files:h.files||0,filesUrl:h.filesUrl||""};
           from = h.data._rebuilt ? "복원" : "서버"; }
       } }catch(e){}
  if(!rec){
    const local=await STORE.get("req:"+id);
    if(local && local.data && Object.keys(local.data).length){
      rec={at:local.at,data:local.data,log:local.log||""}; from="로컬";
    }
  }
  if(!rec){
    alert(id+" 의 상세 내용을 불러오지 못했습니다.\n\n"
      +"시트의 '원본' 열이 비어 있는 건일 수 있습니다.\n"
      +"이 스크립트를 적용하기 전에 접수된 건은 상세 내용이 없습니다.");
    return;
  }

  /* 기본값으로 초기화한 뒤 덮어써야 이전 화면 값이 남지 않는다 */
  const BLANK = { space:null, spaceEtc:"", sounds:[], soundEtc:"", rooms:[],
    w:"", d:"", noSize:false, h:"", noH:false, when:null,
    sido:null, gu:"", bldg:null, floor:null,
    ct:null, pt:null, pd:"", bud:"", bTBD:false,
    staff:"", name:"", phone:"" };
let FILES = [];   // {name,type,data(base64),thumb}
  Object.keys(BLANK).forEach(k=>D[k]=BLANK[k]);
  Object.keys(rec.data).forEach(k=>{ if(k in D) D[k]=rec.data[k]; });
  if(!Array.isArray(D.sounds)) D.sounds=[];
  if(!Array.isArray(D.rooms)) D.rooms=[];
  /* 숫자로 저장된 값이 섞여도 문자열로 통일 */
  ["w","d","h","bud","gu","name","phone","staff","spaceEtc","soundEtc","pd"]
    .forEach(k=>{ if(D[k]!=null) D[k]=String(D[k]); });
  window.__editBefore = JSON.parse(JSON.stringify(rec.data));
  window.__lastRec = rec;
  if(!D.space && !D.sounds.length){
    alert("불러온 내용이 비어 있습니다.\n\n출처: "+from
      +"\n받은 항목: "+Object.keys(rec.data).join(", ").slice(0,200));
  }

  await renderAdmin(`<div class="idbox" style="margin-top:0"><div class="l">신청번호</div>
      <div class="no">${id}</div>
      <div class="sm">${fmt(rec.at)} 접수 · 고객 ${D.name||""} ${D.phone||""}${D.staff?" · 담당 "+D.staff:""}
        ${from?`<span style="color:${from==="복원"?"#a8281b":"#b6b4ab"}"> · ${from}</span>`:""}</div>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:center">
        <button class="btn gh" id="backBtn" style="padding:9px 20px;font-size:13px">◀ 목록</button>
        <button class="btn go" id="editBtn" style="padding:9px 22px;font-size:13px"
          data-id="${id}">내용 수정</button></div></div>
    ${rec.files?`<div class="logbox"><div class="logh">현장 사진 ${rec.files}장</div>
        <a href="${rec.filesUrl}" target="_blank" class="flink">드라이브 폴더 열기 →</a></div>`:""}
    ${rec.log?`<div class="logbox"><div class="logh">수정 이력</div>${
      String(rec.log).split("\n").filter(Boolean).map(l=>`<div class="logl">${l}</div>`).join("")}</div>`:""}
    <div class="peek"><div class="peek-b">${briefHTML()}</div></div>`);
  const eb=document.getElementById("editBtn");
  if(eb) eb.onclick=()=>startEdit(id);
  bindRooms(id);
  const bb=document.getElementById("backBtn");
  if(bb) bb.onclick=adminHome;
}

render();
</script>
</body>
</html>
